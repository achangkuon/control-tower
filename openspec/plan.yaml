  - id: S5.15
    resultado: Ninguna línea de producción de la Torre abre un documento de plan; deriveNextModule y session-plan-snapshot se retiran, mientras compareWorkerClaim sobrevive intacto.
    autoridad: Contrato histórico de la decisión 78, el test de contenido de la frontera Torre-gentle-ai y la reapertura del camino D de la decisión 74; se conserva sólo como evidencia archivada y no confiere autoridad de ejecución actual.
    depende_de: [S5.5, S102]
    recurso: [RUNTIME_PAYLOAD_FILES]
