  - id: S141
    zona: metodo
    prioridad: metodo-v1
    resultado: "Toda intención manual de iniciar, continuar o retomar implementación atraviesa una admisión Radar fresca antes de elegir skill; una Sesión no elegible sólo produce su estado y las opciones LISTO actuales, sin caer en cierre de decisiones."
    autoridad: "Issue #137 autorizado por Emilio para este lote: el incidente siguió una familia histórica S12 y abrió decisiones de S12.3 aunque Radar ofrecía otras Sesiones LISTO. La corrección se limita a Chanks/manual y no toca runtime ni skills Tower."
    depende_de: []
    cimientos: []
    recurso: []
    criterios:
      - "Support define un bundle de admisibilidad ligado al HEAD actual, compuesto por `radar status --json`, `radar sesion <ID>`, el estado/bloqueo pedido y las opciones `LISTO` en orden de cola por Zona."
      - "El bundle distingue explícitamente capacidad compatible (`asientos`), longitud/orden de cola y cantidad de opciones `LISTO`; ninguno se presenta como cantidad de agentes asignables."
      - "El routing exige ese bundle fresco antes de seleccionar cualquier skill para start/continue/resume implementation; una Sesión no `LISTO` produce sólo estado, bloqueo y opciones actuales."
      - "`chanks-3-session-kickoff` falla cerrado ante bundle ausente, HEAD divergente o ID no admisible, y preserva el resume exacto desde el primer Módulo pendiente cuando la Sesión ya iniciada tiene evidencia válida."
      - "`chanks-1-cierre-de-decisiones` se activa sólo por pedido humano explícito de resolver la decisión nombrada, consume evidencia Radar mediante Support y nunca es fallback de una continuación rechazada."
      - "La plantilla instalada proyecta el mismo gate en los cuatro runtimes; las pruebas fallan si reaparece lectura directa de `plan.yaml`, bypass de kickoff o confusión entre asientos, cola y opciones LISTO."
      - "El cambio toca sólo `agent-workflows/`, no carga Tower, y `python3 -m unittest discover -s agent-workflows/tests` pasa."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Dónde vive el gate que impide seguir una Sesión histórica no elegible?"
        resolucion: "En la frontera manual Chanks antes de selección de skill, con defensa independiente dentro de kickoff; Tower queda fuera del alcance."
        autoridad: "Decisión previa de Emilio para #137: gate sólo en Chanks, sin ampliar Tower."
        clase: contrato-visible; expansion-de-alcance
        falsificador: "La corrección modifica Tower o una intención de implementación alcanza cierre de decisiones antes de probar admisibilidad Radar."
        descartadas:
          - opcion: "Agregar el gate al runtime Tower."
            razon: "El defecto pertenece al flujo manual pre-Tower y ampliaría una autoridad no involucrada."
      - tipo: resuelta
        pregunta: "¿Puede cierre de decisiones abrirse desde una continuación rechazada?"
        resolucion: "No; requiere un pedido humano nuevo y explícito para la decisión nombrada."
        autoridad: "Contrato esperado de #137 y decisión del mantenedor de no inferir autoridad desde una mención histórica."
        clase: contrato-visible
        falsificador: "El sistema propone o abre cierre de decisiones sin un pedido humano independiente."
        descartadas: []
    ruta:
      propuesta: direct
      autoridad: "Radar ya expone HEAD, prioridad, estados, colas y asientos; el cambio sólo conecta esos datos en contratos y regresiones Chanks con conducta completamente determinada."
      revalidacion:
        resultado: direct
        base: 168a47e528c174868c4487537a5b9319efbdc28c
        evidencia: "El bypass persiste: session-routing contiene prosa advisory, kickoff consulta sólo `radar sesion`, cierre de decisiones lee plan.yaml directamente y las pruebas de instalación verifican palabras aisladas en vez de la ruta negativa. Support ya posee la frontera Radar reutilizable."
    modulos:
      - id: M141.1
        resultado: "Gate de admisión Radar imposible de saltear en routing, Support, kickoff y cierre de decisiones."
        rutas: [agent-workflows/skills/chanks-0-agente-soporte/SKILL.md, agent-workflows/skills/chanks-0-agente-soporte/assets/brief-diario.md, agent-workflows/skills/chanks-0-agente-soporte/assets/assignment-implementation.md, agent-workflows/skills/chanks-3-session-kickoff/SKILL.md, agent-workflows/skills/chanks-1-cierre-de-decisiones/SKILL.md, agent-workflows/skills/chanks-1-cierre-de-decisiones/references/decision-extraction.md, agent-workflows/templates/session-routing.md, agent-workflows/tests/test_builder_flow.py, agent-workflows/tests/test_install.py]
        tareas:
          - id: T141.1.1
            accion: "RED: exigir bundle fresco, rechazo de no-LISTO sin fallback, pedido explícito de decisiones, resume exacto y separación asientos/cola/opciones."
            resultado: "RED: las pruebas contractuales fallan contra el routing advisory, kickoff sin admisión y lectura directa del plan."
            criterios: ["Cada bypass y confusión de capacidad tiene una aserción negativa nombrada."]
          - id: T141.1.2
            accion: "GREEN: definir el bundle en Support y hacerlo obligatorio en routing, kickoff y cierre de decisiones sin duplicar el cálculo de Radar."
            resultado: "GREEN: una intención elegible llega a kickoff; una no elegible termina con estado y opciones, y una decisión sólo abre por pedido explícito."
            criterios: ["El mismo HEAD e ID aparecen en status, sesion, handoff y readback."]
          - id: T141.1.3
            accion: "REFACTOR: eliminar lectura directa y prosa duplicada, proyectar el gate a instalación y conservar el boundary manual/Tower."
            resultado: "REFACTOR: Support produce evidencia, routing elige, kickoff defiende y cierre de decisiones queda aislado."
            criterios: ["El diff queda en las nueve rutas declaradas y la suite del Método pasa."]
    entrega:
      commit: 832b115bd358a68b7b9253e1c936f8a223c24d94

  - id: S142
    zona: metodo
    prioridad: metodo-v1
    resultado: "Una skill stateless de Tramo 3 coordina lotes manuales Tower-off ya aprobados, retorna tras el handoff, reacciona a eventos worker y serializa integración/cierre sin asumir trabajo, review ni autoridad Tower."
    autoridad: "Issue #143 y sus decisiones explícitas: skill manual stateless en Tramo 3; aprobación humana única liga cantidad, Sesiones LISTO y workers Pi exactos; S137 aporta transporte no bloqueante, S131 pool reutilizable y S141 admisión Radar. Emilio autorizó reconstruir una asignación ya despachada e integrar sólo con terminal confirmado y readbacks exactos, sin despachar, reintentar ni cambiar el mapeo."
    depende_de: [S131, S137, S141]
    cimientos: []
    recurso: []
    criterios:
      - "`chanks-3-coordinador-manual` carga sólo después de una aprobación humana completa que liga cantidad paralela, IDs de Sesión, alias/worker, kind/runtime Pi, session ID y cwd/worktree exactos; no selecciona, sustituye, reduce, amplía ni reordena el lote."
      - "El coordinador delega admisión, pool, Herdr, Intercom, locks y retiro a `chanks-3-despacho-herdr`, confirma cada handoff y retorna inmediatamente sin wait, polling, retry ni seguimiento activo."
      - "Cada implementer conserva implementación, self-verification, RDD y commits de Módulo; Main no inspecciona, revisa, corrige ni vuelve a ejecutar la candidata del worker."
      - "Main procesa sólo eventos inbound `COMPLETED`, `BLOCKED` o `FAILED`: integra una Sesión confirmada por vez, detiene conflictos sin resolverlos y coordina evidencia de plan/cierre/retiro mediante las skills existentes."
      - "`BLOCKED`, `FAILED`, progreso, desconexión o ausencia de Main preservan worker y worktree; no crean cola, roster, ledger, auto-resume, fallback de transporte ni inferencia de completion."
      - "Tras salida de Main, una activación humana puede reconstruir sólo una asignación ya despachada desde Git, Radar, Herdr y readback Intercom; terminal y readbacks exactos autorizan integrar/cerrar esa asignación, nunca despachar, reintentar o cambiar su mapeo."
      - "La misma skill permanece como fallback manual Tower-off después de completar V1, sin leer/escribir estado Tower, cargar skills Tower ni reclamar autoridad Tower."
      - "La skill incluye una tabla de migración que separa evidencia/choreography manual de autoridad, ack/retry, terminalidad, checkpoint y delivery Tower V1."
      - "Un journey contractual prueba dos workers Pi, handoffs independientes, retorno de Main, eventos terminales e integración serial; las suites del Método e instalación pasan y el diff implementado no supera 400 líneas."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Qué artefacto contiene la coordinación manual Tower-off?"
        resolucion: "Una skill deliberadamente stateless `chanks-3-coordinador-manual` dentro del Tramo 3 Routing."
        autoridad: "Decisión explícita de Emilio registrada en #143."
        clase: contrato-visible; expansion-de-alcance
        falsificador: "La coordinación revive coordinador_multi_agente, crea un octavo tramo o embebe procedimientos de ejecución/entrega."
        descartadas:
          - opcion: "Human-only sin skill."
            razon: "Mantendría el contrato en contexto conversacional y reproduciría la fricción."
          - opcion: "Skill chanks-0 transversal."
            razon: "La carga ocurre sólo tras aprobación del lote y pertenece al límite de routing."
      - tipo: resuelta
        pregunta: "¿Qué liga la aprobación previa a cargar el coordinador?"
        resolucion: "Cantidad paralela, IDs exactos LISTO y alias, kind/runtime Pi, session ID y cwd/worktree exactos por Sesión, en una aprobación humana completa."
        autoridad: "Decisión explícita de Emilio registrada en #143."
        clase: contrato-visible; seguridad-y-permisos
        falsificador: "El coordinador completa, reduce, sustituye o reordena cualquier parte del lote."
        descartadas:
          - opcion: "Aprobar sólo cantidad."
            razon: "Permitiría autoasignación manual pre-Tower."
      - tipo: resuelta
        pregunta: "¿Qué puede hacer una nueva Main después de que la Main original sale?"
        resolucion: "Con terminal confirmado y readbacks exactos de Git, Radar, Herdr e Intercom puede integrar y cerrar sólo la asignación ya despachada; no puede despachar, reintentar ni cambiar el mapeo."
        autoridad: "Elección explícita de Emilio durante el checkpoint previo a RED de S142."
        clase: seguridad-y-permisos; operacion-irreversible
        falsificador: "La reconstrucción produce un efecto nuevo de dispatch/retry, cambia worker/Sesión o integra sin terminal y readbacks exactos."
        descartadas:
          - opcion: "Nueva aprobación completa antes de integrar."
            razon: "Agrega una interrupción aun cuando las fuentes autoritativas prueban exactamente la asignación ya despachada y su terminal."
          - opcion: "Persistir aprobación o estado propio."
            razon: "Crearía el ledger/roster durable que el contrato pre-Tower prohíbe."
    ruta:
      propuesta: direct
      autoridad: "Las decisiones de artefacto, ubicación, aprobación, runtime, eventos, ownership, reconstrucción y migración están cerradas; las dependencias entregadas fijan las interfaces que la skill sólo referencia."
      revalidacion:
        resultado: direct
        base: 1e88aa1d82758ad182085d491561fcbe2a8d3e2d
        evidencia: "S131 entrega pool persistente; S137 separa Herdr/Intercom y retorna tras send; S141 instala admisión Radar; chanks-4-puente conserva verify/RDD/commits en implementers y chanks-7-session-doc conserva cierre. Falta únicamente el router stateless entre esos límites."
    modulos:
      - id: M142.1
        resultado: "Coordinador manual stateless y journey de dos workers con integración serial."
        rutas: [agent-workflows/skills/chanks-3-coordinador-manual/SKILL.md, agent-workflows/templates/session-routing.md, agent-workflows/tools/install.py, agent-workflows/README.md, agent-workflows/tests/test_coordinador_manual.py, agent-workflows/tests/test_despacho_herdr.py]
        tareas:
          - id: T142.1.1
            accion: "RED: exigir aprobación completa previa, dispatch delegado no bloqueante, eventos inbound, ownership del implementer, integración serial, reconstrucción acotada y exclusiones Tower/state."
            resultado: "RED: el routing actual carga dispatcher directamente y no existe el coordinador ni su journey terminal."
            criterios: ["Cada autoridad, evento, efecto prohibido y fila de migración tiene una aserción falsificable."]
          - id: T142.1.2
            accion: "GREEN: crear la skill stateless, registrarla en instalador/README y enrutar lotes aprobados a ella antes del dispatcher."
            resultado: "GREEN: dos workers Pi reciben handoffs independientes y Main integra sus terminales uno por vez sin supervisión activa."
            criterios: ["La skill sólo referencia contratos existentes y no crea estado, runtime o procedimientos duplicados."]
          - id: T142.1.3
            accion: "REFACTOR: consolidar modos dispatch/event/reconstruction, tabla de migración y límites Tower-off; eliminar frases que transfieran review o ejecución a Main."
            resultado: "REFACTOR: una frontera legible separa choreography manual, evidencia y autoridad Tower V1."
            criterios: ["El diff queda en las seis rutas declaradas, no supera 400 líneas y la suite del Método pasa."]
    entrega:
