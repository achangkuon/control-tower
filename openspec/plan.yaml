        falsificador: "Se inicia S148 sin S147 entregada e integrada, se presume un corte, forecast o excepción aprobados, se escribe SQL/código sin desglose y autoridad de inicio o se permite perder historia o activar la Torre por esta decisión."
  - id: S149
    prioridad: torre-v1
    resultado: La capa semáforo se distribuye como un ejecutable único que no exige bun instalado y conserva el contrato tower_* observable.
    autoridad: "Corte Torre V1 aprobado por Emilio el 2026-09-18 (Engram 11327): la Torre V1 es el semáforo compilado, Radar y las skills. Eligió explícitamente compilar con `bun build --compile` sobre el código vigente en lugar de reescribir en Go, aceptando un ejecutable de mayor tamaño por llevar el runtime adentro, para preservar las 364 líneas ya verificadas y su suite. La medición que sostiene el corte está en Engram 11325 y 11326."
    depende_de: []
    encargo:
      pedido_contexto: >-
        La capa semáforo de core.mjs —register, setState, send, receive, acquire, release,
        transfer, forceRelease, status, locate, probeMode, open y deactivate, medidas hoy en
        core.mjs:4318-4681— se distribuye como ejecutable único. Hoy la Torre exige bun
        instalado y se presenta como un conjunto de scripts; el producto que se entrega a un
        tercero necesita un artefacto que se copie y corra. Esta Sesión produce el binario y su
        frontera observable; no rediseña el semáforo, no toca la capa continuation y no decide
        el empaquetado, que pertenece a S8.12.
      resultado_comportamiento: >-
        Existe un ejecutable único, reproducible desde el árbol, que expone el contrato tower_*
        con el mismo comportamiento observable que hoy: registro por directorio, estados,
        mensajes, y los locks git-delivery y db-writer con su semántica de transferencia. El
        interruptor ACTIVE y la base por repositorio bajo git-common-dir conservan su ubicación
        y su formato; un repositorio ya armado sigue funcionando sin migración ni reimportación.

        El binario no transporta la capa continuation. Una invocación de una operación de
        continuation contra el binario falla cerrado con error tipado, no con un éxito parcial
        ni con una operación silenciosamente ausente.

        La suite vigente sigue pasando sobre el código fuente sin modificar sus aserciones, y
        una prueba nueva ejercita el ejecutable ya construido —no el módulo importado— sobre un
        repositorio temporal: registrar dos agentes, encolar y consumir un mensaje, tomar el
        lock de entrega, transferirlo y soltarlo.

        El ejecutable declara su versión y la revisión del árbol que lo produjo, de modo que
        S8.12 pueda enumerarlo por huella exacta.
      restricciones_decisiones: >-
        Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana
        explícita. El territorio todavía no está resuelto: falta decidir si la capa semáforo se
        extrae a un módulo propio o se compila desde core.mjs tal como está, y esa decisión
        determina los archivos y los Cimientos exactos. Hasta resolverla el Encargo permanece
        incompleto y no autoriza archivos, Cimientos ni escritura.

        core.mjs, mcp.mjs, bin/torre, install.sh y package.json son Cimientos: su intervención
        exige reserva exacta por archivo y aprobación humana fresca. No se toca la capa
        continuation, ni sus migraciones, ni sus pruebas. No se cambia el esquema de las tablas
        agent, message y lock. No se activa la Torre, no se instala y no se publica.
      referencias: >-
        Medición del corte: Engram 11325 (core.mjs partido 90/10 entre continuation y semáforo,
        con el semáforo en core.mjs:4318-4681 creando sus tres tablas en open() sin el sistema
        de migraciones) y Engram 11326 (continuation en el paso 1 de los 11 de
        docs/architecture/torre-motor-determinista.md, sección 17). Decisión de alcance:
        Engram 11327. Línea base de código: core.mjs:4318-4681, mcp.mjs (ocho herramientas
        tower_*), bin/torre. Revalidar contra el código vigente antes de implementar.
      incompleto: true
  - id: S150
    prioridad: torre-v1
    zona: cimientos
    resultado: El README describe el producto que se entrega —el semáforo instalable— y no promete capacidades que pertenecen a torre-v2.
    autoridad: "Corte Torre V1 aprobado por Emilio el 2026-09-18 (Engram 11327). El resultado documental se separa de S12.6, que conserva en torre-v3 la reorganización de la raíz y su dependencia de la descomposición de core.mjs (S12.3 → S12.4 → S12.5); esta Sesión toma sólo la parte del README, que el release necesita y que no depende de ese refactor."
    depende_de: []
    cimientos:
      - README.md
    archivos:
      - README.md
    encargo:
      pedido_contexto: >-
        El README vigente describe la Torre como un conjunto de piezas —core.mjs, mcp.mjs,
        plugin, bin/torre, validador— y enumera las ocho herramientas tower_*. Describe el
        repositorio, no el producto. Quien reciba la Torre V1 instalada necesita leer qué
        resuelve, cómo se instala y cuál es su frontera. Esta Sesión reescribe esa lectura; no
        reorganiza la raíz ni mueve archivos.
      resultado_comportamiento: >-
        El README abre con el problema que la Torre resuelve —varias sesiones de agente sobre
        el mismo repositorio entregan en orden y no se pisan en master— y con el resultado
        observable, antes que con su inventario de archivos.

        Declara explícitamente la frontera de la V1: coordina y serializa la entrega; no reparte
        trabajo, no traspasa encargos entre agentes y no recupera una sesión caída. Nombra que
        el traspaso de trabajo se coordina hoy con el método, no con la Torre, y que la versión
        automática pertenece a una versión posterior.

        Explica la instalación del artefacto entregable y el interruptor on/off con su efecto
        real sobre el estado existente. Describe la relación con Radar como dos programas
        distintos que se instalan juntos y se versionan por separado.

        Ninguna afirmación del README describe una capacidad que no exista en el árbol al
        momento de escribirlo; cada capacidad enunciada es verificable contra el código o
        contra una prueba.
      restricciones_decisiones: >-
        Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana
        explícita. README.md es Cimiento: su intervención exige reserva exacta y exclusividad o
        serialización demostrada. Sólo se autoriza README.md; ROADMAP.md, AGENTS.md, CLAUDE.md
        y la documentación bajo docs/ quedan fuera. No se reorganiza la raíz, no se mueven ni
        renombran archivos y no se toca código: esa parte permanece en S12.6 dentro de
        torre-v3. El texto no anticipa capacidades de torre-v2 como disponibles.
      referencias: >-
        Decisión de alcance: Engram 11327. README.md vigente en HEAD como línea base. S12.6
        conserva en torre-v3 la reorganización de la raíz. La frontera del producto se apoya en
        la medición de Engram 11325 y 11326. Revalidar contra el árbol vigente antes de escribir.
