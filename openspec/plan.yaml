      resultado_comportamiento: "mcp.mjs responde la asignación completa —Sesión, agente, asiento, contrato de ejecución y política de entrega— en una sola operación, sin que el consumidor lea openspec/plan.yaml ni el ROADMAP.\n\nLa Torre valida que el snapshot declare schema radar.snapshot/v1 y falla cerrado con un resultado nombrado ante cualquier otro valor, ausencia o JSON inválido; nunca dibuja cifras que el productor no firmó.\n\nEl registro de proyectos declara por proyecto cómo obtener su snapshot, junto a manifest_path y roadmap_path, y un proyecto sin declaración se reporta como no disponible en vez de asumir un default.\n\nNinguna regla de cálculo de Radar —estado de Sesión, cola por Zona, avance, asientos— queda reimplementada en JavaScript: existe una sola implementación y el consumidor sólo la consume.\n\nMain conserva la autoridad de asignación y despacho: NON_MAIN_DISPATCH y WORKER_SELF_ASSIGNMENT siguen siendo pisos irrelajables y esta Sesión no otorga autoridad nueva a nadie.\n\nEl diseño técnico, las interfaces y la implementación de S109 se elaboran en una ejecución posterior autorizada mediante Gentle AI; cualquier decisión de API pública conserva su aprobación humana previa."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación. El alcance inicial se limita a contratos/MCP y no autoriza escrituras implícitas en Instalación o Método. Si el diseño de empaquetado requiere otros archivos con dueño, exige aprobación humana del padre y compatibilidad fresca antes de la escritura afectada; no se inventa una Sesión nueva ni se afirma que todo el diseño técnico ya sea conocido."
      referencias: "Autoridad original: Idea aprobada por el maintainer el 2026-09-10 sobre el documento de diseño «Torre coordina, Main juzga» (artifact 728134a6-47ab-4088-b688-74af1c92bf2a), medido sobre master en bae57ba. La evidencia que la sostiene: responder «qué sigue y quién lo toma» cuesta 512.563 bytes leyendo openspec/plan.yaml entero contra 3.293 bytes pidiéndole avance, colas y asientos a Radar. El contrato radar.snapshot/v1 y su consumidor de referencia ya existen desde b50c0b3 y 969f189. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S109. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Se unifican los dos idiomas —Radar en Go y los módulos en JavaScript— o se unifica otra cosa?
        resolucion: "Se unifica el contrato, no los idiomas. La Torre no necesita ser Radar: necesita recibir radar.snapshot/v1 y validar el schema, sin saber quién lo produjo."
        autoridad: "Maintainer, 2026-09-10, sobre el documento de diseño; el patrón ya está probado en agent-workflows/radiografia/measure.mjs desde 969f189."
        clase: contrato-visible
        falsificador: "Alguna regla de cálculo de Radar aparece reimplementada en JavaScript, o el consumidor acepta un snapshot cuyo schema no reconoce."
        descartadas:
          - opcion: "Portar EstadosAt, ColaPorZonaAt, AvanceAt y AsientosAt a JavaScript."
            razon: "Rechazada: son 309 líneas de reglas no triviales y dejaría dos implementaciones del mismo reglamento, que es la falla que la migración a Zonas acaba de eliminar."
      - tipo: resuelta
        pregunta: ¿Dónde corre el cálculo del plan cuando la Torre lo necesita?
        resolucion: "Radar viaja con la Torre y se invoca contra cada proyecto. Radar es el radar de la Torre, no una dependencia que cada proyecto deba traer."
        autoridad: "Maintainer, 2026-09-10. El registro ya guarda roadmap_path y manifest_path por proyecto en schemas/project-registry-v1.schema.json."
        clase: expansion-de-alcance
        falsificador: "La Torre exige que el proyecto gestionado provea Radar por su cuenta, o el cálculo se resuelve con un caché en disco pese a que el estado depende de HEAD."
        descartadas:
          - opcion: Generar un snapshot en disco y leerlo cuando haga falta.
            razon: "Rechazada: el estado depende de HEAD por merge-base --is-ancestor en agent-workflows/tools/radar/git.go:80, así que el caché queda viejo en cada commit y no sólo al editar el plan."
      - tipo: resuelta
        pregunta: ¿Main sigue corriendo los tests?
        resolucion: "No los corre: los lee. La Torre ejecuta y guarda la salida completa; a Main le entrega el veredicto y sólo el extracto de lo que falló."
        autoridad: "Maintainer, 2026-09-10, sobre el documento de diseño."
        clase: contrato-visible
        falsificador: "Main vuelve a recibir la salida completa de una suite, o la Torre emite un veredicto sobre si un criterio se cumplió."
        descartadas:
          - opcion: Que la Torre además juzgue si el resultado es aceptable.
            razon: "Rechazada: distinguir una regresión de un fallo ambiental conocido es juicio sobre evidencia y no tiene respuesta única."
      - tipo: resuelta
        pregunta: ¿Esta Sesión elimina el agente Main?
        resolucion: "No. Main sigue existiendo y conserva el juicio, la resolución de ambigüedad y la presentación de decisiones al humano; lo que cambia es que deja de derivar lo que ya está calculado."
        autoridad: "Maintainer, 2026-09-10: «no estamos eliminando main, estamos protegiendo su ventana de contexto»."
        clase: seguridad-y-permisos
        falsificador: Un actor que no es Main obtiene autoridad de asignación o despacho a partir de esta Sesión.
        descartadas:
          - opcion: Que la Torre asuma también el despacho y Main desaparezca.
            razon: "Rechazada por el maintainer: el objetivo es la ventana de contexto, no reemplazar al agente."
  - id: S110
    zona: hosts
    resultado: "Corte del entorno constructor: el repositorio deja de exponerle skills de la Torre a un host Pi, y ningún agente que construye la Torre la recibe como sistema de coordinación."
    autoridad: "Idea aprobada por el maintainer el 2026-09-10 sobre el mapeo de territorios «La Línea de Corte» (artifact 78dac4ab-a68b-4f1b-86a3-a5c4e197cc26) y los alcances de «El Corte y el Enforcer» (artifact b33c4b87-990a-44cd-b8cf-546702375ad1), medido sobre master en f78216c. La evidencia verificada: .pi/settings.json es el único cargador vivo de skills/torre-control*, que no están instaladas en ningún directorio global de agentes; y el modelo de tres territorios —Entorno, Método, Maquinaria— ya lo había declarado el maintainer el 2026-09-02."
    depende_de: []
    cimientos: [.pi/settings.json]
    recurso: []
    criterios:
      - "El repositorio deja de declararle skills/torre-control, skills/torre-control-entregas y skills/torre-control-soporte a un host Pi; una sesión Pi abierta sobre este árbol no descubre ninguna de las tres."
      - ".pi/settings.json sigue existiendo y sigue siendo un cimiento declarado: se le quita la clave que carga las skills de la Torre, no el archivo."
      - "Las skills del Método y las de gentle-ai siguen disponibles para cualquier agente: el corte saca Maquinaria y nunca Método."
      - ".git/control-tower/ACTIVE sigue ausente y nada bajo ~/.local/share/control-tower/ se lee, escribe ni desinstala."
      - "openspec/plan.yaml sigue siendo la única autoridad sobre el trabajo pendiente, y radar check pasa antes y después."
      - "El diff toca sólo Área."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Se borra .pi/settings.json o se le quita la clave que carga las skills de la Torre?"
        resolucion: "Se le quita la clave. El archivo es un cimiento declarado y la ruta de un Módulo debe nombrar un archivo del repositorio; borrarlo dejaría la reserva apuntando al vacío y agranda el diff sin necesidad."
        autoridad: "Maintainer, 2026-09-10; contrato de reservas en agent-workflows/tools/radar/check.go:772-795 y de rutas de Módulo en check.go:362-382."
        clase: contrato-visible
        falsificador: ".pi/settings.json deja de existir en el árbol, o su reserva de cimiento queda declarada sobre una ruta ausente."
        descartadas:
          - opcion: "Borrar el archivo entero."
            razon: "Deja la reserva de cimiento huérfana y amplía el diff sin necesidad."
      - tipo: resuelta
        pregunta: "¿La limpieza de los archivos de instrucciones globales entra en esta Sesión?"
        resolucion: "No. ~/.claude/CLAUDE.md, ~/.codex/AGENTS.md y ~/.pi/agent/APPEND_SYSTEM.md viven fuera del repositorio, no pertenecen a ninguna Zona y openspec/plan.yaml no los gobierna. Son trabajo de Entorno y se ejecutan aparte, bajo la misma aprobación del maintainer."
        autoridad: "Modelo de tres territorios del maintainer, 2026-09-02: «Entorno — ~/.claude/ — no es un repo»."
        clase: expansion-de-alcance
        falsificador: "Un criterio de esta Sesión exige verificar un archivo fuera del repositorio, o un Módulo declara una ruta que no está rastreada acá."
        descartadas:
          - opcion: "Declarar los tres archivos globales como rutas de Módulo."
            razon: "radar exige que la ruta de un Módulo sea un archivo del repositorio; los tres viven en el home del usuario."
    ruta:
      propuesta: direct
      autoridad: "El resultado es binariamente verificable —el host Pi descubre o no descubre las tres skills— y no queda ninguna elección de diseño abierta: el mapeo de superficies está cerrado y verificado contra el árbol en f78216c."
      revalidacion:
        resultado: direct
        base: f78216cfec642cfe7cc5c32c87fa8cdf2da9108b
        evidencia: "Árbol limpio en f78216c y .pi/settings.json declarando las tres skills; el test RED falló nombrando las tres antes de tocar nada."
    entrega:
      commit: 638a3f78cff475215cd1cc86cd37b8a3dcc09be5
    modulos:
      - id: M110.1
        resultado: "El repositorio deja de exponerle skills de la Torre a Pi"
        rutas: [.pi/settings.json, test/extensions/pi/tower-skill-exposure.test.mjs]
        tareas:
          - id: T110.1.1
            accion: "RED: escribir el test que falla hoy, afirmando que la configuración Pi del repositorio no declara ninguna ruta bajo skills/torre-control*."
            resultado: "RED: existe un test que falla contra el árbol actual porque .pi/settings.json declara las tres skills de la Torre."
            criterios: ["RED: existe un test que falla contra el árbol actual porque .pi/settings.json declara las tres skills de la Torre."]
          - id: T110.1.2
            accion: "GREEN: quitar de .pi/settings.json la clave que carga las skills de la Torre, conservando el archivo y cualquier otra configuración Pi legítima."
            resultado: "GREEN: el test pasa, el archivo sigue existiendo y ninguna skill de la Torre queda declarada."
            criterios: ["GREEN: el test pasa, el archivo sigue existiendo y ninguna skill de la Torre queda declarada."]
          - id: T110.1.3
            accion: "REFACTOR: dejar el test afirmando la regla general —ninguna configuración del repositorio expone Maquinaria a un host— en vez de las tres rutas exactas de hoy."
            resultado: "REFACTOR: el test prueba la regla y no la lista, y sigue pasando."
            criterios: ["REFACTOR: el test prueba la regla y no la lista, y sigue pasando."]

  - id: S111
    zona: metodo
    resultado: "Radar deja de creerle a la ruta declarada: consume gentle-ai.sdd-status@2 y rechaza una Sesión cuyo pipeline no entró por la puerta que su ruta declara."
    autoridad: "Idea aprobada por el maintainer el 2026-09-10 sobre «El Corte y el Enforcer» (artifact b33c4b87-990a-44cd-b8cf-546702375ad1). La evidencia verificada: hoy radar le pide a gentle-ai un solo booleano, decision_required (agent-workflows/tools/radar/ledger.go:17-24), mientras gentle-ai sdd-status@2 ya devuelve next, el estado de cada compuerta y los artefactos existentes —salida real contra migrate-control-tower-plan-zones bajo gentle-ai 2.7.0. El canon exige las tres puertas en plan-naming-convention.md §15."
    depende_de: []
    cimientos: []
    recurso: [el binario gentle-ai instalado; sin dependencias nuevas más allá de git y gentle-ai]
    criterios:
      - "Radar lee gentle-ai.sdd-status@2 para toda Sesión que declare un cambio, y valida el nombre y la versión del schema antes de usar cualquier campo."
      - "Una Sesión cuya ruta declara una puerta de entrada distinta de la que el pipeline realmente usó falla cerrado con un hallazgo que nombra la Sesión, la ruta declarada y la puerta observada."
      - "Un cambio ausente, un status ilegible, un schema no reconocido o un JSON inválido producen un hallazgo nombrado y nunca un pase silencioso."
      - "Radar no reimplementa ninguna regla de fases de gentle-ai: consume el contrato y no deriva el estado de las compuertas por su cuenta."
      - "Las dependencias externas de radar siguen siendo exactamente git y gentle-ai; el Método sigue siendo portable a un repositorio que no tenga Engram ni la Torre."
      - "El diff toca sólo Área."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Radar calcula el gating de fases o lo consume?"
        resolucion: "Lo consume. gentle-ai ya lo computa y lo publica en un contrato versionado; reimplementarlo sería una segunda fuente de verdad sobre el mismo hecho."
        autoridad: "Maintainer, 2026-09-10; salida verificada de gentle-ai sdd-status --cwd . bajo 2.7.0, y el principio ya aplicado en S109."
        clase: contrato-visible
        falsificador: "Alguna regla de avance de fases de gentle-ai aparece reimplementada en Go, o radar decide una compuerta sin leer el contrato."
        descartadas:
          - opcion: "Derivar el estado de las fases mirando los archivos del change directamente."
            razon: "Duplica la regla de gentle-ai y se desincroniza en la primera versión que cambie el layout."
      - tipo: derivable
        pregunta: "¿Qué hace radar cuando el status no se puede leer?"
        criterio: "Falla cerrado con un hallazgo nombrado; nunca omite la verificación ni asume que la ruta declarada es correcta."
        autoridad: "El precedente ya escrito en ledger.go:26-47, que trata un ledger ilegible como error y no como ausencia."
        evidencia: "agent-workflows/tools/radar/ledger.go:26-47 y check.go:41-46."
        checkpoint: "antes de emitir el veredicto de check."
        opciones:
          - opcion: "Tratar un status ilegible como error de la Sesión que declara el cambio."
            consecuencia: "Un entorno sin gentle-ai no produce un pase falso; produce un hallazgo que nombra qué falta."
    ruta:
      propuesta: direct
      autoridad: "El contrato de entrada es exacto y está publicado, el mecanismo de consumo ya existe en ledger.go, y la única elección restante —qué hacer ante un status ilegible— es derivable del precedente del propio archivo."
      revalidacion:
        resultado: direct
        base: 638a3f78cff475215cd1cc86cd37b8a3dcc09be5
        evidencia: "Salida real de gentle-ai sdd-status --json bajo 2.7.0, con schemaName, schemaVersion, nextRecommended y dependencies verificados campo por campo antes de escribir código."
    entrega:
      commit: 271a32a63a0f6ae554a2690448535bbc6ead7692
    modulos:
      - id: M111.1
        resultado: "Radar consume el contrato de estado de fases y lo valida"
        rutas: [agent-workflows/tools/radar/ledger.go, agent-workflows/tools/radar/ledger_test.go]
        tareas:
          - id: T111.1.1
            accion: "RED: cubrir schema no reconocido, JSON inválido, cambio ausente y status ilegible, cada uno con su hallazgo nombrado."
            resultado: "RED: los cuatro modos de falla del contrato quedan cubiertos y fallan."
            criterios: ["RED: los cuatro modos de falla del contrato quedan cubiertos y fallan."]
          - id: T111.1.2
            accion: "GREEN: leer gentle-ai.sdd-status@2, validar nombre y versión del schema y exponer la puerta observada junto al estado de cada compuerta."
            resultado: "GREEN: el contrato se lee y se valida, y los cuatro modos de falla producen hallazgos nombrados."
            criterios: ["GREEN: el contrato se lee y se valida, y los cuatro modos de falla producen hallazgos nombrados."]
          - id: T111.1.3
            accion: "REFACTOR: unificar la invocación de gentle-ai con la del ledger de intentos, dejando una sola forma de hablarle al proveedor."
            resultado: "REFACTOR: existe una sola forma de invocar gentle-ai y los tests siguen pasando."
            criterios: ["REFACTOR: existe una sola forma de invocar gentle-ai y los tests siguen pasando."]
      - id: M111.2
        resultado: "Check rechaza una ruta que miente sobre su puerta de entrada"
        rutas: [agent-workflows/tools/radar/check.go, agent-workflows/tools/radar/check_test.go]
        tareas:
          - id: T111.2.1
            accion: "RED: cubrir las tres rutas contra su puerta —direct/apply, design-tasks/design, full-sdd/proposal— y el caso en que la observada no coincide."
            resultado: "RED: las tres correspondencias y el desacuerdo quedan cubiertos y fallan."
            criterios: ["RED: las tres correspondencias y el desacuerdo quedan cubiertos y fallan."]
          - id: T111.2.2
            accion: "GREEN: emitir un hallazgo que nombre la Sesión, la ruta declarada y la puerta observada cuando no coinciden."
            resultado: "GREEN: el desacuerdo produce el hallazgo exacto y las tres correspondencias pasan."
            criterios: ["GREEN: el desacuerdo produce el hallazgo exacto y las tres correspondencias pasan."]
          - id: T111.2.3
            accion: "REFACTOR: mover la correspondencia ruta→puerta a una tabla única, para que agregar una ruta no requiera tocar la lógica de check."
            resultado: "REFACTOR: la correspondencia vive en una tabla única y los tests siguen pasando."
            criterios: ["REFACTOR: la correspondencia vive en una tabla única y los tests siguen pasando."]

  - id: S112
    zona: metodo
    resultado: "El campo autoridad deja de ser texto libre: declara su tipo y radar prueba lo que se puede probar, diciendo explícitamente lo que no."
    autoridad: "Decisión del maintainer del 2026-09-10, tomada sobre un snapshot histórico fechado de openspec/plan.yaml que entonces enumeraba 76 Sesiones y reveló tres clases reales de cita —repo, decision y engram—; esos conteos son evidencia histórica del descubrimiento y no describen la población vigente. La máquina de prueba ya existía sin usarse para esto: validateFragmentLocator en agent-workflows/tools/radar/check.go:928, aplicada entonces sólo en check.go:841 y check.go:866."
    depende_de: []
    cimientos: []
    recurso: [el registro de decisiones archivado en openspec/archive/legacy-planning/; sin dependencia nueva de Engram]
    criterios:
      - "El campo autoridad admite tres tipos declarados: repo, decision y engram; un tipo ausente o desconocido falla cerrado."
      - "Los tipos repo y decision se prueban contra Git con la misma exigencia byte a byte que ya usa validateFragmentLocator; una cita que no resuelva falla cerrado."
      - "El tipo engram se declara y no se verifica, y radar lo reporta explícitamente como no verificable: nunca lo cuenta como probado."
      - "Las dependencias externas de radar siguen siendo exactamente git y gentle-ai: el Método no queda atado al Engram del maintainer y sigue siendo portable a otro producto."
      - "Todas las Sesiones vigentes quedan migradas o declaradas con su tipo; ninguna conserva la forma vieja sin tipo al cerrar la migración."
      - "El diff toca sólo Área."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Radar verifica también las autoridades que citan Engram?"
        resolucion: "No. Se declaran con tipo engram y radar las reporta como no verificables. Verificarlas ataría el Método al Engram personal del maintainer, y que un ID exista hoy no prueba que su contenido siga siendo el que la Sesión citó, porque Engram es mutable."
        autoridad: "Decisión del maintainer del 2026-09-10, elegida sobre tres alternativas presentadas con su consecuencia."
        clase: contrato-visible
        falsificador: "Radar adquiere una dependencia de Engram, o cuenta una autoridad de tipo engram como probada."
        descartadas:
          - opcion: "Verificar el ID contra el CLI de Engram."
            razon: "Suma una dependencia externa y rompe la portabilidad del Método; además Engram es mutable y la existencia del ID no prueba el contenido citado."
          - opcion: "Espejar las citas de Engram del snapshot histórico en un registro versionado del repositorio."
            razon: "Crea una segunda fuente de verdad que hay que sincronizar a mano, que es exactamente lo que el canon prohíbe."
          - opcion: "Verificar sólo el tipo repo y dejar los otros dos como texto libre."
            razon: "Deja sin prueba toda cita que no sea repo y la compuerta del Tramo 1 prácticamente abierta."
      - tipo: resuelta
        pregunta: "¿La población vigente se migra de una sola vez, o radar acepta las dos formas durante una transición?"
        resolucion: "La población del snapshot Radar vigente se migra Zona por Zona y la exigencia se enciende al final; nunca hay dos formas exigidas ni un lote sobre el tope."
        autoridad: "Decisión del maintainer del 2026-09-10, elegida sobre tres alternativas presentadas con su consecuencia."
        clase: migracion-o-perdida-de-datos
        falsificador: "Un solo commit migra más Sesiones de las que caben en el tope de lote declarado, o radar exige el tipo antes de que la migración haya terminado."
        descartadas:
          - opcion: "Migrar toda la población vigente en un solo Módulo, sin aceptar nunca la forma vieja."
            razon: "El lote de revisión sería openspec/plan.yaml entero, muy por encima del tope de 400 líneas, y revertirlo tocaría el archivo que gobierna todo el trabajo abierto."
          - opcion: "Aceptar las dos formas detrás de una fecha declarada."
            razon: "Deja dos formas del mismo dato conviviendo por tiempo indefinido, que es la segunda fuente de verdad que el canon prohíbe."
      - tipo: resuelta
        pregunta: "¿Esta Sesión también migra la población vigente de openspec/plan.yaml?"
        resolucion: "No. openspec/plan.yaml lo posee la Zona autoridad y no es un cimiento declarado, así que una Sesión de la Zona metodo no puede declararlo como ruta de Módulo. El trabajo se parte por Zona: S112 construye el contrato en Go, S114 migra el plan desde la Zona autoridad, y S115 enciende la exigencia."
        autoridad: "Partición vigente en openspec/plan.yaml:30-32 y contrato de rutas de Módulo en agent-workflows/tools/radar/check.go:362-382; regla de cruces entre Zonas en plan-naming-convention.md §3."
        clase: expansion-de-alcance
        falsificador: "Un Módulo de esta Sesión declara openspec/plan.yaml como ruta, o la migración del plan ocurre desde la Zona metodo."
        descartadas:
          - opcion: "Declarar openspec/plan.yaml como cimiento para poder reservarlo."
            razon: "Un cimiento es terreno que más de una Zona modifica de forma permanente; el plan lo escribe sólo la Zona autoridad y convertirlo en cimiento debilitaría la partición para resolver un caso puntual."
      - tipo: resuelta
        pregunta: "¿Cuál archivo es el registro de decisiones citable, si la política del repositorio declara que ninguno de los dos es autoridad?"
        resolucion: "openspec/archive/legacy-planning/decision-register.md es el registro citable, congelado: se cita y no se edita. La copia bajo openspec/plans/ se retira, y esa retirada le pertenece a S114 porque openspec/plans/ es territorio de la Zona autoridad. Las decisiones nuevas siguen viviendo en el campo decisiones de cada Sesión, que es donde ya viven de hecho."
        autoridad: "Decisión del maintainer del 2026-09-10, elegida sobre cuatro alternativas presentadas con su consecuencia. La evidencia: las dos copias tienen el mismo md5 541a4eda; AGENTS.md:27 declara el archivo «histórico, sólo lectura: se cita, no se edita» y AGENTS.md:29 declara openspec/plans/ «narrativa histórica… no es autoridad»; el registro llega hasta la decisión 108 y no crece, mientras las decisiones cerradas hoy quedaron en el campo decisiones de esta misma Sesión."
        clase: contrato-visible
        falsificador: "Se agrega una decisión nueva al registro, o queda más de una copia del registro en el árbol."
        descartadas:
          - opcion: "openspec/plans/decision-register.md pasa a ser excepción viva en AGENTS.md, como radiografia.md."
            razon: "Deja dos lugares donde vive una decisión —el registro y el campo decisiones del plan— y obliga a declarar cuál gana cuando se contradicen."
          - opcion: "Nace un registro vivo en una Zona que lo posea, y las dos copias actuales se archivan."
            razon: "Exige una migración de contenido que ninguna Sesión tiene planificada y agranda el alcance antes de empezar."
          - opcion: "Se elimina el tipo decision: una cita a decisión se declara como tipo repo apuntando a donde esté."
            razon: "radar dejaría de poder verificar que el fragmento citado contenga de verdad la decisión que la Sesión nombra; un rango mal copiado pasaría el check."
      - tipo: resuelta
        pregunta: "¿Cómo resuelve radar una cita a decisión, si el registro tiene dos formas de escribirlas?"
        resolucion: "La cita declara su localizador exacto, igual que el tipo repo, y además el número de decisión. radar prueba los bytes y después prueba que el fragmento nombre esa decisión. No parsea el registro ni infiere dónde está cada número: el localizador lo dice."
        autoridad: "Descubrimiento técnico de esta Sesión: el registro escribe las decisiones 49 a 108 como encabezados `## Decisión N`, con rangos como `## Decisiones 49–53`, y las anteriores como ítems de una lista numerada en prosa. Dos formas, más rangos, más ítems repetidos entre sublistas."
        clase: contrato-visible
        falsificador: "radar deduce la ubicación de una decisión parseando el registro en vez de leer el localizador declarado."
        descartadas:
          - opcion: "Declarar sólo el número y que radar encuentre la decisión en el registro."
            razon: "Obliga a parsear formatos y rangos distintos; un cambio de redacción rompería las citas del snapshot histórico."
    ruta:
      propuesta: design-tasks
      autoridad: "El producto está decidido —tres tipos, dos verificables, migración por Zona con exigencia al final— pero falta descubrimiento técnico acotado: la forma exacta de cada tipo en el esquema y cómo se prueba una cita a una decisión numerada dentro del registro archivado. Eso es diseño de contrato, no de comportamiento."
      revalidacion:
        resultado: design-tasks
        base: 4f4e2925befd92f7939b8459915499f5196909f3
        evidencia: "El descubrimiento encontró dos copias byte-idénticas del registro con md5 541a4eda, ninguna declarada autoridad por AGENTS.md, y dos formatos de escritura de decisiones más rangos. Las dos preguntas quedaron resueltas antes del primer Módulo."
    entrega:
      commit: f138e1b3f79c0428ea0493789b81b2d6005ddfb1
    modulos:
      - id: M112.1
        resultado: "El esquema admite los tres tipos y radar los valida sin exigirlos todavía"
        rutas: [agent-workflows/tools/radar/plan.go, agent-workflows/tools/radar/check.go, agent-workflows/tools/radar/check_test.go]
        tareas:
          - id: T112.1.1
            accion: "RED: cubrir tipo desconocido, tipo repo cuya cita no resuelve, tipo decision cuya referencia no está en el registro, tipo engram, y la forma vieja sin tipo."
            resultado: "RED: los cinco casos quedan cubiertos y los que deben fallar, fallan."
            criterios: ["RED: los cinco casos quedan cubiertos y los que deben fallar, fallan."]
          - id: T112.1.2
            accion: "GREEN: aceptar los tres tipos, probar repo y decision contra Git con la exigencia de validateFragmentLocator, y reportar engram como no verificable."
            resultado: "GREEN: repo y decision se prueban byte a byte, engram se reporta no verificable, y la forma vieja sigue pasando porque todavía no se exige el tipo."
            criterios: ["GREEN: repo y decision se prueban byte a byte, engram se reporta no verificable, y la forma vieja sigue pasando porque todavía no se exige el tipo."]
          - id: T112.1.3
            accion: "REFACTOR: reusar validateFragmentLocator en vez de duplicar la resolución de blob y rango, dejando una sola prueba de cita en la herramienta."
            resultado: "REFACTOR: existe una sola prueba de cita y los tests siguen pasando."
            criterios: ["REFACTOR: existe una sola prueba de cita y los tests siguen pasando."]

  - id: S116
    zona: metodo
    resultado: "El campo autoridad admite varias citas: una Sesión que se apoya en más de una fuente puede declararlas todas, y radar prueba cada una por separado."
    autoridad: "Descubrimiento histórico de S114 sobre el snapshot fechado del 2026-09-10: el plan entonces medido contenía autoridades con dos y tres clases de fuente, así que una cita única no podía representar el dato real. Esas cantidades preservan sólo la evidencia datada del descubrimiento y no describen la población vigente. Decisión del maintainer del 2026-09-10: la lista es modelo legítimo y no una compatibility branch, porque una Sesión que de verdad se apoya en dos decisiones no es prosa desordenada."
    depende_de: [S112]
    cimientos: []
    recurso: []
    criterios:
      - "El campo autoridad admite una lista de citas tipadas, y cada una se verifica con la misma exigencia que hoy se aplica a una cita sola."
      - "Una autoridad con una sola cita se sigue escribiendo sin lista: la forma simple no se vuelve más ceremoniosa por existir la compuesta."
      - "Un hallazgo sobre una cita de la lista nombra cuál de ellas falló, no sólo la Sesión."
      - "El esquema no gana ningún campo de texto libre para prosa sin migrar, ni ningún tipo nuevo: el canon §18 prohíbe extender la herramienta para aceptar la forma vieja."
      - "La forma de texto libre sigue pasando; la exigencia se enciende en S115, después de que S114 haya migrado el dato."
      - "El diff toca sólo Área."
    decisiones:
      - tipo: resuelta
        pregunta: "¿La lista es una concesión a la prosa vieja o es el modelo correcto?"
        resolucion: "Es el modelo correcto. Una Sesión puede apoyarse honestamente en dos decisiones y un commit, y aplastar eso a una cita perdería dato verdadero. Lo que sí sería una concesión —un campo de texto libre para lo que no se pudo migrar— queda explícitamente fuera."
        autoridad: "Decisión del maintainer del 2026-09-10 y canon §18 en plan-naming-convention.md:548."
        clase: contrato-visible
        falsificador: "El esquema admite texto libre dentro de la lista, o la lista se usa para guardar prosa en vez de citas tipadas."
        descartadas:
          - opcion: "Dejar una sola cita y elegir la principal."
            razon: "Pierde fuentes que de verdad sostienen la Sesión, y decidir cuál es la principal es criterio humano tarea por tarea."
    ruta:
      propuesta: direct
      autoridad: "El tipo de cita ya existe y está entregado en S112; esto lo repite en una lista y reporta cuál falló. No queda ninguna elección de diseño abierta: la decisión de producto está tomada y el canon §18 cierra la alternativa."
      revalidacion:
        resultado: direct
        base: 8e42897bf4b7c4b0a3c12fd9cd88b21ada7d6cb0
        evidencia: "Autoridad y validarAutoridad abiertos en el árbol: plan.go:141-181 declara el struct y su UnmarshalYAML de escalar o mapa, check.go:891-925 verifica una cita sola. Ningún archivo fuera de plan.go, check.go y authority_test.go lee Tipo, Ref, ID, Loc, Tipada ni Declarada, así que el radio del cambio es exactamente el Área declarada y no queda decisión de diseño abierta."
    entrega:
      commit: 4e3f0aa595ca1dd0cc8b44fbcb950f5c1fbbb0d4
    modulos:
      - id: M116.1
        resultado: "Autoridad admite varias citas y cada una se verifica por separado"
        rutas: [agent-workflows/tools/radar/plan.go, agent-workflows/tools/radar/check.go, agent-workflows/tools/radar/authority_test.go]
        tareas:
          - id: T116.1.1
            accion: "RED: cubrir una lista con dos citas válidas, una lista donde la segunda falla, una cita sola sin lista, y la forma de texto libre."
            resultado: "RED: los cuatro casos quedan cubiertos y el que debe fallar, falla nombrando cuál cita de la lista fue."
            criterios: ["RED: los cuatro casos quedan cubiertos y el que debe fallar, falla nombrando cuál cita de la lista fue."]
          - id: T116.1.2
            accion: "GREEN: aceptar escalar, mapa y lista en el mismo campo, y verificar cada cita de la lista con la exigencia ya entregada."
            resultado: "GREEN: las tres formas cargan, cada cita se verifica por separado y el hallazgo nombra la posición que falló."
            criterios: ["GREEN: las tres formas cargan, cada cita se verifica por separado y el hallazgo nombra la posición que falló."]
          - id: T116.1.3
            accion: "REFACTOR: dejar una sola función que verifica una cita, usada igual por la forma simple y por cada elemento de la lista."
            resultado: "REFACTOR: existe una sola verificación de cita y los tests siguen pasando."
            criterios: ["REFACTOR: existe una sola verificación de cita y los tests siguen pasando."]

  - id: S114
    prioridad: torre-v3
    zona: autoridad
    resultado: "Todas las Sesiones vigentes declaran el tipo de su autoridad, migradas Zona por Zona para que ningún lote de revisión supere el tope declarado."
    autoridad: "Decisión del maintainer del 2026-09-10 sobre la migración del campo autoridad, elegida entre tres alternativas: migrar por Zona y encender la exigencia al final. La población vigente y el orden se obtienen en ejecución mediante un snapshot `radar status --json` ligado a su revisión; ningún total fijo forma parte del alcance vivo."
    depende_de:
      - S112
      - S116
    cimientos:
      []
    recurso:
      - openspec/plan.yaml; la migración es el único trabajo que lo escribe mientras dura
    archivos:
      - openspec/plan.yaml
      - openspec/plans/decision-register.md
    encargo:
      pedido_contexto: "Todas las Sesiones vigentes declaran el tipo de su autoridad, migradas Zona por Zona para que ningún lote de revisión supere el tope declarado."
      resultado_comportamiento: "Cada lote de revisión migra exactamente una Zona y queda bajo el tope; M114.1 repite esos lotes serialmente.\n\nradar check pasa después de cada lote de revisión, no sólo al final: una migración parcial nunca deja el plan inválido.\n\nNinguna autoridad cambia de sentido al migrar: se declara el tipo de la cita que ya estaba escrita, nunca se inventa una nueva.\n\nAl cerrar, cero Sesiones conservan la forma vieja sin tipo declarado.\n\nQueda una sola copia del registro de decisiones en el árbol: openspec/plans/decision-register.md se retira y openspec/archive/legacy-planning/decision-register.md queda como la citable.\n\nEl diff toca sólo Área."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: Decisión del maintainer del 2026-09-10 sobre la migración del campo autoridad, elegida entre tres alternativas: migrar por Zona y encender la exigencia al final. La población vigente y el orden se obtienen en ejecución mediante un snapshot `radar status --json` ligado a su revisión; ningún total fijo forma parte del alcance vivo. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S114. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Puede el esquema entregado por S112 representar las autoridades reales del plan?
        resolucion: "No. El snapshot histórico fechado del 2026-09-10 probó que varias autoridades citaban más de una clase de fuente y que una cita única perdía información. Las cantidades observadas ese día quedan como evidencia datada y no como total vigente. Extender el campo a una lista de citas es trabajo de la Zona metodo y nació como Sesión propia, S116, porque el alcance descubierto nunca se agrega en silencio a una Sesión ya entregada."
        autoridad: "Descubrimiento histórico de esta Sesión sobre el snapshot fechado del 2026-09-10, medido contra el esquema entregado en f138e1b."
        clase: contrato-visible
        falsificador: "Se migra una autoridad multi-fuente aplastándola a una sola cita, o se extiende el esquema dentro de S112 en vez de en una Sesión nueva."
        descartadas:
          - opcion: Elegir una autoridad primaria por Sesión y descartar el resto.
            razon: "Pierde información que hoy está escrita, y la Sesión dejaría de poder probar las fuentes que realmente la sostienen."
      - tipo: resuelta
        pregunta: ¿Qué fidelidad conserva la migración cuando la autoridad es prosa que nombra decenas de fuentes?
        resolucion: "La prosa desordenada es un problema de la migración, no algo que la herramienta deba modelar. El esquema no gana ni un campo de contexto para prosa sin migrar ni tipos nuevos: la migración produce citas tipadas y el que no pueda tiparse no pertenece al campo. Lo único que el esquema sí gana es la lista, porque una Sesión que de verdad se apoya en dos decisiones no es prosa desordenada: es dato real que una cita única no puede representar."
        autoridad: "Decisión del maintainer del 2026-09-10, respaldada por el canon §18 en agent-workflows/skills/_shared/plan-naming-convention.md:548: «Extend the tool to accept the legacy shape — The schema is the contract. Data the schema rejects belongs in the archive, not in a compatibility branch». El campo de contexto propuesto era exactamente esa compatibility branch."
        clase: migracion-o-perdida-de-datos
        falsificador: "El esquema gana un campo de texto libre para prosa sin migrar, o un tipo nuevo cuya única razón de existir es aceptar una cita que quedó mal escrita."
        descartadas:
          - opcion: Conservar el resto de la prosa en un campo de contexto no verificable.
            razon: "Es la compatibility branch que el canon §18 prohíbe: el esquema dejaría de ser el contrato para volverse un recipiente de lo que no se migró."
          - opcion: "Ampliar el conjunto de tipos para cubrir REQUIREMENTS, artifacts y decisiones de conversación."
            razon: "Verificado sobre el árbol: cuatro de las cinco autoridades que parecían intipables sí lo son. REQUIREMENTS existe como archivo en openspec/specs/, el SHA suelto resuelve a un commit, y sólo el artifact vive fuera de Git, que ya es la forma de engram. No hacen falta tipos nuevos: hace falta migrarlas bien."
          - opcion: Migrar sólo las citas que ya resuelven y declarar el resto como no verificable.
            razon: "Marcaría como no probables autoridades que sí son archivos del repositorio, sólo porque estaban escritas dentro de un párrafo largo."
      - tipo: derivable
        pregunta: ¿En qué orden se migran las Zonas?
        criterio: "Por cantidad de Sesiones, de menor a mayor, para que el primer lote sea el más barato de revisar y cualquier error del contrato aparezca temprano."
        autoridad: "Decisión del maintainer del 2026-09-10 sobre la estrategia de migración, y el tope de lote declarado en el bloque manual de política del 2026-09-03."
        evidencia: "radar status calcula las Sesiones por Zona, así que el orden es derivable del propio dato."
        checkpoint: antes del primer Módulo.
        opciones:
          - opcion: Ordenar las Zonas por cantidad de Sesiones ascendente.
            consecuencia: "El contrato se prueba primero sobre el lote más barato; si la forma está mal, se corrige antes de tocar las Zonas grandes."
  - id: S115
    prioridad: torre-v3
    zona: metodo
    resultado: "Radar exige el tipo de autoridad: una Sesión sin tipo declarado falla cerrado, y la compuerta del Tramo 1 queda cerrada."
    autoridad: "Decisión del maintainer del 2026-09-10: la exigencia se enciende al final, en una Sesión aparte que depende de que la migración haya terminado, para que nunca convivan dos formas exigidas ni un lote por encima del tope."
    depende_de:
      - S114
    cimientos:
      []
    recurso:
      []
    archivos:
      - agent-workflows/tools/radar/check.go
      - agent-workflows/tools/radar/check_test.go
    encargo:
      pedido_contexto: "Radar exige el tipo de autoridad: una Sesión sin tipo declarado falla cerrado, y la compuerta del Tramo 1 queda cerrada."
      resultado_comportamiento: "Una Sesión cuya autoridad no declara tipo falla cerrado con un hallazgo que la nombra.\n\nLa exigencia se enciende sobre un plan que ya está migrado entero: encenderla no produce ni un solo hallazgo sobre el plan vigente.\n\nUna autoridad de tipo engram sigue reportándose como no verificable y nunca cuenta como probada, ni siquiera con la exigencia encendida.\n\nEl diff toca sólo Área."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: Decisión del maintainer del 2026-09-10: la exigencia se enciende al final, en una Sesión aparte que depende de que la migración haya terminado, para que nunca convivan dos formas exigidas ni un lote por encima del tope. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S115. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: derivable
        pregunta: ¿Qué pasa si al encender la exigencia aparece una Sesión sin migrar?
        criterio: "Falla cerrado y la Sesión no se cierra: encender la exigencia sobre un plan incompleto es exactamente lo que esta secuencia existe para evitar."
        autoridad: "La estrategia de migración decidida el 2026-09-10, cuyo criterio de cierre en S114 es cero Sesiones sin tipo."
        evidencia: El criterio de cierre de S114 y la dependencia declarada de esta Sesión sobre ella.
        checkpoint: antes de encender la exigencia.
        opciones:
          - opcion: Fallar cerrado y volver a S114.
            consecuencia: La exigencia sólo queda encendida sobre un plan íntegro; nunca se acepta una excepción para destrabar.
  - id: S113
    zona: metodo
    resultado: "Radar verifica las dos reglas de entrega que hoy no verifica nadie: que archive corra después de entregar, y que el lote de revisión no pase de 400 líneas."
    autoridad: "Idea aprobada por el maintainer el 2026-09-10 sobre «El Corte y el Enforcer» (artifact b33c4b87-990a-44cd-b8cf-546702375ad1). La evidencia verificada: un grep sobre agent-workflows/tools/radar/*.go no devuelve ninguna coincidencia para el orden de archive ni para el tope de 400 líneas, mientras el canon los exige en plan-naming-convention.md §15 y la política de lote de revisión está declarada en el bloque manual de ~/.claude/CLAUDE.md desde el 2026-09-03."
    depende_de: []
    cimientos: []
    recurso: []
    criterios:
      - "El esquema admite el campo que declara por cuál de los tres caminos se archivó una Sesión —entregada, reemplazada o evidencia histórica retenida— y un valor fuera de esos tres falla cerrado."
      - "Una Sesión archivada que declara entrega y no tiene evidencia integrada falla cerrado; una que declara reemplazo y no tiene sucesora falla cerrado; una que declara evidencia histórica no exige ninguna de las dos."
      - "Una archivada que todavía no declara su camino sigue pasando: exigirlo aquí fallaría S4.9 y S9.4, que hoy no tienen cómo declararlo. La exigencia se enciende en una Sesión posterior, después de que el dato esté declarado."
      - "El camino no se infiere nunca. Inferir «evidencia histórica» de la ausencia de las otras dos convertiría cada entrega olvidada en historia legítima, que es exactamente el error que este chequeo existe para atrapar."
      - "Radar mide las líneas escritas del candidato contra el tope declarado y emite un hallazgo cuando lo supera; el tope es un dato del plan, no una constante en el código."
      - "Un plan que no declara tope no se mide y no falla: el tope es política, y una herramienta que inventa una política que nadie declaró es peor que una que no la verifica."
      - "La medición usa la misma prueba de ancestría inmutable que ya usa la evidencia de entrega, y no una lectura del árbol de trabajo."
      - "Ninguna de las dos reglas bloquea una Sesión que todavía no entregó: son verificaciones de cierre, no compuertas previas."
      - "El diff toca sólo Área."
    decisiones:
      - tipo: resuelta
        pregunta: "¿El tope de líneas es una constante del código o un dato del plan?"
        resolucion: "Un dato del plan. El tope es política del producto y otro repositorio puede declarar otro; una constante en Go obligaría a recompilar la herramienta para cambiar una política."
        autoridad: "Maintainer, 2026-09-10; el mismo principio ya aplicado a la política de entrega, que se declara por repositorio en AGENTS.md."
        clase: contrato-visible
        falsificador: "El tope aparece escrito como literal en el código de radar, o no se puede cambiar sin recompilar."
        descartadas:
          - opcion: "Fijar 400 como constante en Go."
            razon: "Convierte una política de producto en una decisión de compilación."
      - tipo: derivable
        pregunta: "¿Dónde se declara el tope del lote, si hoy no existe el campo en ningún lado?"
        criterio: "En openspec/plan.yaml, como política de planificación que radar lee junto al resto del dato. No se agrega al bloque delivery-policy de AGENTS.md, cuyo conjunto de campos está declarado exactamente cerrado y lo gobierna otro contrato."
        autoridad: "El criterio ya resuelto de esta Sesión —el tope es un dato del plan, no una constante del código— más el conjunto cerrado de delivery-policy declarado en el propio plan."
        evidencia: "Verificado sobre el árbol: ni openspec/plan.yaml ni agent-workflows/tools/radar/plan.go tienen campo para el tope, y el conjunto de delivery-policy se declara exactamente cerrado en effective_limits, delivery.shape, delivery.target_branch, planning.horizon_ceiling, documentation_close.*, allowed_operations y allowed_hosts."
        checkpoint: "antes del primer Módulo."
        opciones:
          - opcion: "Declararlo en el plan, junto al resto de la política de planificación."
            consecuencia: "radar lo lee de la misma fuente que todo lo demás y no hay que abrir un conjunto de campos que otro contrato declaró cerrado."
      - tipo: derivable
        pregunta: "¿Cuándo se mide el tamaño del lote?"
        criterio: "Después de que exista evidencia de entrega integrada, contra el mismo HEAD inmutable que prueba la ancestría; nunca contra el árbol de trabajo."
        autoridad: "El contrato de evidencia ya escrito en agent-workflows/tools/radar/state.go:46 y check.go:29-31, que fija un HEAD y valida todo contra él."
        evidencia: "agent-workflows/tools/radar/check.go:29-31 y state.go:44-53."
