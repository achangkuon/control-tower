  - id: S4.12
    prioridad: torre-v2
    zona: hosts
    resultado: Recuperación mínima de Pi
    autoridad: decisiones 81 y 87 del maintainer del 2026-08-27; enmienda de autoridad mecánica aprobada por Emilio, Engram 11293, sin reinterpretar las decisiones originales.
    depende_de:
      - S9.4
      - S1.18
    recurso:
      - árbol de procesos Tower-owned
      - checkpoint durable
      - lineage Pi
    archivos:
      - hosts/pi-recovery.mjs
      - test/hosts/pi-recovery.test.mjs
    encargo:
      incompleto: true
      pedido_contexto: Recuperación mínima de Pi
      resultado_comportamiento: "El core admite las transiciones mecánicas de recuperación ligadas a la Ejecución persistida; el adapter Pi ejecuta y atestigua terminación del árbol, quiescencia y creación del sucesor. No decide lifecycle ni trata el transporte como prueba del efecto.\n\nMuerte probada termina todo el árbol y prueba quiescencia antes de crear el sucesor, con ID nuevo e impredecible, --fork y lineage explícito. El contexto de implementación conserva sus fuentes durables y la continuidad técnica de Gentle AI; la Ejecución no reemplaza Git, OpenSpec ni Engram.\n\nNingún mensaje volátil es autoridad.\n\nEl replay desde estado durable es idempotente.\n\nLa recuperación no reconstruye memoria OpenCode ni toca fuera del Área exacta."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: decisiones 81 y 87 del maintainer del 2026-08-27. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S4.12. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto. Enmienda aprobada: Engram 11293 e informe docs/architecture/torre-motor-determinista.md, secciones 7, 10 y 14. Preparación incompleta: falta delimitar el contrato de recuperación core-adapter, su cobertura de API y la huella final; se conservan los archivos conocidos sin permiso de expansión. S147/S148 no cubren por sí solas esa interfaz ni habilitan esta implementación."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Qué recuperación mínima conserva Pi después de la muerte probada de la raíz?
        resolucion: "La Torre contiene y termina el árbol completo de procesos, prueba quiescencia y arranca un sucesor con ID nuevo e impredecible, --fork y lineage explícito. La continuidad proviene de OpenSpec, Engram y el checkpoint durables; no reconstruye briefs ordenados, epochs ni estado en memoria de OpenCode."
        autoridad: decisión 81 del maintainer del 2026-08-27
        clase: contrato-visible-del-producto; operaciones-irreversibles; seguridad-y-permisos; dependencias-o-evidencia-contradictorias
        falsificador: "La Torre crea el sucesor sin prueba de muerte y quiescencia, deja vivo un descendiente, reutiliza el ID previo, omite --fork o lineage, o trata memoria de proceso como continuidad durable."
        descartadas:
          - opcion: Portar completa la decisión 40.
            razon: Trasladaría al adapter Pi el acoplamiento y la reconstrucción propios de OpenCode.
          - opcion: Reinicio sólo manual.
            razon: Dejaría a la Torre sin recuperación del host que ahora va primero.
          - opcion: Dejarlo indefinido.
            razon: Permitiría reutilizar un ID terminal o bifurcar sobre un worktree aún activo.
        contaminaba:
          - S4.4
          - S7.1
      - tipo: resuelta
        pregunta: ¿Cómo se recuperan los mensajes en vuelo tras una caída del broker Pi?
        resolucion: "Se conserva el mailbox actual, volátil y en memoria. Los mensajes en vuelo perdidos se recuperan repitiendo comandos idempotentes desde el estado durable de Torre, OpenSpec, Engram y checkpoint; no se construye mensajería durable ahora."
        autoridad: decisión 87 del maintainer del 2026-08-27
        clase: contrato-visible-del-producto; operaciones-irreversibles; migraciones-o-perdida-de-datos; dependencias-o-evidencia-contradictorias
        falsificador: "Una recuperación depende de un mensaje en memoria, un comando repetido produce un efecto no idempotente, se toma socket_delivered como prueba de aplicación o se declara el mailbox durable."
        descartadas:
          - opcion: Persistir el mailbox.
            razon: "Duplicaría el estado durable y agregaría replay, orden y recuperación que la forma mínima no necesita."
          - opcion: Tratar socket_delivered como recepción.
            razon: No es prueba producer-owned.
          - opcion: Dejar la semántica de pérdida indefinida.
            razon: Permitiría asumir continuidad de mensajes que el broker no garantiza.
        contaminaba:
          - S4.4
          - S7.1
    importacion_legacy:
      origen_commit: 43130ad40af06f3ed05671000719217bee74f0a5
      origen_ruta: openspec/plans/plan-4/STATUS.md
      origen_blob: eec8b401c2f55b05cec419c101ecb462b4e4afe3
      origen_encabezado: "### Sesión 4.12 — Recuperación mínima de Pi"
      territorio_pendiente: false
