  - id: S138
    zona: metodo
    prioridad: metodo-v1
    reemplaza: [S130]
    resultado: "El puente ejecuta Tareas como evidencia interna RED/GREEN/REFACTOR, entrega exactamente un commit reversible por Módulo y revisa por defecto una única candidata inmutable de Sesión mediante RDD nativo antes de la entrega."
    autoridad: "Aprobación explícita de Emilio para el issue #134: el contrato aplica a toda Sesión abierta y nueva, preserva la historia entregada, reemplaza S130 sin editar su contrato histórico y mantiene una única revisión RDD nativa de la candidata completa por defecto, un commit reversible por Módulo y Tareas sin commits ni checkpoints de review. S135 conserva la propiedad de rutas: sólo full-sdd entra en la pipeline SDD nativa."
    depende_de: [S135]
    cimientos: []
    recurso: []
    criterios:
      - "`agent-workflows/skills/chanks-4-puente/SKILL.md` declara que cada Tarea sólo aporta evidencia interna RED/GREEN/REFACTOR y no produce ni un commit ni un checkpoint de revisión RDD nativa."
      - "La skill declara que cada Módulo completado produce exactamente un commit independientemente reversible que incluye su código y pruebas y lleva el trailer `Modulo: M<n>.<k>`."
      - "La skill declara que, por defecto, una única transacción RDD nativa revisa la candidata inmutable completa de la Sesión después de completar todos sus Módulos y verify, y antes de delivery."
      - "La skill permite una revisión anterior o por Módulo sólo cuando el humano la seleccionó explícitamente para una unidad sobredimensionada o independientemente entregable; la mera existencia de un Módulo nunca selecciona esa excepción."
      - "La skill declara que los artefactos de planificación y SDD permanecen fuera de la referencia de 400 líneas según la política del repositorio y no reinstala el modelo de review o intento por Módulo de S130."
      - "La regla se aplica a direct, design-tasks y full-sdd sin alterar que sólo full-sdd posee la pipeline SDD nativa y archive."
      - "`agent-workflows/tests/test_builder_flow.py` falla si desaparece cualquiera de estas reglas; `cd agent-workflows && python3 -m unittest discover -s tests` pasa y el diff toca sólo las rutas del Módulo."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Qué efecto de entrega o revisión tiene una Tarea?"
        resolucion: "Ninguno: una Tarea registra exclusivamente evidencia interna RED/GREEN/REFACTOR; el límite de commit y review se aplica al Módulo y a la Sesión."
        autoridad: "Aprobación explícita de Emilio para el issue #134."
        clase: contrato-visible
        falsificador: "La skill permite o exige un commit o checkpoint RDD nativo por Tarea."
        descartadas:
          - opcion: "Un commit o review nativo por Tarea."
            razon: "Fragmenta la evidencia interna en entregas y revisiones que el contrato reserva al Módulo y a la Sesión."
      - tipo: resuelta
        pregunta: "¿Cuál es el alcance por defecto de la revisión RDD nativa?"
        resolucion: "Una única transacción sobre la candidata inmutable completa de la Sesión, tras todos los Módulos y verify y antes de delivery."
        autoridad: "Aprobación explícita de Emilio para el issue #134."
        clase: contrato-visible
        falsificador: "La skill inicia una review o intento por Módulo sin una selección humana explícita para la excepción admitida."
        descartadas:
          - opcion: "Una revisión o intento nativo por cada Módulo."
            razon: "Recrea el modelo de S130 y vuelve a inferir una review de la mera existencia del Módulo."
