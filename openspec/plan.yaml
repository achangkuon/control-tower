  - id: S121
    prioridad: torre-v2
    zona: enrolamiento
    resultado: Binding Main-validado con Session ID canónico y procedencia durable de cada tab Tower-owned
    autoridad: "Enmienda de persistencia mecánica aprobada por Emilio, Engram 11293. La decisión del maintainer del 2026-09-13 conserva a Main como única autoridad assignment_ref↔session_id y exige readback S107 para procedencia; el core es escritor del estado operativo y main-store JSON será proyección de compatibilidad, no una segunda autoridad."
    depende_de:
      - S4.2
      - S4.5
    cimientos:
      - test/install/launch-worker-cli.test.mjs
    recurso:
      - assignment-location
      - launch binding y namespace de witnesses Main-owned; sin segundo assignment store
    archivos:
      - main-store/store.mjs
      - main-store/launch-consumer.mjs
      - test/main-store.test.mjs
      - test/install/launch-worker-cli.test.mjs
    encargo:
      incompleto: true
      pedido_contexto: Binding Main-validado con Session ID canónico y procedencia durable de cada tab Tower-owned
      resultado_comportamiento: "assignment-location exige session_id canónico e inmutable; ausencia, forma inválida, conflicto o registro legacy falla cerrado.\n\nEl binding copia ese ID sin caller injection y consumer revalida schema; session_id de plan nunca se confunde con OpenCode root_session_id ni se infiere.\n\nMain establece exclusivamente assignment_ref↔session_id. Para una Ejecución admitida, el core persiste el intento mecánico con esa identidad validada y expectativas workspace/cwd; el adapter devuelve el readback que permite admitir procedencia idempotente, aceptar repetición byte-idéntica y rechazar conflicto, forged o ambigüedad. Ni core ni adapter eligen assignments. main-store JSON será proyección de compatibilidad del estado canónico en SQLite, nunca un segundo escritor de autoridad; la migración y proyección necesitan su propia cobertura antes de cambiar consumidores.\n\n`listTowerTabs()` enumera procedencia read-only, nunca liveness, active-set, dispatch o cierre.\n\nLa fixture registra sólo identidad Main-owned y la CLI acepta únicamente request_ref opaco. Cada lote de revisión queda bajo 400 líneas."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: Decisión del maintainer del 2026-09-13. Main establece assignment_ref↔session_id en assignment-location; binding/consumer lo transportan y persisten workspace/tab/pane sólo tras readback S107. main-store/launch-consumer.mjs:79-88 hoy guarda sólo request_ref y binding_path. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S121. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto. Enmienda aprobada: Engram 11293 e informe docs/architecture/torre-motor-determinista.md, secciones 12 y 14. Preparación incompleta: falta delimitar API, proyección/migración y huella completa conservando la procedencia y los datos previos. No se ejecuta migración ni se concede escritura de core desde esta declaración; S147/S148 no implementan outbox, proyección ni conversión de main-store."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Quién establece Session ID y qué significa la lista de tabs?
        resolucion: Sólo Main registra el session_id canónico; la lista prueba procedencia y Radar/S108 determinan estado y cierre.
        autoridad: Decisión explícita del maintainer del 2026-09-13.
        clase: seguridad-y-permisos; contrato-visible-del-producto
        falsificador: "Caller/runtime inyecta o infiere Session ID, o S121 usa witnesses como roster/liveness."
        descartadas:
          - opcion: Persistir otro active-set o derivar identidad desde branch/worktree/seat/tab/worker.
            razon: Duplica autoridad o confía en superficies no autoritativas.
  - id: S122
    prioridad: metodo-v1
    zona: metodo
    resultado: "Radar explica por qué una Sesión no está lista y marca qué Zona se queda sin trabajo LISTO por delante, sin cambiar ninguno de los siete estados."
    autoridad: "Decisiones explícitas de Emilio del 2026-09-12 y 2026-09-13 en la conversación de diseño del horizonte (Claude Code, sesión ed42515b): los siete estados no cambian y Radar suma un motivo calculado; los tipos son espera natural, espera atascada, falta decidir y falta planificar; el horizonte mantiene 2 Sesiones LISTO por Zona como número propio, separado de planning.horizon_ceiling de S101. Hoy radar status --json expone sólo id, zona, estado y resultado (agent-workflows/tools/radar/snapshot.go:55-60) y la clasificación completa se obtuvo con un script aparte."
    depende_de:
      - S127
    cimientos:
      []
    recurso:
      []
    archivos:
      - agent-workflows/tools/radar/state.go
      - agent-workflows/tools/radar/state_test.go
      - agent-workflows/tools/radar/snapshot.go
      - agent-workflows/tools/radar/snapshot_test.go
      - agent-workflows/tools/radar/render.go
      - agent-workflows/tools/radar/render_test.go
      - agent-workflows/tools/radar/testdata/ROADMAP.golden.md
    encargo:
      pedido_contexto: "Radar explica por qué una Sesión no está lista y marca qué Zona se queda sin trabajo LISTO por delante, sin cambiar ninguno de los siete estados."
      resultado_comportamiento: "Para el plan vigente, los siete estados que calcula Radar son idénticos antes y después del cambio.\n\nCada Sesión en PLANIFICADO o BLOQUEADO lleva un motivo con exactamente uno de cuatro tipos —espera-natural, espera-atascada, falta-decision, falta-planificar— y los IDs de su raíz; LISTO, COMPLETO, ARCHIVADO y DIFERIDO no llevan motivo.\n\nUna Sesión PLANIFICADO cuya cadena de dependencias termina en una BLOQUEADO se clasifica espera-atascada y nombra esa raíz; una cuya cadena termina sólo en LISTO se clasifica espera-natural.\n\nUna dependencia hacia un ID ausente de sesiones se clasifica falta-planificar y nombra ese ID; un ciclo de dependencias produce un resultado estable y nunca cuelga ni entra en pánico.\n\nPor cada Zona, radar.snapshot/v1 informa cuántas Sesiones LISTO tiene en cola y marca déficit de horizonte cuando son menos de 2, con las raíces a preparar ordenadas por cuántas Sesiones destraba cada una.\n\nEl umbral de horizonte es 2 y el cálculo no lee planning.horizon_ceiling ni la política que resuelve S101.\n\nLa vista generada muestra el motivo al lado de cada Sesión no lista.\n\nRadar sigue sin escribir openspec/plan.yaml y sin lanzar, asignar ni despachar trabajo."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: Decisiones explícitas de Emilio del 2026-09-12 y 2026-09-13 en la conversación de diseño del horizonte (Claude Code, sesión ed42515b): los siete estados no cambian y Radar suma un motivo calculado; los tipos son espera natural, espera atascada, falta decidir y falta planificar; el horizonte mantiene 2 Sesiones LISTO por Zona como número propio, separado de planning.horizon_ceiling de S101. Hoy radar status --json expone sólo id, zona, estado y resultado (agent-workflows/tools/radar/snapshot.go:55-60) y la clasificación completa se obtuvo con un script aparte. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S122. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Las situaciones que impiden estar LISTO se modelan como estados nuevos, como subestados de BLOQUEADO o como una nota de motivo?"
        resolucion: Como una nota de motivo calculada al lado del estado. Los siete estados del canon quedan intactos.
        autoridad: "Decisión de Emilio del 2026-09-13, elegida sobre tres alternativas presentadas con su consecuencia."
        clase: contrato-visible
        falsificador: "Radar agrega, combina o renombra un estado, o cambia el estado calculado de alguna Sesión del plan vigente."
        descartadas:
          - opcion: Agregar un estado nuevo por cada tipo.
            razon: "Rompe el conjunto cerrado de siete del canon §9 y obliga a cambiar el schema versionado del snapshot de sesiones, su contrato, la vista y los cuatro agentes."
          - opcion: Mover espera atascada y falta planificar a BLOQUEADO con un subestado.
            razon: "Cambia el significado de dos estados y lleva BLOQUEADO de 10 a 15 Sesiones, que el canon trata como defecto de planificación."
      - tipo: resuelta
        pregunta: ¿De dónde sale el umbral de 2 Sesiones LISTO por Zona?
        resolucion: "Es un número propio del horizonte, fijo en 2 por Zona y separado de planning.horizon_ceiling, que S101 resuelve con otro significado."
        autoridad: "Decisión de Emilio del 2026-09-13, elegida sobre tres alternativas presentadas con su consecuencia."
        clase: contrato-visible
        falsificador: Radar lee planning.horizon_ceiling o la política resuelta para calcular el déficit de horizonte.
        descartadas:
          - opcion: Fijarlo en Radar ahora y reemplazarlo por la política de S101 cuando se destrabe.
            razon: "Ata al mismo número dos significados distintos: cuántas Sesiones hereda una aprobación y cuántas LISTO mantiene cada Zona."
          - opcion: Leerlo de la política resuelta desde el principio.
            razon: S122 heredaría el bloqueo de S101 y no podría empezar.
