      - test/extensions/pi/tower-v1-semaphore.test.mjs
    encargo:
      pedido_contexto: "La adopción project-local necesita una frontera Pi V1 mínima y aislada antes de introducir skills, kernel o lifecycle. Los puentes vigentes de continuation y V2 no son una base reutilizable para este paquete."
      resultado_comportamiento: "adapters/pi/semaphore-v1.mjs invoca el binario del semáforo por la ruta absoluta provista por el caller. extensions/pi/tower-v1/ es un paquete Pi dedicado que consume sólo ese adapter y registra exactamente las ocho herramientas tower_*, ni una menos ni una de más.\n\nEl paquete permanece inerte hasta que un proyecto adoptante lo carga explícitamente: no registra interceptores de entrada, routing, comandos CV_*, slash commands, procesos, sockets ni operaciones Git al importar o al iniciar Pi.\n\nNingún archivo importa, reexporta ni copia bytes de adapters/pi/runtime.mjs, extensions/pi/tower-session-router.ts, continuation/ o maquinaria Torre V2. Las dos pruebas enfocadas cubren invocación, membresía exacta de herramientas, carga explícita y ausencia de esos acoplamientos y efectos.\n\nEl diff toca sólo los cinco archivos declarados."
      restricciones_decisiones: "ODD es la ruta técnica; SDD sólo por solicitud humana explícita. Sólo los cinco archivos declarados están autorizados. Esta Sesión no implementa la skill, el kernel de autoridad/preguntas, integraciones opcionales, packaging, instalación, cleanup, benchmark ni documentación. No toca configuración global, HOME real, procesos, sockets ni Git de un proyecto."
      referencias: "Autoridad canónica de la clasificación opcional V2. Evidencia preservada: implementer-2 limpio en work/S165@290507b416e6e24ce39c81fd02ca85d79d90a3e6 y ausencia de los cinco paths autorizados; no hay bytes que trasladar."
