    encargo:
      pedido_contexto: "Radar mide cada Módulo entregado con la fórmula de la política —líneas agregadas más borradas, sin las rutas que el plan excluye— y avisa cuando supera el tope declarado."
      resultado_comportamiento: "Con `politica.tope_de_lote` declarado, Radar mide cada Módulo entregado de una Sesión sumando líneas agregadas y borradas de los commits que llevan su trailer `Modulo:`.\n\nLas rutas declaradas en `politica.excluir_del_lote` —prefijos de directorio o archivos exactos— no cuentan; sin esa lista no se excluye ninguna ruta.\n\nUn Módulo que supera el tope emite un aviso `tope de lote` que nombra la Sesión, el Módulo, las líneas medidas y el tope; nunca un error.\n\nUna Sesión entregada sin trailers de Módulo se mide por su commit de entrega con la misma fórmula.\n\nSin `tope_de_lote` declarado Radar no mide ni falla.\n\nLa medición usa la ancestría del HEAD inmutable y nunca el árbol de trabajo.\n\n`go test ./...` en `agent-workflows/tools/radar` pasa y el diff toca sólo Área."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: Aprobación de Emilio del 2026-09-14 (Claude Code, sesión df306f72), problema 2, opción 1, y decisión 2 sobre dónde viven las exclusiones. Evidencia: agent-workflows/tools/radar/check.go:905-922 cuenta sólo líneas agregadas del commit de entrega e incluye openspec/, mientras AGENTS.md:117 fija 400 líneas por lote revisado, agregadas más borradas y sin artefactos de planificación ni generados. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S129. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Las rutas excluidas del tope son constantes del código o un dato del plan?
        resolucion: "Un dato del plan: `politica.excluir_del_lote`."
        autoridad: "Aprobación de Emilio del 2026-09-14, decisión 2, con el mismo principio que S113 aplicó al tope."
        clase: contrato-visible
        falsificador: Las rutas excluidas aparecen escritas como literal en el código de Radar.
        descartadas:
          - opcion: Fijar las exclusiones como constantes en Go.
            razon: Convierte una política de cada proyecto en una decisión de compilación.
      - tipo: resuelta
        pregunta: ¿Con qué fórmula se mide el lote?
        resolucion: "Líneas agregadas más borradas de cada Módulo entregado, sin las rutas excluidas."
        autoridad: "AGENTS.md:117 y aprobación de Emilio del 2026-09-14, problema 2, opción 1."
        clase: contrato-visible
        falsificador: "Radar cuenta sólo líneas agregadas, o mide sólo el commit de entrega de una Sesión que tiene trailers de Módulo."
        descartadas:
          - opcion: Conservar la fórmula de S113.
            razon: "Cuenta los .md de planificación, ignora las líneas borradas y mide un solo commit."
