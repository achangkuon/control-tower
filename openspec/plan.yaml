  - id: S190
    zona: producto-torre
    prioridad: torre-v1-distribucion-socios
    diferida: true
    resultado: "La interfaz Go llega verificada a cada máquina Linux y Mac y torre-control la abre por defecto, publicada como v1.1.0."
    autoridad: "Emilio aprobó el 2026-10-02 en esta Conversación el rediseño del instalador al estilo Gentle AI en Go + Bubbletea y en español, dividido en S187–S190."
    depende_de: [S191]
    archivos: [product/tower/v1/release-build.mjs, product/tower/v1/test/release-build.test.mjs, product/tower/v1/install.mjs, product/tower/v1/test/install.test.mjs, product/tower/v1/cli.mjs, product/tower/v1/test/cli.test.mjs, product/tower/v1/global.mjs, product/tower/v1/test/global.test.mjs, README.md, product/tower/v1/INSTALL-AGENTS.md]
    cimientos: [README.md]
    recurso: []
    encargo:
      pedido_contexto: >-
        Un programa Go pesa varios MB por sistema y no cabe en el paquete actual
        (límite de 1 MiB por miembro). Debe llegar a los socios con el mismo modelo de
        confianza: un solo SHA-256 por segundo canal y verificación antes de ejecutar.
      resultado_comportamiento: >-
        El constructor de releases compila la interfaz para Linux y macOS (amd64 y
        arm64) desde un commit limpio, como assets separados cuyos SHA-256 quedan
        fijados en el instalador sellado. El instalador baja y verifica sólo el
        binario de la plataforma antes de usarlo y lo instala junto a la versión
        activa. torre-control sin argumentos en una terminal abre la interfaz; si no
        está disponible o falla al iniciar, cae al menú actual. README y la guía para
        agentes se actualizan. Se publica la release v1.1.0 y se repite la prueba de
        socio de punta a punta; la prueba en Mac queda registrada.
      restricciones_decisiones: >-
        Se mantiene S174: gh autenticado, tag exacto, nada sin verificar. Release
        privado, decisión de publicar aparte. Sólo los archivos declarados y
        README.md como Cimiento. Pronóstico de 300–500 líneas authored; el tamaño
        sigue la guía nativa de Gentle AI y no es una restricción de esta Sesión.
      referencias: >-
        release-build.mjs, install.mjs, global.mjs (lanzador y almacén de
        versiones), bootstrap.mjs límites de miembros; S184 pendiente de la prueba en
        Mac.

