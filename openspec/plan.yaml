  - id: S184
    zona: producto-torre
    prioridad: torre-v1-distribucion-socios
    diferida: true
    resultado: "Un socio con acceso al repo instala torre-control con un solo comando gh, en Linux y Mac, sin clonar el repositorio."
    autoridad: "Emilio eligió el 2026-10-02 en esta Conversación un instalador de un solo comando con gh, privado, para socios que ya tienen acceso al repositorio, y confirmó que hay una Mac disponible para probarlo. El mismo día pidió además una guía en el repositorio para que el agente de un socio instale la Torre solo con el enlace de GitHub (product/tower/v1/INSTALL-AGENTS.md)."
    depende_de: [S183]
    archivos: [product/tower/v1/install.mjs, product/tower/v1/test/install.test.mjs, product/tower/v1/release-build.mjs, product/tower/v1/test/release-build.test.mjs, README.md, product/tower/v1/INSTALL-AGENTS.md]
    cimientos: [README.md]
    recurso: []
    encargo:
      pedido_contexto: >-
        Hoy la primera instalación exige clonar el repositorio privado y correr un
        comando largo con Bun. El mantenedor quiere compartir la Torre con socios
        que ya tienen acceso al repo, con una experiencia de un solo comando como
        Gentle AI, en Linux y Mac. Sólo está probada en Linux (WSL).
      resultado_comportamiento: >-
        Un único comando pegable, con gh autenticado, tag fijo y el SHA-256 que el
        mantenedor comunica por un segundo canal, descarga desde el Release privado
        lo necesario, verifica el SHA-256 antes de ejecutar cualquier byte
        descargado e instala el motor global sin clonar el repositorio. Funciona en
        Linux y macOS, comprueba requisitos (gh, Bun, Git, Go) y dice cuál falta. El
        README suma una guía para socios: requisitos, el comando, cómo adoptar un
        proyecto y abrirlo en Claude Code y Pi, y cómo deshacer. Una prueba guiada
        en una Mac real queda registrada con su resultado; hasta pasarla, el README
        declara macOS como no probado.
      restricciones_decisiones: >-
        Se mantiene la decisión de S174: gh autenticado, tag exacto, sin latest,
        sin descargas sin verificar y sin atajos tipo install.sh fuera de esa
        verificación; el instalador de un comando es el mismo camino seguro, no un
        fallback. Release privado; no se publica en Homebrew. Sólo los archivos
        declarados y README.md como Cimiento. Pruebas aisladas sin red real.
        Pronóstico de 250–450 líneas authored; el tamaño sigue la guía nativa de
        Gentle AI y no es una restricción de esta Sesión. Publicar la nueva release
        es una decisión humana aparte.
      referencias: >-
        product/tower/v1/release.mjs, bootstrap.mjs, cli.mjs y release-build.mjs;
        instalación de Gentle AI vía Homebrew como referencia de experiencia;
        hallazgos de la prueba real del 2026-10-02 (Engram 12940).

