            consecuencia: Ningún contrato huérfano viaja en el runtime.
        autoridad: Regla de consumidor real de la Fase 4 del plan de depuración.
        falsificador: Queda un miembro de RUNTIME_PAYLOAD_FILES sin llamador al cerrar.
      - tipo: derivable
        pregunta: ¿Dónde quedan los bytes retirados?
        criterio: Se preservan en una rama de archivo como el dashboard en origin/archive/dashboard-vpn; un retiro sin rama de preservación falsifica la derivación.
        evidencia: Precedente ejecutado del retiro del dashboard preservado en el contrato histórico S5.15.
        checkpoint: antes del segundo Módulo histórico
        opciones:
