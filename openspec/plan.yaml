      resultado_comportamiento: "En un proyecto registrado, cada una de las cuatro frases exactas, con o sin Sesión/topic, alcanza el mismo parent route torre-control; ninguna otra frase se acepta.\n\nEl route consulta el probe compartido y selecciona ON u OFF sin pedir al usuario que declare el modo; INDETERMINATE falla cerrado y no llega al modelo.\n\nUn proyecto no registrado continúa sin captura y explica enrollment sólo cuando el usuario invoca explícitamente la superficie Tower correspondiente.\n\nOFF usa peers vivos aprobados y skills sin fabricar garantías Tower. En ON, el route es un adaptador delgado del core: solicita la transición admitida y materializa su paquete ligado; no reconstruye lifecycle, binding, persistencia ni retry desde prompts o transcripts. El core conserva la autoridad mecánica de esas transiciones sin elegir trabajo ni sustituir la aprobación humana.\n\nEl contrato viejo de S9.6 queda como historia cerrada y no se reabre ni recibe crédito nuevo.\n\nEl diff toca sólo Área."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: decisión 104, Engram 10008 y fuente cerrada de S9.6 como antecedente, no como contrato visible vigente. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S9.7. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto. Enmienda aprobada: Engram 11293 e informe docs/architecture/torre-motor-determinista.md, secciones 11 y 14. Preparación incompleta: falta delimitar la API/IPC consumida por el harness ON, su cobertura y la huella final; no se amplían los archivos conocidos ni se implementa esa API aquí por inferencia. S147/S148 no sustituyen esa cobertura ni autorizan activación."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Cuál es el route padre y qué triggers públicos acepta?
        resolucion: "Un único parent route torre-control detecta ON/OFF/INDETERMINATE y acepta exactamente, para proyectos registrados, “empezamos la jornada”, “prepará el espacio de trabajo”, “continuemos con la implementación” y “quiero continuar con la implementación”, con Sesión/topic opcional."
