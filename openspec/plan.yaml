        controls.mjs sigue siendo importado por pi-authority.mjs:9 e interventions.mjs:20, así
        que no se retira completo: sólo se quita lo que quede efectivamente sin uso tras remover
        el clic. Claude Code no tiene hoy un mecanismo que muestre el menú de etapas; esta Sesión
        agrega el hook que lo hace, sin cablearlo todavía a ~/.claude/settings.json.
      resultado_comportamiento: >-
        La plantilla de la extensión de Pi ya no pregunta chanks_request_activation ni usa
        ctx.ui.confirm. Con el interruptor por repositorio encendido y una Sesión aprobada sin
        admitir, la extensión sigue bloqueando escrituras del worktree; en cuanto Radar admite la
        Sesión (misma verificación de S157), el bloqueo se libera solo, sin pregunta. En Main la
        extensión deja de quedar inerte: guía mostrando el menú de etapas que calcula
        `radar etapa`, y anuncia 💪 únicamente en una transición de etapa, nunca en un bloqueo.
        pi-admission.mjs, pi-authority.mjs, pi-switch.mjs y pi-controls.mjs reflejan ese cambio;
        controls.mjs e interventions.mjs se conservan porque siguen siendo importados, y sólo se
        retira el código que la remoción del clic deja genuinamente sin uso. Las pruebas bajo
        agent-workflows/tests/chanks/ y test_install.py cubren la ausencia del clic, la
        liberación automática al admitir, y que Main ya no queda inerte.

        Un hook nuevo para Claude Code ejecuta `radar etapa` y presenta el mismo menú y la misma
        transición 💪 que ve Pi. install.py no toca ~/.claude/settings.json hoy y esta Sesión no
        lo cambia: cablear el hook ahí es un paso operativo que exige confirmación humana
        explícita al entregar, no un archivo del repo.
      restricciones_decisiones: >-
        Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana
        explícita. Sólo los archivos declarados están autorizados; toda expansión requiere
        aprobación humana y compatibilidad fresca antes de escribir. El modelo no puede fabricar
        la admisión de Radar ni encender el interruptor por repositorio; esa autoridad sigue
        siendo del humano y de Radar, igual que en S153. controls.mjs e interventions.mjs se
        tocan sólo para retirar código genuinamente muerto, nunca sus exports usados por
        pi-authority.mjs o interventions.mjs. Cablear el hook nuevo en ~/.claude/settings.json y
        habilitarlo de verdad requiere confirmación humana explícita al entregar; install.py no lo
        hace por sí solo.
      referencias: >-
        install.py PI_EXTENSION_TEMPLATE (~523-795) e imports (~806-811). controls.mjs importado
        por pi-authority.mjs:9 e interventions.mjs:20. Decisiones conservadas de S151 y S153
        (Engram 11368, 11423, 11462, 11475). Documento de diseño: 'Chanks como guía de etapas —
        análisis por tramos' (claude.ai artifact 56421c44-de32-4b92-b4f7-6b428a6db555) y Engram
        topics chanks/stage-router-*. Revalidar contra el árbol vigente antes de escribir.
    decisiones:
      - tipo: resuelta
        pregunta: "¿Qué reemplaza a ctx.ui.confirm como condición para liberar la escritura del worktree en Pi?"
        resolucion: La admisión de Radar sobre la misma Sesión (misma identidad, HEAD y evidencia que ya usa session-kickoff en S157); ninguna pregunta nativa de Pi ni una respuesta del modelo liberan la escritura por sí solas.
        autoridad: Aprobación explícita de Emilio el 2026-09-24 en esta Conversación.
        clase: seguridad-y-permisos
        falsificador: Una escritura de worktree ocurre sin admisión de Radar, o la extensión acepta una respuesta del modelo como si fuera la del humano.
        descartadas:
          - opcion: Mantener ctx.ui.confirm en Pi y sólo quitarlo del resto de los runtimes.
            razon: Deja a Pi con un mecanismo distinto al resto y no resuelve la fricción que motivó el rediseño.
        contaminaba: [S157, S159]
      - tipo: resuelta
        pregunta: "¿Esta Sesión cablea el hook nuevo de Claude Code en ~/.claude/settings.json?"
        resolucion: No. install.py no toca settings.json hoy y esta Sesión entrega el script del hook sin activarlo; cablearlo y confirmarlo de verdad queda para la entrega, con confirmación humana explícita.
        autoridad: Aprobación explícita de Emilio el 2026-09-24 en esta Conversación.
        clase: seguridad-y-permisos
        falsificador: install.py o esta Sesión modifican ~/.claude/settings.json sin confirmación humana explícita al entregar.
        descartadas:
          - opcion: Cablear el hook automáticamente al instalar.
            razon: Cambia el comportamiento de Claude Code fuera del repo sin que el humano lo confirme explícitamente.
        contaminaba: [S159]
