  - id: S119
    prioridad: torre-v2
    zona: producto-torre
    resultado: "La Torre declara su propia skill de runtime de Herdr: activa sólo ante un pedido explícito de Herdr, y todo despacho, ON/OFF, topología y ciclo de vida de asiento sigue enrutando por `torre-control` → `torre asiento`."
    autoridad: "openspec/plans/audits/herdr-skill-ownership-audit.md y su patch, más decisiones del maintainer del 2026-09-11/13: la skill activa sólo por pedido explícito y delega lifecycle a `torre-control` → `torre asiento` → S108, sin roster S109 ni Herdr raw."
    depende_de:
      - S117
      - S108
    cimientos:
      - product/tower/skills/torre-control/SKILL.md
      - test/install/tower-role-assets.contract.mjs
    recurso:
      []
    archivos:
      - product/tower/skills/herdr/SKILL.md
      - product/tower/skills/torre-control/SKILL.md
      - test/install/tower-role-assets.contract.mjs
    encargo:
      pedido_contexto: "La Torre declara su propia skill de runtime de Herdr: activa sólo ante un pedido explícito de Herdr, y todo despacho, ON/OFF, topología y ciclo de vida de asiento sigue enrutando por `torre-control` → `torre asiento`."
      resultado_comportamiento: "`product/tower/skills/herdr/SKILL.md` activa sólo ante pedido explícito y enruta assignment/topología/lifecycle por `torre-control` → `torre asiento`; cierre consume sólo S108.\n\nLa skill nunca deriva trabajo activo, enumera witnesses S121, interpreta Radar, acepta roster S109 ni manipula recursos extranjeros/ambiguos.\n\nLa skill lleva las cuatro claves de frontmatter que exige `SKILL_FRONTMATTER_KEYS` (name, description, license, metadata) y las seis secciones que exige `SKILL_SECTIONS`.\n\nEl registro de assets declara la skill con markers que fijan las dos oraciones de propiedad de la Torre y las dos de aprobación humana del patch preservado, y la suite completa pasa.\n\nLa skill no documenta ninguna mecánica de la CLI de Herdr que `herdr --skill` ya emite. Falsificador: cualquier flag, timeout o código de error documentado en ambos archivos es un duplicado y falla este criterio.\n\n`radar check` reporta 0 huérfanos, 0 solapes y 0 reglas sin uso, y `owners()` resuelve `product/tower/skills/herdr/SKILL.md` sólo a producto-torre, sin Cimiento.\n\n`product/tower/skills/torre-control/SKILL.md` gana una referencia a la skill nueva y sus markers existentes siguen pasando sin cambios."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: openspec/plans/audits/herdr-skill-ownership-audit.md y su patch, más decisiones del maintainer del 2026-09-11/13: la skill activa sólo por pedido explícito y delega lifecycle a `torre-control` → `torre asiento` → S108, sin roster S109 ni Herdr raw. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S119. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: "¿En qué Zona vive esta Sesión, si la skill está en producto-torre y el manifest que la declara en instalacion?"
        resolucion: "En `producto-torre`. La Sesión vive donde vive el producto —es una skill de la Torre— y el manifest declarante se reserva como Cimiento de archivo exacto, que es el mecanismo que el plan ya usa para archivos compartidos."
        autoridad: "Decisión del maintainer del 2026-09-11, tomada sobre la escalada que la propuesta original del 2026-09-04 dejó abierta y que la separación constructor/Torre volvió inevitable: cuando se escribió, la skill y su manifest vivían en un solo territorio."
        clase: contrato-visible
        falsificador: "Una Sesión de la Zona instalacion escribe dentro de `product/tower/`, cruzando la frontera entre el constructor y la Torre."
        descartadas:
          - opcion: "Dejarla en `instalacion` como la escribió su autor."
            razon: "Hoy significaría que una Sesión de instalación escribe dentro de product/tower/, que es exactamente la frontera que la separación trazó."
          - opcion: "Partirla en dos Sesiones, una por Zona."
            razon: "Cada territorio quedaría limpio, pero el resultado deja de ser revisable de una sola vez: la primera entregaría una skill que nada declara todavía."
      - tipo: derivable
        pregunta: "¿Esta skill toma un nombre `chanks-<tramo>-<nombre>`?"
        resolucion: "No. Es una skill de maquinaria y vive al lado de `torre-control`."
        autoridad: agent-workflows/FLUJO-END-TO-END.md:164-168
        clase: interna
        checkpoint: antes de T119.1.2
        evidencia: "El flujo aprobado dice que la skill de runtime de Herdr «no reemplaza `torre asiento` ni se convierte en una skill nueva del método». El prefijo `chanks-` es la marca de las skills del método, que se instalan globalmente en los cuatro agentes; esta skill vive dentro del producto Torre y se empaqueta con él."
        criterio: "La skill toma un nombre `chanks-<tramo>-<nombre>`, o queda instalada en los directorios globales de skills de los agentes."
        opciones:
          - opcion: "Nombre de maquinaria, al lado de `torre-control` dentro de `product/tower/skills/`."
            consecuencia: La skill viaja con el producto Torre y no entra al método global; la frontera constructor/Torre se mantiene.
          - opcion: "Nombre `chanks-<tramo>-<nombre>` como skill del método."
            consecuencia: Contradice la oración del flujo aprobado y mete una skill del producto en el método global de los cuatro agentes.
  - id: S120
    prioridad: metodo-v1
    zona: metodo
    # Reemplazada por S135 el 2026-09-14 por decisión de Emilio: SDD nativo sólo para full-sdd.
