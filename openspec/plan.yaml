        autoridad: "Maintainer, 2026-09-10, sobre el documento de diseño; el patrón ya está probado en agent-workflows/radiografia/measure.mjs desde 969f189."
        clase: contrato-visible
        falsificador: "Alguna regla de cálculo de Radar aparece reimplementada en JavaScript, o el consumidor acepta un snapshot cuyo schema no reconoce."
        descartadas:
          - opcion: "Portar EstadosAt, ColaPorZonaAt, AvanceAt y AsientosAt a JavaScript."
            razon: "Rechazada: son 309 líneas de reglas no triviales y dejaría dos implementaciones del mismo reglamento, que es la falla que la migración a Zonas acaba de eliminar."
      - tipo: resuelta
        pregunta: ¿Dónde corre el cálculo del plan cuando la Torre lo necesita?
        resolucion: "Radar viaja con la Torre y se invoca contra cada proyecto. Radar es el radar de la Torre, no una dependencia que cada proyecto deba traer."
        autoridad: "Maintainer, 2026-09-10. El registro ya guarda roadmap_path y manifest_path por proyecto en schemas/project-registry-v1.schema.json."
        clase: expansion-de-alcance
        falsificador: "La Torre exige que el proyecto gestionado provea Radar por su cuenta, o el cálculo se resuelve con un caché en disco pese a que el estado depende de HEAD."
        descartadas:
          - opcion: Generar un snapshot en disco y leerlo cuando haga falta.
            razon: "Rechazada: el estado depende de HEAD por merge-base --is-ancestor en agent-workflows/tools/radar/git.go:80, así que el caché queda viejo en cada commit y no sólo al editar el plan."
      - tipo: resuelta
        pregunta: ¿Main sigue corriendo los tests?
        resolucion: "No los corre: los lee. La Torre ejecuta y guarda la salida completa; a Main le entrega el veredicto y sólo el extracto de lo que falló."
        autoridad: "Maintainer, 2026-09-10, sobre el documento de diseño."
        clase: contrato-visible
        falsificador: "Main vuelve a recibir la salida completa de una suite, o la Torre emite un veredicto sobre si un criterio se cumplió."
        descartadas:
          - opcion: Que la Torre además juzgue si el resultado es aceptable.
            razon: "Rechazada: distinguir una regresión de un fallo ambiental conocido es juicio sobre evidencia y no tiene respuesta única."
      - tipo: resuelta
        pregunta: ¿Esta Sesión elimina el agente Main?
        resolucion: "No. Main sigue existiendo y conserva el juicio, la resolución de ambigüedad y la presentación de decisiones al humano; lo que cambia es que deja de derivar lo que ya está calculado."
        autoridad: "Maintainer, 2026-09-10: «no estamos eliminando main, estamos protegiendo su ventana de contexto»."
        clase: seguridad-y-permisos
        falsificador: Un actor que no es Main obtiene autoridad de asignación o despacho a partir de esta Sesión.
        descartadas:
          - opcion: Que la Torre asuma también el despacho y Main desaparezca.
            razon: "Rechazada por el maintainer: el objetivo es la ventana de contexto, no reemplazar al agente."
