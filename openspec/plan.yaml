  - id: S5.14
    resultado: La profundidad de planificación deja de estar clavada y pasa a provenir de la política resuelta sin que la Torre interprete nombres de fase ni números de horizonte.
    autoridad: Contrato histórico de la decisión 71 y la frontera Torre-gentle-ai; se conserva sólo como evidencia archivada y no confiere autoridad de ejecución actual.
    depende_de: [S5.13]
    recurso: []
    archivada: true
    criterios:
      - "rg 'TAREAS' continuation/ policy/ devuelve cero ocurrencias."
      - El 2 de horizon sale del código y proviene de planning.horizon_ceiling.
      - Un proyecto que declare otra profundidad continúa sin tocar una línea de la Torre.
      - Una política sin prepare_through falla cerrado, con su código, y no asume un default permisivo.
      - horizon_ceiling, merge.authorizing_party, delivery.shape y los cinco pisos de assertFloorProtected conservan exactamente el mismo comportamiento.
      - bun test no introduce fallos nuevos; el diff no toca ninguna ruta prohibida por el contrato histórico.
    decisiones:
      - tipo: derivable
        pregunta: ¿Dónde vive prepare_through?
        criterio: Vive en el bloque planning de delivery-policy junto a horizon_ceiling; un segundo lugar del repositorio que declare profundidad de planificación falsifica la derivación.
        evidencia: Enmienda de contrato del 2026-08-03 preservada en el contrato histórico S5.14.
        checkpoint: antes del primer Módulo histórico
        opciones:
          - opcion: Declararlo en planning junto a horizon_ceiling.
            consecuencia: La profundidad queda gobernada por una sola política de planificación por proyecto.
        autoridad: Enmienda de contrato del 2026-08-03.
        falsificador: Existe un segundo lugar del repositorio que declara profundidad de planificación.
      - tipo: derivable
        pregunta: ¿Qué valida la Torre sobre prepare_through?
        criterio: Es una cadena no vacía y coincide con la política resuelta; cualquier comparación contra un literal de fase en producción falsifica la derivación.
        evidencia: Test de contenido de la frontera Torre-gentle-ai preservado en el contrato histórico S5.14.
        checkpoint: antes del primer Módulo histórico
        opciones:
          - opcion: Comparar el valor con la política resuelta sin interpretar su significado.
            consecuencia: La Torre valida autoridad sin conocer nombres de fase.
        autoridad: Test de contenido de la frontera Torre-gentle-ai.
        falsificador: Código de producción compara prepare_through contra un literal de fase.
      - tipo: derivable
        pregunta: ¿Qué default lleva prepare_through?
        criterio: restrictiveDefaults lo trata igual que horizon_ceiling y falla cerrado si la política no lo declara; una continuación que avance con política incompleta falsifica la derivación.
        evidencia: Default fail-closed de la enmienda del 2026-08-03 preservado en el contrato histórico S5.14.
        checkpoint: antes del primer Módulo histórico
        opciones:
          - opcion: Exigir prepare_through en restrictiveDefaults sin default permisivo.
            consecuencia: Una política incompleta no habilita continuación.
        autoridad: Default fail-closed de la enmienda del 2026-08-03.
        falsificador: Una continuación avanza con la política incompleta.
