  - id: S9.8
    prioridad: v3-flota
    zona: hosts
    cimientos:
      - product/tower/skills/torre-control/SKILL.md
      - product/tower/skills/torre-control-entregas/SKILL.md
    resultado: "Dispatch sin espera y estado terminal visible en Main y tabs; absorbe S9.7, S168 y S171 sin reclamar paralelismo cuando el host serializa."
    autoridad: "Resultado opcional Torre V2 y consolidación S9.7/S168/S171 seleccionados explícitamente por el maintainer; conserva la política fire-and-forget de la decisión 104."
    depende_de: [S1.18]
    recurso:
      - dispatch_id
      - canal Intercom ya ligado por S1.18 y mailbox de Main; sin ownership de Herdr
      - lifecycle de procesos o entrega Git
    diferida: true
    archivos:
      - product/tower/skills/torre-control/SKILL.md
      - product/tower/skills/torre-control-entregas/SKILL.md
      - test/extensions/pi/tower-session-router.test.mjs
    encargo:
      pedido_contexto: "Varias Sesiones pueden trabajar durante horas en tabs separadas; Main necesita enviar sin esperar y ver finalización, stalls o decisiones humanas. En V3 (Flota) el despacho sirve a una conversación orquestadora por vuelo (P13): la unidad de trabajo es el vuelo, y el dispatch no elige Sesiones fuera de los vuelos aprobados."
      resultado_comportamiento: "Main conserva la autoridad humana de assignment y solicita el despacho. Para una Ejecución admitida, el core registra el intento y dispatch_id y emite el paquete ligado; el adapter transporta el envío y Main vuelve inmediatamente a coordinar después del acknowledgment de envío. La entrega del mensaje no prueba ejecución ni avance.\n\nProgreso y cierre llegan por send; ask sólo aparece con una pregunta de decisión exacta y deja el assignment BLOCKED recuperable.\n\nCada assignment acepta exactamente un terminal COMPLETED, BLOCKED o FAILED con los campos de evidencia/recoverability aprobados; duplicado, stale o sin dispatch_id falla cerrado.\n\nUn candidato local, un pane activo o trabajo parcial sin terminal no acredita progreso ni habilita downstream.\n\nAntes de cada dispatch o retry, S9.8 usa el binding objetivo consolidado de S107; `active_unchanged` y cierres terminales exactos son convergencia válida, mientras evidencia ausente, fallida, ambigua o divergente produce cero dispatch.\n\nS9.8 no enumera, deriva, renombra ni cierra tabs, panes o workspaces; consume sólo la identidad y el estado visible provistos por S107.\n\nOFF no atribuye persistencia/retry Tower-owned; ON exige binding y convergencia S107 del objetivo, sin bloquear por otras Sesiones activas válidas.\n\nEl diff toca sólo Área."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: decisión 104 y Engram 10008; consolidación V2 aprobada que absorbe S9.7, S168 y S171. La observación remota es Moshi + Tailscale, no Telegram. RDD conserva su autoridad externa. Reencuadre V3: docs/architecture/piloto-automatico.md (sección 12; P13)."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Cuál es la política de dispatch y cierre asíncrono?
        resolucion: Dispatch es fire-and-forget; Main bloquea sólo ante una decisión verdadera; send lleva progreso/completion y ask queda reservado a decisión humana.
        autoridad: decisión 104 y Engram 10008.
        clase: contrato-visible-del-producto; seguridad-y-permisos
        falsificador: "Un dispatch espera ordinariamente, ask se usa fuera de una decisión humana, send no lleva progreso/completion, o Main acredita trabajo sin terminal válido."
        descartadas:
          []
      - tipo: derivable
        pregunta: ¿Cuándo acredita Main avance del assignment?
        criterio: "COMPLETED exige evidence refs, changed paths y tests; BLOCKED/FAILED exigen razón y recoverability; estado parcial, pane visible o candidato local no acredita progreso."
        autoridad: decisión 104 y Engram 10008.
        evidencia: Contrato inmutable de S9.8.
        checkpoint: antes de acreditar progreso o habilitar downstream.
        opciones:
          - opcion: Acreditar sólo un terminal válido ligado al dispatch_id.
            consecuencia: "Progreso parcial, pane visible o candidato local no habilitan downstream."
