        pregunta: "Antes de RED, con la previsión inicial de 700–1100 líneas y su refinamiento técnico, ¿se aprueban entregas secuenciales verificables y reversibles o una excepción de tamaño para S147?"
        evidencia: "La aprobación 11305 excluyó expresamente presupuesto e implementación; el forecast de schemas, helpers, fixtures y pruebas supera la referencia de revisión de 400 líneas."
        contaminaba: [S147]
