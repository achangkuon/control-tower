      - tipo: resuelta
        pregunta: ¿Qué política operacional host-neutral gobierna producer proof, frescura, estado runtime, stop y attach?
        resolucion: El productor emite un challenge de un solo uso ligado a la operación exacta, al binding actual y a la incarnation actual; sólo se acepta la proof coincidente emitida por ese mismo productor. Observe informa evidencia sin promover incertidumbre. Health distingue proven healthy, disconnected/unknown y proven dead. Stop separa el acuse de la solicitud del stop o death probado y nunca convierte una desconexión en muerte. Attach acepta únicamente proof fresca coincidente y devuelve un acknowledgment ligado al mismo binding e incarnation.
        autoridad: maintainer, elección explícita de la política conservadora transmitida por Main el 2026-08-28; decisión 92
        clase: contrato-visible-del-producto; api-publica; seguridad-y-permisos
        falsificador: Una proof de otro productor, operación, binding o incarnation gana autoridad; un challenge se consume más de una vez; observe convierte incertidumbre en hecho; health o stop equiparan desconexión con muerte; o attach acepta proof stale y devuelve un resultado no ligado al contexto exacto.
        descartadas:
          - opcion: Delegar la semántica a cada adapter.
            razon: Contradice la decisión 84.
          - opcion: Aceptar challenges reutilizables o desligados de operación, binding o incarnation.
            razon: Habilita replay o cruce de autoridad.
          - opcion: Promover self-report o desconexión a estado probado.
            razon: Fabricaría autoridad sin proof producer-owned.
          - opcion: No actuar.
            razon: Mantendría bloqueado el primer Módulo.
        contaminaba: [S4.11, M4.11.1, S4.12]
      - tipo: resuelta
        pregunta: ¿Cuándo se consume el challenge y qué resultado produce un error de stop?
        resolucion: Todo primer intento de llamada al productor consume terminalmente el challenge, sin importar si devuelve proof válida, error o proof mismatch. Cualquier retry exige un challenge nuevo y todo mismatch falla cerrado. Si la llamada de stop falla, el resultado exacto es solicitud no reconocida más runtime disconnected/unknown; jamás stopped ni dead.
        autoridad: maintainer, elección explícita transmitida por Main el 2026-08-28; decisión 93
        clase: seguridad-y-permisos; contrato-visible-del-producto
        falsificador: Un challenge sobrevive a cualquier llamada al productor; un retry reutiliza el challenge previo; un mismatch gana autoridad; o un error de stop se presenta como solicitud reconocida, runtime stopped o runtime dead.
        descartadas:
          - opcion: Retener el challenge ante error de llamada.
            razon: Reutilizaría autoridad a través de intentos.
          - opcion: Consumir sólo con proof coincidente.
            razon: Habilitaría múltiples intentos o adivinación.
          - opcion: No decidir.
            razon: Impediría especificar una semántica fail-closed.
        contaminaba: [S4.11, M4.11.1, S4.12]
      - tipo: resuelta
        pregunta: ¿Dónde pertenece la política de timeout y cómo clasifica el core neutral el silencio o una respuesta ausente?
        resolucion: La política de timeout pertenece a cada productor o adapter, nunca al core host-neutral. El core no agrega timers, sleeps, lecturas de wall clock, cancelación, deadlines ni Promise.race. Timeout o silencio llegan únicamente como rechazo del productor o respuesta null, undefined o ausente; observe devuelve evidencia no disponible, health devuelve disconnected/unknown, stop devuelve solicitud no reconocida más disconnected/unknown, y attach falla como productor no disponible sin acknowledgment. Una proof no nula extranjera o malformada sigue siendo mismatch, y un challenge consumido o rechazado no recupera autoridad en otra operación.
        autoridad: maintainer, decisión explícita transmitida por Main el 2026-08-28; decisión 94
        clase: contrato-visible-del-producto; api-publica; seguridad-y-permisos
        falsificador: El core usa tiempo o carreras para decidir; timeout o silencio produce estado probado o attach reconocido; null o undefined se clasifica como proof extranjera; proof no nula malformada se suaviza a indisponibilidad; o un challenge consumido o rechazado vuelve a autorizar otra operación.
        descartadas:
          - opcion: Imponer reloj o cancelación en el core.
            razon: Trasladaría política del productor a la frontera neutral y volvería no determinista su contrato.
          - opcion: Tratar ausencia como mismatch.
            razon: Confundiría indisponibilidad con proof adversarial.
          - opcion: Permitir consumo por operación aislada.
            razon: Reabriría autoridad cross-operation.
        contaminaba: [S4.11, S4.12]
