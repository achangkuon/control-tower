  - id: S5.5
    zona: asientos
    resultado: Parking y retoma del loop
    depende_de: [S5.10]
    autoridad: maintainer rebase 2026-08-17, decision 78, and Engram observation 10295
    criterios:
      - Una decisión no derivable produce un registro inmutable con pregunta exacta, evidencia, opciones con consecuencia, origen, checkpoint y clase
      - Un registro sin opciones, sin evidencia o sin checkpoint falla cerrado
      - La continuación sale del primary o de un alternatives de la propuesta vigente de Support; nada que la propuesta no nombre continúa
      - Una propuesta vencida, de otro plan, de otro ledger, de otro claim o de un caller_role distinto de MAIN falla cerrado
      - Ninguna línea de producción lee adentro de primary, alternatives o conflicts; cualquier comparación o ramificación sobre su contenido falsifica el contrato
      - Con state NO_SCOPE, Main estaciona y reporta sin inventar trabajo ni derivar un candidato propio
      - La continuación la ejerce Main; el worker no se autoasigna
      - Sólo una respuesta terminal validada por Main permite retomar desde el checkpoint exacto
      - Un checkpoint rancio exige reconciliación y no retoma solo
      - Una respuesta no validada, vencida o de origen equivocado no levanta nada ni muta el registro
      - S5.5 no crea, registra, valida ni consume contratos o autoridad, y no duplica la respuesta de S5.8 ni la emisión o el ruteo de S5.4
      - "rg 'Depende de|Área|Recurso' escalation/ devuelve cero: la Torre no nombra un campo del formato de planes"
      - Verificar la propuesta es read-only, comprobado por testigos de bytes en éxito y en rechazo
      - bun test test/escalation pasa completo y bun test no introduce fallos nuevos
      - El diff no toca continuation, core.mjs, mcp.mjs, delivery, contracts, schemas ni main-store/store.mjs
    decisiones:
      - tipo: derivable
        pregunta: ¿Qué puede continuar?
        criterio: El primary de la propuesta vigente de Support, o uno de sus alternatives; la Torre no recalcula elegibilidad ni abre el plan.
        autoridad: decisión 78 y support-proposal-v1
        evidencia: Support ya declara primary, alternatives, conflicts y state bajo el contrato vigente.
        checkpoint: antes de M5.5.2
        opciones:
          - opcion: Consumir sólo trabajo nombrado por Support.
            consecuencia: La Torre verifica la propuesta sin asumir la planificación.
        falsificador: Una continuación que la propuesta de Support no nombre.
        descartadas:
          - opcion: Recalcular elegibilidad desde el plan.
            razon: Contradice la decisión 78 y duplicaría responsabilidad de Support.
        contaminaba: [S5.5]
      - tipo: derivable
        pregunta: ¿Qué hace la Torre con la propuesta?
        criterio: Verifica plan_enumeration_digest, ledger_digest, worker_claim, expires_at y caller_role, y nada más.
        autoridad: test de contenido de openspec/plans/frontera-torre-gentle-ai.md
        evidencia: La frontera vigente limita la Torre a verificar identidad, frescura, claim y rol de la propuesta.
        checkpoint: antes de M5.5.2
        opciones:
          - opcion: Verificar sólo los cinco campos de frontera.
            consecuencia: La Torre no ramifica sobre primary, alternatives o conflicts.
        falsificador: Cualquier ramificación sobre el contenido de primary, alternatives o conflicts.
        descartadas:
          - opcion: Abrir la propuesta para recalcular su contenido.
            razon: Convertiría a la Torre en planner.
        contaminaba: [S5.5]
      - tipo: derivable
        pregunta: ¿Qué se retoma?
        criterio: El checkpoint durable exacto y el mismo worktree asignado; base divergente exige reconciliación.
        autoridad: contrato vigente de S5.5
        evidencia: El parking conserva el checkpoint y la asignación exactos para evitar retomar trabajo distinto o stale.
        checkpoint: antes de M5.5.4
        opciones:
          - opcion: Retomar el checkpoint exacto en el mismo worktree.
            consecuencia: Una respuesta válida sólo levanta el trabajo que estacionó.
        falsificador: Retomar otro checkpoint o worktree.
        descartadas:
          - opcion: Recalcular el checkpoint al responder.
            razon: Podría levantar trabajo distinto del estacionado.
        contaminaba: [S5.5]
      - tipo: resuelta
        pregunta: ¿Qué ocurre con trabajo contradicho?
        resolucion: Se preserva y escala; nunca se descarta o rescata automáticamente.
        autoridad: contrato vigente de S5.5
        evidencia: Una base o evidencia contradictoria invalida la retoma automática y exige reconciliación.
        checkpoint: antes de retomar trabajo contradicho
        opciones:
          - opcion: Preservar y escalar.
            consecuencia: El trabajo queda recuperable sin mutarlo bajo evidencia contradictoria.
        falsificador: Descartar, rebasar o rescatar automáticamente trabajo contradicho.
        clase: dependencias-o-evidencia-contradictorias
        descartadas:
          - opcion: Descartar o rescatar automáticamente.
