          - opcion: Retirar o modificar cualquier otro campo o piso.
            consecuencia: La implementación excede la autoridad S5.13 y debe detenerse.
        criterio: Las tablas de nivel campo de la clasificación S5.13 y la enmienda opaca de la decisión 72 coinciden fila por fila; cualquier campo que sobreviva o caiga sin esa autoridad, o cualquier ramificación por contenido, falsifica la derivación.
