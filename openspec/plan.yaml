  - id: S123
    prioridad: torre-v3
    zona: metodo
    resultado: "Al cerrar una Sesión, si una Zona quedó con menos de 2 Sesiones LISTO, Main le pide a Support que prepare el horizonte sin preguntar y después le presenta el resultado al humano."
    autoridad: "Decisiones explícitas de Emilio del 2026-09-13 en la conversación de diseño del horizonte (Claude Code, sesión ed42515b): el horizonte se activa cuando una Zona queda con menos de 2 LISTO y nunca prepara más de 2; la detección es determinista, Support prepara, el humano decide y Main registra como único escritor del plan; Main despacha a Support directo, sin avisar antes. Support ya es un ayudante read-only que nunca despacha ni escribe el plan (agent-workflows/skills/chanks-0-agente-soporte/SKILL.md:12,22,24)."
    depende_de:
      - S122
    cimientos:
      []
    recurso:
      []
    archivos:
      - agent-workflows/skills/chanks-7-session-doc/SKILL.md
      - agent-workflows/skills/chanks-0-agente-soporte/SKILL.md
      - agent-workflows/templates/session-routing.md
    encargo:
      pedido_contexto: "Al cerrar una Sesión, si una Zona quedó con menos de 2 Sesiones LISTO, Main le pide a Support que prepare el horizonte sin preguntar y después le presenta el resultado al humano."
      resultado_comportamiento: "La evidencia de cierre de chanks-7-session-doc incluye el déficit de horizonte por Zona que informa Radar, o declara explícitamente que no hay déficit.\n\nchanks-0-agente-soporte acepta un pedido de horizonte: para falta-decision arma la decisión con chanks-1-cierre-de-decisiones, para falta-planificar deriva la propuesta a chanks-2-planificador-granular y para espera-atascada trabaja sobre la raíz.\n\nUn pedido de horizonte nunca prepara más de 2 Sesiones LISTO por Zona, y espera natural o DIFERIDO nunca lo generan.\n\nLa plantilla de ruteo de Main declara que ante un déficit Main pide la preparación a Support directamente, presenta el resultado al humano y registra sólo lo que el humano confirma.\n\nNinguna superficie modificada da a Support autoridad para activarse solo, despachar, asignar o escribir openspec/plan.yaml.\n\nUna prueba automatizada del Método falla si cualquiera de las tres superficies pierde su regla."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: Decisiones explícitas de Emilio del 2026-09-13 en la conversación de diseño del horizonte (Claude Code, sesión ed42515b): el horizonte se activa cuando una Zona queda con menos de 2 LISTO y nunca prepara más de 2; la detección es determinista, Support prepara, el humano decide y Main registra como único escritor del plan; Main despacha a Support directo, sin avisar antes. Support ya es un ayudante read-only que nunca despacha ni escribe el plan (agent-workflows/skills/chanks-0-agente-soporte/SKILL.md:12,22,24). Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S123. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Quién ejecuta el horizonte: Support, Main o un agente de worktree dedicado?"
        resolucion: "La detección es determinista y la hace Radar; Support prepara en su propio asiento; el humano decide; Main registra como único escritor. Un asiento de planificación sólo se usa cuando falta planificar muchas Sesiones, y también devuelve la propuesta a Main."
        autoridad: "Decisión de Emilio del 2026-09-13, elegida sobre las alternativas presentadas con su consecuencia."
        clase: seguridad-y-permisos
        falsificador: "Support se activa solo, escribe openspec/plan.yaml o despacha trabajo, o un agente dedicado al horizonte registra decisiones sin pasar por Main."
        descartadas:
          - opcion: Un agente de worktree dedicado al horizonte.
            razon: "Duplica a Support o se convierte en un segundo escritor del plan, y ocupa un asiento bajo el techo humano."
      - tipo: resuelta
        pregunta: "Cuando Radar marca un déficit, ¿Main pone a Support a preparar directamente o primero avisa al humano?"
        resolucion: "Directamente. Preparar sólo lee y propone, y la decisión igual pasa por el humano cuando Main presenta el resultado."
        autoridad: Decisión de Emilio del 2026-09-13.
        clase: contrato-visible
        falsificador: "Main pregunta antes de preparar, o registra una preparación sin que el humano la haya confirmado."
        descartadas:
          - opcion: Avisar al humano antes de preparar.
            razon: Suma una interrupción por cada déficit antes de la que ya ocurre al decidir.
