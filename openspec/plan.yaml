  - id: S114
    prioridad: torre-v3
    zona: autoridad
    resultado: "Todas las Sesiones vigentes declaran el tipo de su autoridad, migradas Zona por Zona para que ningún lote de revisión supere el tope declarado."
    autoridad: "Decisión del maintainer del 2026-09-10 sobre la migración del campo autoridad, elegida entre tres alternativas: migrar por Zona y encender la exigencia al final. La población vigente y el orden se obtienen en ejecución mediante un snapshot `radar status --json` ligado a su revisión; ningún total fijo forma parte del alcance vivo."
    depende_de:
      - S112
      - S116
    cimientos:
      []
    recurso:
      - openspec/plan.yaml; la migración es el único trabajo que lo escribe mientras dura
    archivos:
      - openspec/plan.yaml
      - openspec/plans/decision-register.md
    encargo:
      pedido_contexto: "Todas las Sesiones vigentes declaran el tipo de su autoridad, migradas Zona por Zona para que ningún lote de revisión supere el tope declarado."
      resultado_comportamiento: "Cada lote de revisión migra exactamente una Zona y queda bajo el tope; M114.1 repite esos lotes serialmente.\n\nradar check pasa después de cada lote de revisión, no sólo al final: una migración parcial nunca deja el plan inválido.\n\nNinguna autoridad cambia de sentido al migrar: se declara el tipo de la cita que ya estaba escrita, nunca se inventa una nueva.\n\nAl cerrar, cero Sesiones conservan la forma vieja sin tipo declarado.\n\nQueda una sola copia del registro de decisiones en el árbol: openspec/plans/decision-register.md se retira y openspec/archive/legacy-planning/decision-register.md queda como la citable.\n\nEl diff toca sólo Área."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: Decisión del maintainer del 2026-09-10 sobre la migración del campo autoridad, elegida entre tres alternativas: migrar por Zona y encender la exigencia al final. La población vigente y el orden se obtienen en ejecución mediante un snapshot `radar status --json` ligado a su revisión; ningún total fijo forma parte del alcance vivo. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S114. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Puede el esquema entregado por S112 representar las autoridades reales del plan?
        resolucion: "No. El snapshot histórico fechado del 2026-09-10 probó que varias autoridades citaban más de una clase de fuente y que una cita única perdía información. Las cantidades observadas ese día quedan como evidencia datada y no como total vigente. Extender el campo a una lista de citas es trabajo de la Zona metodo y nació como Sesión propia, S116, porque el alcance descubierto nunca se agrega en silencio a una Sesión ya entregada."
        autoridad: "Descubrimiento histórico de esta Sesión sobre el snapshot fechado del 2026-09-10, medido contra el esquema entregado en f138e1b."
        clase: contrato-visible
        falsificador: "Se migra una autoridad multi-fuente aplastándola a una sola cita, o se extiende el esquema dentro de S112 en vez de en una Sesión nueva."
        descartadas:
          - opcion: Elegir una autoridad primaria por Sesión y descartar el resto.
            razon: "Pierde información que hoy está escrita, y la Sesión dejaría de poder probar las fuentes que realmente la sostienen."
      - tipo: resuelta
        pregunta: ¿Qué fidelidad conserva la migración cuando la autoridad es prosa que nombra decenas de fuentes?
        resolucion: "La prosa desordenada es un problema de la migración, no algo que la herramienta deba modelar. El esquema no gana ni un campo de contexto para prosa sin migrar ni tipos nuevos: la migración produce citas tipadas y el que no pueda tiparse no pertenece al campo. Lo único que el esquema sí gana es la lista, porque una Sesión que de verdad se apoya en dos decisiones no es prosa desordenada: es dato real que una cita única no puede representar."
        autoridad: "Decisión del maintainer del 2026-09-10, respaldada por el canon §18 en agent-workflows/skills/_shared/plan-naming-convention.md:548: «Extend the tool to accept the legacy shape — The schema is the contract. Data the schema rejects belongs in the archive, not in a compatibility branch». El campo de contexto propuesto era exactamente esa compatibility branch."
        clase: migracion-o-perdida-de-datos
        falsificador: "El esquema gana un campo de texto libre para prosa sin migrar, o un tipo nuevo cuya única razón de existir es aceptar una cita que quedó mal escrita."
        descartadas:
          - opcion: Conservar el resto de la prosa en un campo de contexto no verificable.
            razon: "Es la compatibility branch que el canon §18 prohíbe: el esquema dejaría de ser el contrato para volverse un recipiente de lo que no se migró."
          - opcion: "Ampliar el conjunto de tipos para cubrir REQUIREMENTS, artifacts y decisiones de conversación."
            razon: "Verificado sobre el árbol: cuatro de las cinco autoridades que parecían intipables sí lo son. REQUIREMENTS existe como archivo en openspec/specs/, el SHA suelto resuelve a un commit, y sólo el artifact vive fuera de Git, que ya es la forma de engram. No hacen falta tipos nuevos: hace falta migrarlas bien."
          - opcion: Migrar sólo las citas que ya resuelven y declarar el resto como no verificable.
            razon: "Marcaría como no probables autoridades que sí son archivos del repositorio, sólo porque estaban escritas dentro de un párrafo largo."
      - tipo: derivable
        pregunta: ¿En qué orden se migran las Zonas?
        criterio: "Por cantidad de Sesiones, de menor a mayor, para que el primer lote sea el más barato de revisar y cualquier error del contrato aparezca temprano."
        autoridad: "Decisión del maintainer del 2026-09-10 sobre la estrategia de migración, y el tope de lote declarado en el bloque manual de política del 2026-09-03."
        evidencia: "radar status calcula las Sesiones por Zona, así que el orden es derivable del propio dato."
        checkpoint: antes del primer Módulo.
        opciones:
          - opcion: Ordenar las Zonas por cantidad de Sesiones ascendente.
            consecuencia: "El contrato se prueba primero sobre el lote más barato; si la forma está mal, se corrige antes de tocar las Zonas grandes."
