  - id: S148
    zona: cimientos
    prioridad: torre-v2
    resultado: Raíz de Ejecución estable en SQLite con revisión, estado e historial ligados a handoffs existentes
    autoridad: "Emilio aprobó persistencia, preservación y compatibilidad (Engram 11310), su registro y posteriormente entregas secuenciales sólo después de S147 entregada (11316). Autoriza publicar esta documentación, no iniciar implementación, conceder excepción de tamaño, migrar la base real, instalar, activar ni declarar entregada S148. Conserva 11293, arquitectura y prioridades aprobadas."
    depende_de: [S147]
    cimientos:
      - core.mjs
      - test/migration.test.mjs
    recurso: []
    archivos:
      - core.mjs
      - test/migration.test.mjs
    encargo:
      pedido_contexto: >-
        Incorporar una raíz de Ejecución duradera en tower.db, separada de Sesión, Jornada y proceso
        host, reutilizando ct_handoff como sistema de intentos. Implementar la base de persistencia
        y preparación de borradores aprobada, no un segundo motor ni un ciclo operativo completo.
        S147 aporta los contratos V1: aprobar su propuesta no satisface su dependencia de entrega.
        El payload anterior exige datos source_merge y proyecciones que un paquete nativo no tiene
        necesariamente; no inventarlos ni aceptar dos documentos independientes como autoridad del
        mismo trabajo. La ampliación del formato existente forma parte explícita de S148.
      resultado_comportamiento: >-
        Sobre la base de código que conoce schema 5, añadir la migración 006 sin editar las
        migraciones 001–005 ni sus checksums. No es DDL exclusivamente aditivo: ct_handoff debe
        distinguir el formato anterior del sealed-packet V1, conservar las exigencias anteriores
        para sus filas y permitir ausencia de proyecciones específicas del legado en filas nativas,
        sin falsos SHA/URL de entrega o unidades de trabajo. El payload nativo es el paquete S147
        real, único; los metadatos comunes se derivan de identidades y contexto reales del Core.
        packet_digest y los digest/fingerprint propios del handoff conservan sus dominios distintos.

        Crear ct_execution_root (identidad estable, contexto, revisión, fase/estado separados y
        paquete vigente), ct_execution_history (sucesos append-only con revisiones y contextos) y
        ct_execution_handoff (asociación explícita al handoff real). Registrar por separado
        packet_id/revisión/intento lógico y lineage/revisión/generación nativos: no igualar el
        intento a la generación de lease ni deducir la Ejecución de un lineage, Sesión o proceso.
        Una identidad de paquete/revisión no puede reutilizarse con contenido o intento distintos.
        Reutilizar ct_idempotency del Core para clave/ámbito de operación, digest de solicitud/CAS
        y respuesta: repetición idéntica no duplica filas; identidad reutilizada con otro contenido
        se rechaza. Las relaciones se comprueban en Core y sus restricciones/guards: una declaración
        FK sin enforcement no basta, ni se habilita un PRAGMA global por suposición.

        Delimitar operaciones internas createExecutionRoot, registerManagedPacket,
        retirePreparedPacket y readExecutionRoot, sin agregar transporte o entrada de despacho.
        Sólo Core crea la raíz, registra borradores, retira borradores no despachados y lee estado
        e historial. Fase y estado se persisten separados con las etiquetas semánticas de la
        arquitectura; inicialmente ADMISSION y OPEN significan preparado para admisión posterior,
        no trabajo autorizado. No hay setter libre de fase/estado ni COMPLETED declarado por el
        agente. Los avances de negocio requieren trabajo posterior del Core, no autoridad de adapters.

        Separar el CAS previo n del contexto esperado posterior n+1 del paquete registrado.
        Core deriva/valida la instantánea y su huella de revisión; al confirmar, el contexto del
        paquete coincide con la raíz n+1. El ID estable no congela la huella inicial para siempre
        ni permite ciclos de autohuella. Raíz, hijo, asociación, historial y respuesta idempotente
        se actualizan atómicamente; una revisión vieja no deja escrituras parciales. Retirar un
        borrador conserva su prueba terminal real antes de que el siguiente paquete la cite;
        nunca anticipa un comprobante todavía no emitido ni opera sobre trabajo iniciado.

        Las rutas anteriores mantienen su comportamiento para los registros anteriores pero
        rechazan operar sobre los nuevos gestionados cuando eludirían la raíz, su CAS o historial.
        Cubrir también revisiones, recovery y operaciones globales que crucen esos datos; no
        confundir compatibilidad del legado con permiso para pasar paquetes nuevos por su validador.
        Los nuevos intentos permanecen sin despacho hasta completar admisión y controles posteriores.

        La migración preserva exactamente los valores previos de identidad, payload_json, huellas,
        metadatos de productor, revisiones, generaciones, estados e historial, sin reserializar
        contenidos ni asociar filas previas automáticamente. Sólo clasifica un formato previo
        cuando lo comprueba; datos desconocidos o inconsistentes abortan sin cambios parciales.
        Conservar el límite existente de 65536 bytes por payload: rechazar excesos, no truncar
        ni ampliar la cuota automáticamente. El rollback después de nueva historia es reparación
        que la preserve, no DROP de tablas nuevas ni restauración que la borre silenciosamente.

        Pruebas futuras en bases aisladas con historia no vacía deben demostrar migración y
        solicitudes repetibles, preservación de valores/bytes y checksums anteriores, formato nuevo
        sin campos ficticios, fallos tardíos/ocupación sin esquema o filas parciales, conflicto CAS,
        contexto correcto tras registrar, vínculos explícitos entre intentos, identidad estable a
        través de borradores sucesivos, historial inmutable y rechazo de atajos por rutas anteriores.
        Mantener regresiones del formato previo. No hay prueba de ciclo operativo completo ni
        preservación de una base viva por haber leído el código o pasado fixtures.
      restricciones_decisiones: >-
        La propuesta de estructura, compatibilidad y forma de entrega secuencial está aprobada;
        la implementación no. Previsión inicial de 1200–1800 líneas autorales añadidas más eliminadas
        para migración, adaptación del formato, persistencia, guards y pruebas; no reutilizar el
        forecast menor de un almacén parcial. Antes de RED, Gentle AI debe afinarla y producir el
        desglose técnico de entregas independientes, verificables y reversibles, con pruebas y
        preservación de historia propias. No hay cortes concretos, cantidad de entregas ni excepción
        de tamaño preaprobados. Las 400 líneas son referencia, no límite duro: una unidad que la
        supere requiere consultar antes de implementarla, sin recortar pruebas ni fragmentar
        artificialmente. Gentle AI posee el desglose, implementación y verificación mediante ODD;
        SDD sólo por solicitud humana explícita, sin Módulos/Tareas Chanks nuevos.

        El inicio requiere selección humana, admisión Radar fresca y dependencia S147 entregada.
        La versión 5 es evidencia del código base, no de la base real: no se inspeccionó ni se
        autoriza mutar esa base. Cualquier conversión real exige inventario, respaldo, exclusividad
        y aprobación separados; no restaurar una copia antigua sobre historia posterior. Mantener
        la Torre apagada. No importar main-store JSON, inferir asociaciones históricas ni sustituir
        autoridad humana, Radar, Git o Gentle AI con datos de forma válida.

        No incluye transporte/API IPC, despacho operativo, máquina completa de admisión/avance,
        outbox/proyección JSON, adapters, RDD, entrega, cierre o activación. Tampoco habilita
        automáticamente los seis consumidores pendientes. Cualquier archivo adicional requiere
        aprobación y compatibilidad fresca antes de escribir; los dos Cimientos requieren evidencia
        exclusiva o serial para su mutación. No hay recurso adquirido. Los ensayos descritos siguen
        pendientes y no son un PASS. Revalidar el baseline antes de implementar; una contradicción
        de esquema, contrato o alcance no autoriza reescribir historia o ampliar superficies.
      referencias: >-
        Autoridad inicial Engram 11293; descubrimiento 11308, propuesta 11309 y aprobación humana
        11310, seguidas por autorización de registro y decisión 11316 de entregas secuenciales,
        S147 antes de S148 y publicación documental. Este Encargo explicita el alcance;
        Engram conserva la procedencia de las decisiones, no un diseño imprescindible fuera del plan.
        docs/architecture/torre-motor-determinista.md, secciones 3, 7, 8, 12, 15 y 17,
        SHA-256 cc9949d367e93a1b809534335248cbd9916d7acf99ed6d9f188dff63b7b04f62.
        Base de investigación HEAD 1658444ff52cddba3516f7e4e39bd314ccd21cdc:
        core.mjs:86–112,231–318,855–1058,2442–2591; test/migration.test.mjs:1679–1740.
        test/recovery.test.mjs:86–95 es lectura de regresión que provisiona explícitamente schema 5,
        no permiso de editar ese archivo. Reutilizar los validadores entregados de S147 sin ampliar
        su huella. Se conservan Torre V1 detrás del Método, S148→S147 y los dos Cimientos exactos.
        Son dos bases iniciales, no cobertura completa de API/IPC, admisión de efectos, proyección
        o cierre; no se inventan ahora otras Sesiones, dependencias o prioridades.
    decisiones:
      - tipo: resuelta
        clase: migracion-o-perdida-de-datos
        alcanza: encargo
        pregunta: "¿Qué estrategia concreta de introducción de la raíz conserva los handoffs y datos previos, y qué interfaces y archivos se aprueban para implementarla en pruebas aisladas?"
        evidencia: "SQLite y la reutilización de ct_handoff ya están decididos; el enlace de datos previos, tablas, compatibilidad y huella final no. No se inspeccionó ni se autoriza mutar la base viva."
        contaminaba: [S148]
        checkpoint: "Antes de RED o cualquier cambio de esquema; presentar estrategia, compatibilidad y huella concreta para aprobación."
        opciones:
          - opcion: Aprobar una estrategia concreta que demuestre preservación en fixtures aisladas.
            consecuencia: Permite completar el Encargo; una instalación o migración real sigue necesitando su propia autorización.
          - opcion: Mantener la preparación incompleta hasta resolver preservación e interfaces.
            consecuencia: No se implementa persistencia ni se habilitan consumidores o conversiones por inferencia.
        resolucion: >-
