        evidencia: Contrato inmutable de S3.1 líneas 52-57.
        checkpoint: antes de T3.1.1.1
        opciones:
          - opcion: Rechazar -C, relativos que escapan y absolutos distintos.
            consecuencia: Ningún input hostil llega a Git ni produce una captura.
      - tipo: derivable
