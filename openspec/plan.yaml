      - tipo: resuelta
        pregunta: ¿Puede una excepción acotada relajar un floor de seguridad?
        resolucion: No; ninguno de los cinco floors puede relajarse por configuración ni excepción.
        autoridad: decisión del maintainer del 2026-08-04 registrada en master-index
        falsificador: Cualquier ruta en la que una excepción registrada habilite una operación que el floor prohíbe.
        descartadas:
