  - id: S8.13
    prioridad: torre-v1
    zona: instalacion
    resultado: "Instalador, preflight, activación y rollback del bundle Torre V1 ejercitados sólo en un HOME/runtime aislado"
    autoridad: "Contrato propietario de la Sesión y autoridades aprobadas del lifecycle versionado; decisiones 88, 100 y 102; Engram 9921, 9956 rev2 y 9963; alcance interpretativo supersedido por Engram 10782, que registra la aprobación posterior del maintainer para la frontera producto/Torre. Alcance V1 aprobado por Emilio el 2026-09-18 (Engram 11327): el instalador deja de depender de S1.19 y S4.12, que pasan a torre-v2. Consecuencia declarada y aceptada: la instalación V1 se ejercita en su HOME/runtime aislado con sus propias pruebas y NO queda respaldada por la regresión integral Pi-first ni por la recuperación mínima de Pi; ese respaldo llega en torre-v2."
    depende_de:
      - S8.12
    recurso:
      - puntero activo y destino de extensión Pi aislados
      - backups y rollback del bundle Tower aislado
      - preflight de host externo aislado; prohibidos globals reales
    cimientos:
      - bin/torre
      - install/runtime-payload.mjs
      - test/install/launch-worker-cli.test.mjs
    archivos:
      - install/lifecycle.mjs
      - install/active-pointer.mjs
      - install/runtime-payload.mjs
      - bin/torre
      - test/install/lifecycle.test.mjs
      - test/install/entrypoint-resolution.test.mjs
      - test/install/runtime-payload.test.mjs
      - test/install/launch-worker-cli.test.mjs
    encargo:
      pedido_contexto: "Instalador, preflight, activación y rollback del bundle Torre V1 ejercitados sólo en un HOME/runtime aislado. El bundle instalado es el de S8.12: semáforo, contrato host-neutral, adapter Pi, perfiles y skills Torre. El instalador no instala, activa ni diagnostica handoffs, continuation ni despacho Tower-owned, que pertenecen a torre-v2."
      resultado_comportamiento: "torre-control --update selecciona el lifecycle atómico versionado; no ejecuta el camino legado divergente.\n\nEl shim symlink se reemplaza atómicamente; ningún cp sigue su target owner-read-only.\n\nEl diagnóstico prueba revisión activa y coherencia exacta entre plugin, MCP y runtime/engine; una mezcla falla cerrado.\n\nNingún chequeo de sólo existencia/ejecutabilidad/key puede devolver un falso positivo saludable.\n\nInstalación limpia en el HOME/runtime aislado activa el bundle completo y una capacidad ausente, rota o ambigua, un fallo de carga o cualquier preflight incompatible falla con error local tipado antes de mutar, sin route genérico ni global real.\n\nRollback restaura runtime, interceptor, perfiles y skills Tower juntos dentro del destino aislado; no escribe configuración/skills externas, globals reales ni toca fuera de Área.\n\nLa extensión Pi del destino aislado se carga realmente y el fingerprint cerrado prueba factory de un argumento, pi.on(\"input\"), campos y source requeridos de InputEvent, continue|transform|handled, notificación local, enrolamiento, bytes/provenance de torre-control e inventario/orden revisados de transforms antes de quedar activa en la prueba; un mismatch deja cero activación parcial y ninguna versión acepta o rechaza por sí sola.\n\nEl diff toca sólo Área; no modifica Pi core, pi-intercom, skills genéricas, worktrees, evidencia estacionada ni globals reales."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: Contrato propietario de la Sesión y autoridades aprobadas del lifecycle versionado; decisiones 88, 100 y 102; Engram 9921, 9956 rev2 y 9963; alcance interpretativo supersedido por Engram 10782, que registra la aprobación posterior del maintainer para la frontera producto/Torre. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S8.13. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto. Contraste aprobado Engram 11293 con docs/architecture/torre-motor-determinista.md, secciones 14 y 17: se conserva la instalación aislada; la futura unidad engine/contratos/harness deberá demostrar compatibilidad y rollback con evidencia. No se aprueba aquí formato, conversión de datos, activación ni nuevo miembro del payload."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Qué instala Tower en el destino aislado y qué recuperación parcial se admite?
        resolucion: "Tower instala sólo el bundle Tower-owned en el HOME/runtime aislado, valida compatibilidad y rechaza upgrade --shim como recuperación parcial."
        autoridad: "Decisiones 88, 100 y 102."
        clase: operaciones-irreversibles; seguridad-y-permisos; contrato-visible-del-producto
        falsificador: La instalación incluye bytes ajenos al bundle Tower-owned o acepta upgrade --shim como recuperación parcial.
        descartadas:
          - opcion: Recuperar parcialmente con upgrade --shim.
            razon: Mantendría una instalación incoherente.
        contaminaba:
          - S8.13
          - S7.1
      - tipo: resuelta
        pregunta: ¿Qué preflight permite activar la instalación aislada?
        resolucion: "La instalación aislada habilita el interceptor sólo si enrolamiento, carga real de extensión, fingerprint cerrado Pi, bytes/provenance de torre-control e inventario/orden de transforms pasan; fallo o ambigüedad bloquea antes de mutar y rollback restaura la unidad coherente."
        autoridad: Engram 9921 y 9963.
        clase: contrato-visible-del-producto; operaciones-irreversibles; seguridad-y-permisos
        falsificador: "Una capacidad ausente, rota o ambigua, un fallo de carga o una decisión basada sólo en versión activa total o parcialmente la instalación."
        descartadas:
          - opcion: Aceptar compatibilidad sólo por versión o existencia.
            razon: No prueba conducta ni coherencia del runtime instalado.
          - opcion: Activar parcialmente y reparar después.
            razon: Viola atomicidad y deja un estado global incoherente.
        contaminaba:
          - S8.13
          - S7.1
      - tipo: derivable
        pregunta: "¿Cómo se ordenan internamente probe, preflight, activación y diagnóstico?"
        evidencia: El contrato vigente exige validar conducta antes de la primera mutación y preservar el estado previo ante fallo.
        checkpoint: S8.13 RED.
        opciones:
          - opcion: Ejecutar toda carga y validación conductual antes de la primera mutación.
            consecuencia: "Cualquier fallo deja el estado previo byte-idéntico; activación parcial, diagnóstico existence-only o decisión sólo por versión falsifican la derivación."
        criterio: Toda carga y validación conductual ocurre antes de la primera mutación y cualquier fallo deja el estado previo byte-idéntico.
        autoridad: "Decisiones 88, 100 y 102; Engram 9921, 9956 rev2 y 9963."
      - tipo: resuelta
        pregunta: ¿Dónde se ejercita el instalador antes de V1 y quién puede autorizar globals reales?
        resolucion: "Secuencia futura obligatoria: prueba aislada de instalador, preflight, activación y rollback contra product/tower/ -> publicación de una release V1 probada -> autorización humana explícita posterior -> distribución global real. Una V1 meramente probada no basta; esta gate no autoriza publicar ni distribuir ahora, y ningún commit de Sesión concede distribución."
        autoridad: "Engram 10782: aprobación posterior del maintainer de la frontera producto/Torre y de esta secuencia; interpreta el alcance sin reatribuir las decisiones históricas 88, 100 y 102."
        clase: operaciones-irreversibles; seguridad-y-permisos; contrato-visible-del-producto
        falsificador: "Una prueba escribe o activa un global real, una distribución ocurre sin prueba aislada, release V1 publicada y probada, y autorización humana posterior en ese orden, o un commit de Sesión se toma como autorización."
        descartadas:
          - opcion: Ejercitar o activar directamente globals reales.
            razon: Mezcla prueba con distribución y omite la autorización humana explícita posterior.
          - opcion: Tratar un commit de Sesión como autorización de distribución.
            razon: La entrega de código no es autoridad para activar ni distribuir.
        contaminaba:
