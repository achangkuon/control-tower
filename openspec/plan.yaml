  - id: S131
    zona: metodo
    prioridad: metodo-v1
    resultado: "El despacho manual con Herdr reutiliza el pool de workers que declara el repositorio: conserva worktree, tab y dependencias entre Sesiones, y renueva sólo la rama de asignación y el agente."
    autoridad: "Aprobación de Emilio del 2026-09-14 sobre preparación genérica desde AGENTS.md, reemplazada y ampliada por su decisión explícita del 2026-09-15: estabilizar primero la fricción de agentes con S132 + S131 y mantener Main más cuatro workers permanentes, recreando agentes y ramas pero no worktrees ni dependencias. #139 documenta que el contrato entregado por S126 y la versión anterior de S131 destruían ese pool. Esta Sesión supersede sólo el lifecycle efímero de despacho/retiro de S126; conserva su lista humana, gates de Radar, aislamiento por Sesión, integración serial y prohibición de Torre."
    depende_de: [S126]
    cimientos: []
    recurso: ["directorio persistente de sincronización bajo el Git common-dir con ownership HELD efímero protegido por flock y uso exclusivo de los workers declarados durante despacho o retiro"]
    criterios:
      - "`chanks-3-despacho-herdr` lee de `AGENTS.md` la declaración del pool reutilizable, sus roles y cuándo preparar o refrescar cada worker; no fija Bun, npm, cantidad ni nombres para otros proyectos."
      - "Si el repositorio no declara un pool reutilizable completo, la skill falla cerrado antes de crear ramas o agentes; nunca crea un worktree efímero por Sesión ni adivina una topología."
      - "Antes de leer disponibilidad, asignar o retirar, el padre toma un `flock` exclusivo no bloqueante sobre el único directorio persistente de sincronización bajo `git rev-parse --git-common-dir`, valida path+inode y publica ownership `HELD` efímero con readback exacto; un owner vivo o ambiguo nunca se recupera, y un estado interrumpido sólo se reemplaza con autorización fresca del mantenedor ligada a la evidencia exacta y con el pool quiescente."
      - "Con el lock adquirido, el padre valida y reserva el lote humano completo antes de lanzar el primer agente: todas las Sesiones siguen LISTO, son compatibles y tienen un worker apto. Si una falla, libera sólo el lock propio y lanza cero agentes; el orden de la lista nunca produce un despacho parcial."
      - "El mapeo reservado asigna cada Sesión a un worker declarado que prueba estar libre, limpio y fuera del checkout Main; `issue-resolver` sólo recibe una Sesión respaldada por un issue de Control Tower elegido por el humano."
      - "El worktree y la tab identifican al worker y permanecen entre asignaciones; cada Sesión activa conserva una tab propia, una rama nueva `work/<id>` desde el master verificado y un agente nuevo con el nombre de la Sesión. Una rama ya existente o un readback ambiguo detiene el lote sin reset ni force."
      - "La disponibilidad se prueba bajo el `flock` desde Git, Radar y el readback vivo de Herdr: no hay árbol sucio, agente anterior activo, entrega pendiente ni identidad divergente. El ownership vuelve atómicamente a `RELEASED` y el `flock` se libera sólo después del readback de todos los agentes lanzados o de un rollback comprobado; no existe roster ni estado de planificación paralelo."
      - "La preparación declarada corre sólo al provisionar el worker o cuando falta su entorno o la evidencia declarada quedó stale; una reasignación con entorno válido ejecuta cero reinstalaciones y nunca copia ni enlaza dependencias desde otro checkout."
      - "Si preparación o lanzamiento falla, se cierran sólo los agentes abiertos por ese lote y se devuelven sólo sus ramas nuevas a un estado limpio comprobado; worktrees, tabs y dependencias permanecen. Un rollback ambiguo conserva el lock y pide decisión humana."
      - "El modo retiro adquiere el mismo lock, conserva los seis chequeos seguros aplicables de S126, cierra sólo el agente terminado, mantiene tab, worktree y dependencias, deja el worker detached en el master integrado y libera el lock después de confirmar por readback que quedó libre; nunca ejecuta `git worktree remove` para un worker del pool."
      - "Un retiro o asignación fallidos no reciclan por inferencia, no borran ramas con force y no tocan otro worker. El padre sigue integrando una Sesión por vez y es el único que escribe `openspec/plan.yaml`."
      - "`agent-workflows/tests/test_despacho_herdr.py` falla si reaparece creación o borrado por Sesión, reinstalación incondicional, check-then-act sin lock, despacho parcial, selección no humana, reutilización ocupada o coupling con Torre; la suite del Método pasa y el diff toca sólo Área."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Qué parte de un worker se conserva entre Sesiones?"
        resolucion: "Se conservan su worktree, tab y dependencias válidas; para cada asignación se crean una rama `work/<id>` y un agente nuevos."
        autoridad: "Elección explícita de Emilio del 2026-09-15."
        clase: contrato-visible; expansion-de-alcance
        falsificador: "El despacho ordinario crea o retira el worktree por Sesión, cierra su tab estable, reinstala un entorno válido o reutiliza el agente anterior."
        descartadas:
          - opcion: "Un worktree nuevo por Sesión."
            razon: "Descarta la preparación válida y reprodujo la fricción sistémica de #139."
          - opcion: "Compartir un solo checkout entre varios agentes."
            razon: "Mezcla ramas y árboles de trabajo y elimina el aislamiento por Sesión."
      - tipo: resuelta
