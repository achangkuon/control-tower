  - id: S119
    prioridad: torre-v2
    zona: producto-torre
    resultado: "La Torre declara su propia skill de runtime de Herdr: activa sólo ante un pedido explícito de Herdr, y todo despacho, ON/OFF, topología y ciclo de vida de asiento sigue enrutando por `torre-control` → `torre asiento`."
    autoridad: "openspec/plans/audits/herdr-skill-ownership-audit.md y su patch, más decisiones del maintainer del 2026-09-11/13: la skill activa sólo por pedido explícito y delega lifecycle a `torre-control` → `torre asiento` → S108, sin roster S109 ni Herdr raw."
    depende_de:
      - S117
      - S108
    cimientos:
      - product/tower/skills/torre-control/SKILL.md
      - test/install/tower-role-assets.contract.mjs
    recurso:
      []
    archivos:
      - product/tower/skills/herdr/SKILL.md
      - product/tower/skills/torre-control/SKILL.md
      - test/install/tower-role-assets.contract.mjs
    encargo:
      pedido_contexto: "La Torre declara su propia skill de runtime de Herdr: activa sólo ante un pedido explícito de Herdr, y todo despacho, ON/OFF, topología y ciclo de vida de asiento sigue enrutando por `torre-control` → `torre asiento`."
      resultado_comportamiento: "`product/tower/skills/herdr/SKILL.md` activa sólo ante pedido explícito y enruta assignment/topología/lifecycle por `torre-control` → `torre asiento`; cierre consume sólo S108.\n\nLa skill nunca deriva trabajo activo, enumera witnesses S121, interpreta Radar, acepta roster S109 ni manipula recursos extranjeros/ambiguos.\n\nLa skill lleva las cuatro claves de frontmatter que exige `SKILL_FRONTMATTER_KEYS` (name, description, license, metadata) y las seis secciones que exige `SKILL_SECTIONS`.\n\nEl registro de assets declara la skill con markers que fijan las dos oraciones de propiedad de la Torre y las dos de aprobación humana del patch preservado, y la suite completa pasa.\n\nLa skill no documenta ninguna mecánica de la CLI de Herdr que `herdr --skill` ya emite. Falsificador: cualquier flag, timeout o código de error documentado en ambos archivos es un duplicado y falla este criterio.\n\n`radar check` reporta 0 huérfanos, 0 solapes y 0 reglas sin uso, y `owners()` resuelve `product/tower/skills/herdr/SKILL.md` sólo a producto-torre, sin Cimiento.\n\n`product/tower/skills/torre-control/SKILL.md` gana una referencia a la skill nueva y sus markers existentes siguen pasando sin cambios."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: openspec/plans/audits/herdr-skill-ownership-audit.md y su patch, más decisiones del maintainer del 2026-09-11/13: la skill activa sólo por pedido explícito y delega lifecycle a `torre-control` → `torre asiento` → S108, sin roster S109 ni Herdr raw. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S119. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: "¿En qué Zona vive esta Sesión, si la skill está en producto-torre y el manifest que la declara en instalacion?"
        resolucion: "En `producto-torre`. La Sesión vive donde vive el producto —es una skill de la Torre— y el manifest declarante se reserva como Cimiento de archivo exacto, que es el mecanismo que el plan ya usa para archivos compartidos."
        autoridad: "Decisión del maintainer del 2026-09-11, tomada sobre la escalada que la propuesta original del 2026-09-04 dejó abierta y que la separación constructor/Torre volvió inevitable: cuando se escribió, la skill y su manifest vivían en un solo territorio."
        clase: contrato-visible
        falsificador: "Una Sesión de la Zona instalacion escribe dentro de `product/tower/`, cruzando la frontera entre el constructor y la Torre."
        descartadas:
          - opcion: "Dejarla en `instalacion` como la escribió su autor."
            razon: "Hoy significaría que una Sesión de instalación escribe dentro de product/tower/, que es exactamente la frontera que la separación trazó."
          - opcion: "Partirla en dos Sesiones, una por Zona."
            razon: "Cada territorio quedaría limpio, pero el resultado deja de ser revisable de una sola vez: la primera entregaría una skill que nada declara todavía."
      - tipo: derivable
        pregunta: "¿Esta skill toma un nombre `chanks-<tramo>-<nombre>`?"
        resolucion: "No. Es una skill de maquinaria y vive al lado de `torre-control`."
        autoridad: agent-workflows/FLUJO-END-TO-END.md:164-168
        clase: interna
        checkpoint: antes de T119.1.2
        evidencia: "El flujo aprobado dice que la skill de runtime de Herdr «no reemplaza `torre asiento` ni se convierte en una skill nueva del método». El prefijo `chanks-` es la marca de las skills del método, que se instalan globalmente en los cuatro agentes; esta skill vive dentro del producto Torre y se empaqueta con él."
        criterio: "La skill toma un nombre `chanks-<tramo>-<nombre>`, o queda instalada en los directorios globales de skills de los agentes."
        opciones:
          - opcion: "Nombre de maquinaria, al lado de `torre-control` dentro de `product/tower/skills/`."
            consecuencia: La skill viaja con el producto Torre y no entra al método global; la frontera constructor/Torre se mantiene.
          - opcion: "Nombre `chanks-<tramo>-<nombre>` como skill del método."
            consecuencia: Contradice la oración del flujo aprobado y mete una skill del producto en el método global de los cuatro agentes.
  - id: S120
    prioridad: metodo-v1
    zona: metodo
    # Reemplazada por S135 el 2026-09-14 por decisión de Emilio: SDD nativo sólo para full-sdd.
    archivada: true
    archivo: reemplazada
    resultado: "Contrato verificable de integración: direct y design-tasks usan el implementador general de Gentle AI y una entrada de verificación semántica desde el plan; full-sdd conserva su recorrido nativo."
    autoridad: "Aprobación explícita de Emilio el 2026-09-12: «SI es correcto, esto es justo lo qeu necesitabamos. Lo apruebo, porfa hagamos la planficiacion para pasar a implementar». Alcance aprobado: reutilizar implementación general y controles de verificación SDD con antecedentes del plan, sin duplicar planificación ni activar globalmente antes de probar. Engram #10839, sdd/proportional-routes-approved-planning."
    depende_de: []
    cimientos: []
    recurso: []
    criterios:
      - "El contrato identifica una revisión inmutable del plan, la Sesión, su ruta aprobada, límites, decisiones, tareas y criterios binarios; no crea otra fuente editable de planificación."
      - "El diseño distingue capacidades reutilizables existentes de adaptaciones necesarias, con archivos y contratos observados; no presenta la entrada externa como una configuración ya soportada."
      - "Direct y design-tasks reciben antecedentes del plan mediante una entrada explícita; el contrato prohíbe fabricar documentos SDD, fingir fases completadas o evadir el dispatcher."
      - "La ruta media completa únicamente diseño técnico y tareas faltantes, sin cambiar objetivo, límites ni criterios aprobados."
      - "La verificación relaciona cada criterio con evidencia observable y conserva los controles aplicables de SDD; una suite verde con un criterio incumplido no puede producir aprobación."
      - "El diseño declara pruebas positivas y negativas para revisión del plan cambiada, criterios omitidos, evidencia faltante o contradictoria y resultado no verificable; ninguno habilita cierre aprobatorio."
      - "Full-sdd conserva implementación, verificación y cierre nativos; el diseño diferencia consolidación de especificaciones e historial SDD de actualizar el avance en plan.yaml."
      - "La matriz de viabilidad identifica por cada capacidad su soporte actual, adaptación requerida y prueba aislada pendiente; termina con una propuesta implementable sustentada o una incompatibilidad explícita, nunca con una afirmación de ejecución no realizada."
      - "El resultado enumera las superficies del método afectadas, dependencias externas, criterios de la prueba aislada y condiciones de activación posterior, sin modificar paquetes externos, instalar componentes ni cambiar instrucciones globales."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Direct y design-tasks reemplazan la verificación de cumplimiento por comprobaciones técnicas generales?"
        resolucion: "No. Reutilizan el implementador general existente y requieren una entrada desde el plan a los controles de verificación semántica; full-sdd mantiene el recorrido nativo."
        autoridad: "Aprobación explícita de Emilio el 2026-09-12; Engram #10839."
        clase: contrato-visible
        falsificador: "Una ruta puede aprobarse sólo porque sus comandos pasan, sin evidencia de cumplimiento de cada criterio aprobado."
        descartadas:
          - opcion: "Usar sólo el verificador general de comandos para direct y design-tasks."
            razon: "No conserva la comprobación de cumplimiento de producto que el maintainer aprobó."
          - opcion: "Forzar documentos SDD previos en las tres rutas."
            razon: "Reintroduce la preparación duplicada y el choque que motivaron el cambio."
    ruta:
      propuesta: full-sdd
      autoridad: "La nueva entrada de antecedentes y la reutilización de verificación definen un contrato compartido todavía no resuelto. Esta ruta se propone para diseñar S120, no obliga a usar full-sdd en las futuras Sesiones direct o design-tasks. No se inicia SDD al registrar el plan."
    modulos: []

  - id: S121
    prioridad: torre-v2
    zona: enrolamiento
    resultado: Binding Main-validado con Session ID canónico y procedencia durable de cada tab Tower-owned
    autoridad: "Enmienda de persistencia mecánica aprobada por Emilio, Engram 11293. La decisión del maintainer del 2026-09-13 conserva a Main como única autoridad assignment_ref↔session_id y exige readback S107 para procedencia; el core es escritor del estado operativo y main-store JSON será proyección de compatibilidad, no una segunda autoridad."
    depende_de:
      - S4.2
      - S4.5
    cimientos:
      - test/install/launch-worker-cli.test.mjs
    recurso:
      - assignment-location
      - launch binding y namespace de witnesses Main-owned; sin segundo assignment store
    archivos:
      - main-store/store.mjs
      - main-store/launch-consumer.mjs
      - test/main-store.test.mjs
      - test/install/launch-worker-cli.test.mjs
    encargo:
      incompleto: true
      pedido_contexto: Binding Main-validado con Session ID canónico y procedencia durable de cada tab Tower-owned
      resultado_comportamiento: "assignment-location exige session_id canónico e inmutable; ausencia, forma inválida, conflicto o registro legacy falla cerrado.\n\nEl binding copia ese ID sin caller injection y consumer revalida schema; session_id de plan nunca se confunde con OpenCode root_session_id ni se infiere.\n\nMain establece exclusivamente assignment_ref↔session_id. Para una Ejecución admitida, el core persiste el intento mecánico con esa identidad validada y expectativas workspace/cwd; el adapter devuelve el readback que permite admitir procedencia idempotente, aceptar repetición byte-idéntica y rechazar conflicto, forged o ambigüedad. Ni core ni adapter eligen assignments. main-store JSON será proyección de compatibilidad del estado canónico en SQLite, nunca un segundo escritor de autoridad; la migración y proyección necesitan su propia cobertura antes de cambiar consumidores.\n\n`listTowerTabs()` enumera procedencia read-only, nunca liveness, active-set, dispatch o cierre.\n\nLa fixture registra sólo identidad Main-owned y la CLI acepta únicamente request_ref opaco. Cada lote de revisión queda bajo 400 líneas."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: Decisión del maintainer del 2026-09-13. Main establece assignment_ref↔session_id en assignment-location; binding/consumer lo transportan y persisten workspace/tab/pane sólo tras readback S107. main-store/launch-consumer.mjs:79-88 hoy guarda sólo request_ref y binding_path. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S121. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto. Enmienda aprobada: Engram 11293 e informe docs/architecture/torre-motor-determinista.md, secciones 12 y 14. Preparación incompleta: falta delimitar API, proyección/migración y huella completa conservando la procedencia y los datos previos. No se ejecuta migración ni se concede escritura de core desde esta declaración; S147/S148 no implementan outbox, proyección ni conversión de main-store."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Quién establece Session ID y qué significa la lista de tabs?
        resolucion: Sólo Main registra el session_id canónico; la lista prueba procedencia y Radar/S108 determinan estado y cierre.
        autoridad: Decisión explícita del maintainer del 2026-09-13.
        clase: seguridad-y-permisos; contrato-visible-del-producto
        falsificador: "Caller/runtime inyecta o infiere Session ID, o S121 usa witnesses como roster/liveness."
        descartadas:
          - opcion: Persistir otro active-set o derivar identidad desde branch/worktree/seat/tab/worker.
            razon: Duplica autoridad o confía en superficies no autoritativas.
