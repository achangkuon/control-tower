  - id: S3.4
    resultado: Persistencia y ciclo de vida de Jornada
    autoridad: existing jornada-v1 schema, S3.3 revision contract, and maintainer passive-invalidation decision
    depende_de: [S3.2, S3.3]
    criterios:
      - Una Jornada persiste validando jornada-v1 y falla cerrado si no lo satisface.
      - Una escritura por un actor que no es Main falla cerrada.
      - Una escritura sobre un proyecto ajeno falla cerrada.
      - REJECTED, EXPIRED, REVOKED y COMPLETED son irreversibles.
      - Toda transición incrementa jornada_revision.
      - Una lectura pasada expires_at reporta vencida sin transición previa.
      - Una capability ligada a una Jornada terminada deja de resolver.
      - No queda una lista manual de campos junto al schema.
      - bun test test/jornada test/main-store.test.mjs test/capabilities pasa completo.
      - bun test no introduce fallos nuevos sobre S3.3 con Torre desarmada.
      - El diff no toca Prohibido.
    decisiones:
      - tipo: derivable
        pregunta: ¿Dónde viven los registros de Jornada?
        criterio: En main-store/store.mjs mediante validación de schema, CAS expected_revision y assertMain.
        autoridad: main-store/store.mjs
        evidencia: Contrato inmutable S3.4.
        checkpoint: antes de M3.4.1
        opciones: [{opcion: Reusar el store Main, consecuencia: No existe un segundo store de autoridad.}]
      - tipo: derivable
        pregunta: ¿Qué transiciones son legales?
        criterio: El enum jornada-v1 y sus cuatro estados terminales irreversibles.
        autoridad: jornada-v1 y precedente de autorizaciones
        evidencia: Contrato inmutable S3.4.
        checkpoint: antes de M3.4.2
        opciones: [{opcion: Aplicar la máquina cerrada, consecuencia: Ningún terminal vuelve a estado activo.}]
      - tipo: derivable
        pregunta: ¿Qué ocurre con jornada_revision en una transición?
        criterio: Sube en toda transición sin excepción.
        autoridad: decisión de disponibilidad de S3.3
        evidencia: Contrato inmutable S3.4.
        checkpoint: antes de persistir transición
        opciones: [{opcion: Incrementar siempre, consecuencia: Bindings anteriores fallan por drift.}]
      - tipo: derivable
        pregunta: ¿Qué ocurre con una Jornada vencida por reloj sin transición?
        criterio: La lectura la reporta vencida sin mutar ni depender de un barrido.
        autoridad: floor fail-closed del proyecto
        evidencia: Contrato inmutable S3.4.
