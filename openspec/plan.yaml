  - id: S137
    prioridad: metodo-v1
    zona: metodo
    resultado: "El despacho manual pre-V1 usa Herdr sólo para asientos y procesos, transporta el trabajo de workers Pi por Intercom sin bloquear a Main y devuelve cada evento por una ruta explícita."
    autoridad: "Decisión explícita de Emilio del 2026-09-15 en #142: antes de completar Tower V1, los lotes paralelos manuales aceptan sólo workers Pi; Herdr conserva topología y lifecycle, Pi Intercom transporta despacho y eventos fire-and-forget, y Main no espera ni hace polling. Tower V1 conserva como objetivo posterior el modelo heterogéneo híbrido sin construir ahora un bridge provisional."
    depende_de: []
    cimientos: []
    recurso: []
    criterios:
      - "`chanks-3-despacho-herdr` rechaza antes de cualquier efecto todo lote sin aprobación humana completa o cuyo agent kind no sea Pi, y nunca sustituye el runtime elegido."
      - "Herdr se usa sólo para crear o identificar los asientos y procesos ya autorizados; el handoff de trabajo a cada worker Pi usa Intercom `send` y Main retorna después del resultado de entrega sin `herdr agent wait`, `prompt --wait` ni `intercom ask`."
      - "Cada worker Pi reporta progreso y estados terminales COMPLETED, BLOCKED o FAILED a Main por Intercom; una decisión humana usa una solicitud bloqueante iniciada por el worker, nunca polling iniciado por Main."
      - "Una identidad Intercom ausente, ambigua, desconectada o distinta del worker aprobado falla cerrado y no se declara despachada; la skill no agrega retry, cola, roster, persistencia, autoasignación ni fallback a otro transporte."
      - "El routing instalado conserva explícitamente que Intercom es transporte sin autoridad, que el modo manual pre-V1 es Pi-only y que el bridge heterogéneo pertenece a Tower V1."
      - "Las pruebas contractuales fallan si reaparece una espera ordinaria de Main, un agent kind no-Pi, un mensaje que otorgue autoridad o un bridge provisional, y la suite del Método pasa sobre el diff declarado."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Qué transporte usa el despacho manual antes de que Tower V1 esté completo?"
        resolucion: "Herdr conserva asientos y procesos; sólo workers Pi integran lotes paralelos manuales y Pi Intercom transporta handoff, progreso, bloqueo y resultado sin polling ni espera ordinaria de Main."
        autoridad: "Elección explícita de Emilio del 2026-09-15, registrada en #142 y #143."
        clase: contrato-visible; expansion-de-alcance; dependencias-o-evidencia-contradictorias
        falsificador: "Un lote manual pre-V1 admite un runtime no-Pi, Main debe consultar o esperar para descubrir progreso o cierre, o Intercom concede selección, rol o permisos."
        descartadas:
          - opcion: "Herdr como transporte común pre-V1."
            razon: "Herdr controla terminales y lifecycle, pero no entrega un callback estructurado a la conversación Main sin wait, polling o mediación humana."
          - opcion: "Bridge universal provisional."
            razon: "Duplicaría antes de V1 identidad, acuse, retry y recuperación que pertenecen al runtime Tower."
          - opcion: "Conservar espera bloqueante."
            razon: "Serializa al coordinador y reproduce la fricción de #142."
    ruta:
      propuesta: direct
      autoridad: "El runtime admitido, la separación Herdr/Intercom, las operaciones permitidas, los rechazos, la ruta de decisiones y el límite pre-V1 están resueltos y se verifican en una skill, su routing instalado y pruebas contractuales."
      revalidacion:
        resultado: direct
        base: 87f80ba6320eaf98618cf7e51b8bc3d8948da7dc
        evidencia: "El dispatcher actual acepta cualquier agent kind y en su paso 6 espera cada agente; el routing instalado repite el despacho Herdr sin contrato de transporte. Las tres rutas declaradas contienen toda la corrección: pruebas textuales RED, skill Pi-only con Intercom fire-and-forget y proyección del mismo límite en las instrucciones instaladas. No requiere diseño técnico ni toca el lifecycle de pool reservado a S131."
    entrega:
      commit: 4e38713076d286b6d0354dc1f75fc12200db80e6
    modulos:
      - id: M137.1
        resultado: "Despacho Pi por Intercom sin espera del coordinador"
        rutas: [agent-workflows/skills/chanks-3-despacho-herdr/SKILL.md, agent-workflows/templates/session-routing.md, agent-workflows/tests/test_despacho_herdr.py]
        tareas:
          - id: T137.1.1
            accion: "RED: exigir Pi-only, separación entre topología Herdr y transporte Intercom, handoff con send, eventos worker→Main y ausencia de wait, polling, autoridad o bridge provisional."
            resultado: "RED: la prueba contractual falla contra el dispatcher que acepta runtimes mixtos y espera cada agente."
            criterios: ["RED: cada regresión de runtime, transporte, dirección del evento y no bloqueo tiene una aserción falsificable."]
          - id: T137.1.2
            accion: "GREEN: ajustar el dispatcher y el routing instalado para validar workers Pi, enviar cada handoff por Intercom y devolver control tras la entrega, con decisiones bloqueantes iniciadas sólo por el worker."
            resultado: "GREEN: dos handoffs Pi independientes quedan definidos como fire-and-forget y Main no supervisa por espera o polling."
            criterios: ["GREEN: el contrato nombra identidad, fallo cerrado, observabilidad y los tres resultados terminales sin persistencia nueva."]
          - id: T137.1.3
            accion: "REFACTOR: eliminar reglas de transporte duplicadas y conservar intactos autoridad humana, gates Radar, lifecycle Herdr y el límite entre coordinación manual y Tower V1."
            resultado: "REFACTOR: una sola frontera separa asiento, mensaje y autoridad, y la suite del Método pasa."
            criterios: ["REFACTOR: el diff queda dentro de las tres rutas declaradas y no modifica S131, S132 ni runtime Tower."]

