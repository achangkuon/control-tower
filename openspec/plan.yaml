    resultado: "Radar mide cada Módulo entregado con la fórmula de la política —líneas agregadas más borradas, sin las rutas que el plan excluye— y avisa cuando supera el tope declarado."
    autoridad: "Aprobación de Emilio del 2026-09-14 (Claude Code, sesión df306f72), problema 2, opción 1, y decisión 2 sobre dónde viven las exclusiones. Evidencia: agent-workflows/tools/radar/check.go:905-922 cuenta sólo líneas agregadas del commit de entrega e incluye openspec/, mientras AGENTS.md:117 fija 400 líneas por lote revisado, agregadas más borradas y sin artefactos de planificación ni generados."
