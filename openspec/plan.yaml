      resultado_comportamiento: >-
        Registrar observedContentRef, towerExecutionContext, sealedPacket y executionEvidence
        con los cuatro archivos schema V1 declarados, Draft 2020-12, schema y schema_version
        constantes y propiedades declaradas estrictamente. Reutilizar el registro y conectar
        sus invariantes a contracts/validate.mjs; contracts/tower-execution.mjs aporta las
        funciones puras de huellas y vínculos, no una utilidad opcional desconectada.

        observed-content-ref identifica una captura local mediante observation_id, producer,
        source_kind, media_type, digest_mode raw-bytes, content_digest y observed_at; incluye
        issuer_reference sólo cuando el emisor realmente la haya emitido. Conserva el sujeto
        original en el registro capturado, sin reasignarlo a un execution_id posterior.
        Las referencias admiten este formato para capturas efímeras y el artifact-ref existente
        sólo para blobs reales de un commit Git. Radar status y radar sesion se vinculan por los
        bytes exactos de su stdout, nunca por una recanonicalización o procedencia Git inventada.

        tower-execution-context contiene execution_id, execution_revision, execution_context_digest,
        repository_snapshot_binding (repository_id, canonical_root, git_common_dir, base_sha),
        session_id, radar_status_ref, session_contract_ref, coordination_ref, encargo_ref,
        start_authority_refs y created_at. Es una instantánea de identidad y contexto, no la raíz
        mutable completa de SQLite. Conserva IDs de Sesión como S147 y S4.12 sin convertirlos a
        slug minúsculo. Las rutas locales vinculan ese checkout; no prueban identidad portable.

        sealed-packet contiene packet_id, packet_revision, packet_digest, attempt, el contexto
        de ejecución validado, transition_binding, idempotency_ref, expires_at, actor_binding_ref,
        work_purpose_ref al mismo Encargo, decision_refs, readonly_input_refs, materialized_context,
        scope, expected_evidence y predecessor. El alcance declara archivos exactos, Cimientos,
        recursos, efectos permitidos/prohibidos, comandos y checks autorizados y frontera de
        rollback/compensación. Vincula host/worker/capacidades esperados sin concederlos. Materializa
        sólo el contexto necesario y sus referencias/huellas, no una skill como autoridad ni acceso
        directo al store. La primera revisión carece de predecesor; las siguientes conservan
        Ejecución y enlazan paquete/revisión/huella anteriores, motivo, autoridad, presupuesto y
        evidencia terminal real. No fabrica comprobantes todavía inexistentes ni agrega partes
        al Encargo nativo de cuatro campos.

        execution-evidence incluye evidence_id/evidence_digest, execution_id/execution_revision/
        execution_context_digest, packet_id/packet_revision/packet_digest, attempt, actor_binding_ref,
        emitted_at, result_ref, changed_paths, check_observation_refs y external_observation_refs;
        sólo incorpora referencias a candidato/commit/tree cuando existan. changed_paths es un
        subconjunto de los archivos autorizados, no necesariamente toda su lista; admite subconjunto
        vacío y rechaza salidas de alcance. Los resultados y checks remiten a datos estructurados
        observados, no a veredictos o terminalidad inventados por el agente.

        Las huellas propias usan JCS/SHA-256 con dominios
        control-tower/tower-execution-context/artifact/v1, control-tower/sealed-packet/artifact/v1
        y control-tower/execution-evidence/artifact/v1, excluyendo sólo su propio campo de huella.
        Las huellas externas identifican bytes originales; los handles del proveedor permanecen
        opacos. La validación devuelve datos inmutables y rechazos deterministas CT_SCHEMA_INVALID.
        Pruebas aisladas deben aceptar cada formato válido y el legado sin regresión, y rechazar
        versiones desconocidas, propiedades extra, huellas incorrectas, vínculos cruzados entre
        ejecuciones/revisiones/intentos, predecesores incoherentes y archivos fuera de alcance.
        Deben distinguir captura efímera sin commit de referencia Git real, comprobar el vínculo
        con el contexto/paquete suministrado y la integración por la entrada común de validación.
      restricciones_decisiones: >-
        La propuesta pública y la forma de entrega secuencial están aprobadas. Previsión inicial
        de 700–1100 líneas autorales añadidas más eliminadas, incluidos schemas, código, fixtures
        y pruebas. Antes de RED, Gentle AI debe afinar el forecast y producir el desglose técnico
        de entregas independientes, verificables y reversibles, cada una con pruebas y frontera
        de reversión propias. No se aprobaron cortes concretos, cantidad de entregas ni excepción
        de tamaño. Las 400 líneas son referencia, no límite duro: una unidad que la supere requiere
        consultar antes de implementarla, sin recortar pruebas ni fragmentar artificialmente.
        Gentle AI posee el desglose, implementación y verificación mediante ODD; SDD sólo por
        solicitud humana explícita. S147 se entrega antes de iniciar S148. El inicio requiere
        selección humana, admisión Radar y compatibilidad frescas, no esta publicación documental.

        Los V1 coexisten con los formatos anteriores: no conversión automática, importación,
        reescritura histórica ni interpretación silenciosa de otra versión. No modificar
        contracts/index.mjs ni duplicar el registro. Registrar los schemas cambia la lista derivada
        de assets instalables, pero no ejecuta una instalación. Validar forma, huella o igualdad
