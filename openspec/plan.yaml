  - id: S161
    zona: metodo
    prioridad: metodo-v1
    resultado: >-
      Chanks abre y cierra la jornada con jornada.sh: al empezar diagnostica master y los
      worktrees, trae master con pull --ff-only, pone al día los worktrees limpios y recicla
      asientos limpios a una rama nueva; al cerrar muestra el diagnóstico de fin de día. Un
      worktree con trabajo sin entregar nunca se recicla sin la decisión explícita del humano.
    autoridad: >-
      Aprobación explícita de Emilio el 2026-09-25 en esta Conversación: Control Tower es un
      producto con dos modos, manual (Chanks) y automático (motor), y los pasos 0 (abrir) y 10
      (cerrar) de la jornada no tienen dueño en ninguno de los dos (Engram 11739, 11747). Regla de
      reciclado: Engram 9235.
    depende_de:
      - S159
    cimientos: []
    recurso: []
    entrega:
      commit: 1c3a056c405d76b9e13ba70298dbaf3554b2cf61
    archivos:
      - agent-workflows/skills/chanks-0-jornada/SKILL.md
      - agent-workflows/tools/install.py
      - agent-workflows/tests/test_chanks_jornada.py
      - agent-workflows/tests/test_install.py
    encargo:
      pedido_contexto: >-
        jornada.sh ya hace el diagnóstico (sin opciones), la puesta al día (--ejecutar: pull
        --ff-only del tronco y rebase de los worktrees limpios atrasados) y el reciclado
        (--reciclar <ruta> --nueva-rama <rama>), y la decisión 62 lo conserva como reciclador
        manual. Ninguna skill chanks lo invoca: el maintainer lo corre a mano y los agentes
        arrancan sin saber si su worktree está al día. Engram 9235 ya autorizó reciclar asientos
        permanentes con la Torre apagada, sólo sobre worktrees limpios. install.py registra las
        skills de Chanks en CHANKS_SKILLS y test_install.py fija ese conjunto exacto.
      resultado_comportamiento: >-
        Una skill nueva chanks-0-jornada responde a "empezamos la jornada" y "cerramos la
        jornada". Al abrir corre jornada.sh, presenta el diagnóstico, ejecuta --ejecutar y, por
        cada asiento limpio que el humano asigna, --reciclar hacia una rama sacada de master
        fresco. Un worktree sucio u ocupado se reporta con su evidencia y se pregunta una sola
        decisión (entregar, guardar o descartar) antes de tocarlo. Al cerrar corre el diagnóstico
        y lista lo pendiente. La skill llama a jornada.sh como herramienta de la Torre y no copia
