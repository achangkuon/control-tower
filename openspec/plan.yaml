  - id: S127
    zona: metodo
    resultado: "Radar ordena el trabajo por prioridades que define cada proyecto: sólo la primera prioridad con Sesiones abiertas ofrece trabajo LISTO, y la siguiente se activa sola cuando esa se cierra."
    autoridad: "Aprobación explícita de Emilio del 2026-09-14 (Claude Code, sesión df306f72): Radar gana la capacidad genérica de priorizar Sesiones, con el nombre `prioridad`, opcional y con nombres definidos por cada proyecto; la primera lista de Control Tower es Método V1, Torre V1 y V2. Aprobó en la misma conversación la ruta full-sdd y las cuatro precisiones: sólo difiere lo que habría estado LISTO, lo diferido a mano mantiene abierta su prioridad, S122 pasa a depender de esta Sesión y cada Módulo queda bajo 400 líneas. Evidencia: Radar no tiene prioridad entre Zonas (agent-workflows/tools/radar/state.go:256-296) y lee el plan en modo estricto (agent-workflows/tools/radar/plan.go:290)."
    depende_de: []
    cimientos: []
    recurso: []
    criterios:
      - "Con un plan que no declara `prioridades`, los estados, las colas por Zona, los asientos, `radar.snapshot/v1` y la vista generada son idénticos a los que produce Radar antes del cambio."
      - "El plan acepta `prioridades` como lista ordenada de entradas `{id, nombre}` definidas por cada proyecto; `radar check` falla ante un id vacío, un id duplicado o un nombre vacío."
      - "Con `prioridades` declarada, una Sesión abierta sin `prioridad` o con un id que no está en la lista hace fallar `radar check` nombrando esa Sesión; una Sesión COMPLETO o ARCHIVADO puede omitirla."
      - "Una Sesión cuyo `depende_de` apunta a una Sesión de una prioridad posterior hace fallar `radar check` nombrando las dos Sesiones."
      - "La prioridad activa es la primera de la lista con al menos una Sesión abierta; una Sesión con `diferida: true` cuenta como abierta. Si no queda ninguna abierta, no hay prioridad activa y ninguna Sesión se difiere por prioridad."
      - "Una Sesión de una prioridad posterior a la activa cuyo estado calculado habría sido LISTO queda DIFERIDO; PLANIFICADO, BLOQUEADO, COMPLETO y ARCHIVADO conservan su estado, y las Sesiones de la prioridad activa no cambian."
      - "Cuando la última Sesión abierta de la prioridad activa pasa a COMPLETO, la siguiente prioridad se activa sin editar `openspec/plan.yaml`; una prueba lo demuestra con dos entregas integradas sucesivas."
      - "`radar status`, `radar sesion <ID>`, `radar.snapshot/v1` y la vista generada muestran la prioridad activa y la prioridad de cada Sesión; el snapshot conserva su schema y todos sus campos actuales."
      - "`agent-workflows/skills/_shared/plan-naming-convention.md` declara `prioridad` como atributo opcional de orden, no como nivel, sin campo de tiempo; los cuatro niveles, los siete estados y la lista de sustantivos prohibidos no cambian."
      - "Radar sigue sin escribir `openspec/plan.yaml`; `go test ./...` en `agent-workflows/tools/radar` pasa y `radar check` sobre el plan vigente no suma errores."
      - "El diff toca sólo Área."
    decisiones:
      - tipo: resuelta
        pregunta: "¿Cómo se llama el concepto?"
        resolucion: "`prioridad`: nombra lo que hace, ordenar, y no choca con el vocabulario del canon."
        autoridad: "Aprobación de Emilio del 2026-09-14."
        clase: contrato-visible
        falsificador: "El plan, Radar o el canon nombran el concepto con otra palabra."
        descartadas:
          - opcion: "`etapa`."
            razon: "Es la traducción literal de `stage`, prohibido como nombre de nivel en el canon §7, y un agente la leería como un quinto nivel."
      - tipo: resuelta
        pregunta: "¿Las prioridades son fijas o las define cada proyecto?"
        resolucion: "Opcionales y definidas por cada plan con id y nombre propios, igual que las Zonas; Radar fija sólo el concepto y su cálculo."
