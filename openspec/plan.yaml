  - id: S130
    zona: metodo
    prioridad: metodo-v1
    # Reemplazada por S138 el 2026-09-15 por decisión de Emilio: Tareas como evidencia, commits por Módulo y una revisión por Sesión.
    archivada: true
    archivo: reemplazada
    resultado: "El puente protege el lote de revisión: revisa sólo el código del Módulo en staging, commitea los artefactos SDD aparte y cierra el intento nativo de un Módulo antes de tocar el siguiente."
    autoridad: "Aprobación de Emilio del 2026-09-14 (Claude Code, sesión df306f72), problema 2, opción 1, y decisión 3. Evidencia: en la sesión con Pi la revisión nativa contó 584 líneas por incluir los OpenSpec sin commitear frente a 254 de código; en S127 el conteo del intento de M127.1 sumó 456 líneas porque las pruebas de M127.2 ya estaban escritas, y Emilio autorizó el reinicio auditado s127-reset-1."
    # Depende de S135: ambas editan el puente y S135 redefine qué rutas producen artefactos SDD.
    depende_de: [S135]
    cimientos: []
    recurso: []
    criterios:
      - "`agent-workflows/skills/chanks-4-puente/SKILL.md` declara que la revisión nativa de cada Módulo se hace sobre la proyección staged que contiene sólo los archivos de ese Módulo."
      - "La skill declara que proposal, specs, design, tasks, apply-progress y verify-report se commitean en un commit de documentación separado de cada commit de Módulo."
      - "La skill declara que el intento nativo de un Módulo se cierra con `gentle-ai sdd-attempt settle` antes de modificar cualquier archivo del Módulo siguiente."
      - "`agent-workflows/tests/test_builder_flow.py` falla si alguna de las tres reglas desaparece de la skill."
      - "`cd agent-workflows && python3 -m unittest discover -s tests` pasa y el diff toca sólo Área."
    decisiones:
      - tipo: resuelta
        pregunta: "¿El puente también exige cerrar el intento de un Módulo antes de abrir el siguiente?"
        resolucion: "Sí: el intento nativo se cierra antes de modificar cualquier archivo del Módulo siguiente."
        autoridad: "Aprobación de Emilio del 2026-09-14, decisión 3."
        clase: contrato-visible
        falsificador: "La skill permite empezar un Módulo con el intento del anterior todavía abierto."
        descartadas:
          - opcion: "Dejar la regla sólo en la memoria del agente."
            razon: "Otro agente no la conoce y el conteo de líneas vuelve a mezclar dos Módulos."
    ruta:
      propuesta: direct
      autoridad: "Las tres reglas están decididas y el cambio se limita a una skill y su prueba; no queda decisión de diseño abierta."
    modulos:
      - id: M130.1
        resultado: "El puente escribe las tres reglas que protegen el lote"
        rutas: [agent-workflows/skills/chanks-4-puente/SKILL.md, agent-workflows/tests/test_builder_flow.py]
        tareas:
          - id: T130.1.1
            accion: "RED: exigir en test_builder_flow.py las reglas de revisión sobre staged, commit separado de artefactos SDD y cierre del intento antes del Módulo siguiente."
            resultado: "RED: la prueba falla contra el puente actual."
            criterios: ["RED: la prueba falla contra el puente actual."]
          - id: T130.1.2
            accion: "GREEN: agregar las tres reglas a las Hard Rules o a los pasos de ejecución del puente."
            resultado: "GREEN: la suite del Método pasa."
            criterios: ["GREEN: la suite del Método pasa."]
          - id: T130.1.3
            accion: "REFACTOR: dejar cada regla escrita una sola vez en la skill, sin repetirla entre secciones."
            resultado: "REFACTOR: ninguna regla queda duplicada y la suite del Método pasa."
            criterios: ["REFACTOR: ninguna regla queda duplicada y la suite del Método pasa."]
