  - id: S4.12
    prioridad: v3-flota
    zona: hosts
    diferida: true
    resultado: "Reporte de caída de Pi: detener y conservar rama/worktree/candidato sin recuperación automática"
    autoridad: "decisiones 81 y 87 del maintainer del 2026-08-27; enmienda de autoridad mecánica aprobada por Emilio, Engram 11293, sin reinterpretar las decisiones originales; reducida a reporte de caída por decisión de Emilio del 2026-09-26 (Engram 11838), que supersede, sólo para este fin, las decisiones 81 y 87: ante caída, el puesto se detiene y conserva evidencia, sin reinicio ni sucesor automático."
    depende_de:
      - S9.4
      - S1.18
    recurso:
      - árbol de procesos Tower-owned
      - checkpoint durable
      - lineage Pi
    archivos:
      - hosts/pi-recovery.mjs
      - test/hosts/pi-recovery.test.mjs
    encargo:
      pedido_contexto: "Reporte de caída de Pi: ante desconexión, envío incierto o caída probada, el puesto afectado se detiene y conserva su rama, worktree y candidato exactamente como están, y produce un reporte claro para revisión humana. No hay reinicio de árbol de procesos, sucesor con ID nuevo ni recuperación automática de ningún tipo. Reencuadre 2026-10-04 (Piloto automático): el reporte alimenta el estado NOVEDAD · interrumpida en Radar, que lo deduce de la marca que deja la caída; el reporte no calcula estados del plan."
      resultado_comportamiento: "Ante una caída probada, desconexión o envío incierto del puesto Pi, el reporte de caída se construye únicamente desde evidencia que no depende de una raíz de Ejecución ni de una transición registrada por un core Tower-owned (S147/S148, retiradas): el estado de la rama y el worktree en Git, el estado del agente en la tab Herdr declarada, el marcador radar.despacho/v1 y el roster Intercom. No hay adapter que registre una transición contra un core; el propio reporte lee esas cuatro fuentes directamente, sin decidir lifecycle ni tratar el transporte como prueba del efecto.\n\nAnte esa evidencia, nada termina, reinicia ni crea un sucesor: la rama, el worktree y el candidato se conservan exactamente como están, y se produce un reporte de caída con assignment, rama, último estado conocido observado en Git/Herdr/Intercom, motivo y recuperabilidad.\n\nOtros puestos del mismo mandato aprobado siguen si no dependen del puesto detenido; ninguno se detiene por inferencia.\n\nEl reporte no es una recuperación: ningún mensaje volátil ni readback sustituye la decisión humana de reanudar ese puesto. El reporte no reconstruye memoria OpenCode/Pi, no depende de una raíz de Ejecución ni de un core que la persista, y no toca fuera del Área exacta."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: decisiones 81 y 87 del maintainer del 2026-08-27. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S4.12. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto. Enmienda aprobada: Engram 11293 e informe docs/architecture/torre-motor-determinista.md, secciones 7, 10 y 14. Reducción 2026-09-26 (Emilio, Engram 11838): ante caída, detener y conservar; S4.12 produce sólo el reporte, sin reinicio ni sucesor automático, construido directamente desde Git (rama/worktree), Herdr (estado del agente), el marcador radar.despacho/v1 e Intercom (roster) — sin raíz de Ejecución ni transición registrada por un core Tower-owned, porque S147/S148 (que la habrían provisto) quedan retiradas. La preparación anterior, que delimitaba un contrato de recuperación core-adapter para esa raíz, queda sin objeto: se conservan los archivos conocidos sin permiso de expansión. Reencuadre V3: docs/architecture/piloto-automatico.md (sección 5, NOVEDAD · interrumpida)."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Qué recuperación mínima conserva Pi después de la muerte probada de la raíz?
        resolucion: "La Torre contiene y termina el árbol completo de procesos, prueba quiescencia y arranca un sucesor con ID nuevo e impredecible, --fork y lineage explícito. La continuidad proviene de OpenSpec, Engram y el checkpoint durables; no reconstruye briefs ordenados, epochs ni estado en memoria de OpenCode."
        autoridad: decisión 81 del maintainer del 2026-08-27
        clase: contrato-visible-del-producto; operaciones-irreversibles; seguridad-y-permisos; dependencias-o-evidencia-contradictorias
        falsificador: "La Torre crea el sucesor sin prueba de muerte y quiescencia, deja vivo un descendiente, reutiliza el ID previo, omite --fork o lineage, o trata memoria de proceso como continuidad durable."
        descartadas:
          - opcion: Portar completa la decisión 40.
            razon: Trasladaría al adapter Pi el acoplamiento y la reconstrucción propios de OpenCode.
          - opcion: Reinicio sólo manual.
            razon: Dejaría a la Torre sin recuperación del host que ahora va primero.
          - opcion: Dejarlo indefinido.
            razon: Permitiría reutilizar un ID terminal o bifurcar sobre un worktree aún activo.
        contaminaba:
          - S4.4
          - S7.1
      - tipo: resuelta
        pregunta: ¿Cómo se recuperan los mensajes en vuelo tras una caída del broker Pi?
        resolucion: "Se conserva el mailbox actual, volátil y en memoria. Los mensajes en vuelo perdidos se recuperan repitiendo comandos idempotentes desde el estado durable de Torre, OpenSpec, Engram y checkpoint; no se construye mensajería durable ahora."
        autoridad: decisión 87 del maintainer del 2026-08-27
        clase: contrato-visible-del-producto; operaciones-irreversibles; migraciones-o-perdida-de-datos; dependencias-o-evidencia-contradictorias
        falsificador: "Una recuperación depende de un mensaje en memoria, un comando repetido produce un efecto no idempotente, se toma socket_delivered como prueba de aplicación o se declara el mailbox durable."
        descartadas:
          - opcion: Persistir el mailbox.
            razon: "Duplicaría el estado durable y agregaría replay, orden y recuperación que la forma mínima no necesita."
          - opcion: Tratar socket_delivered como recepción.
            razon: No es prueba producer-owned.
          - opcion: Dejar la semántica de pérdida indefinida.
            razon: Permitiría asumir continuidad de mensajes que el broker no garantiza.
        contaminaba:
          - S4.4
          - S7.1
      - tipo: resuelta
        pregunta: "¿Ante una caída probada de Pi, la Torre reinicia el árbol de procesos con un sucesor, o el puesto se detiene y conserva evidencia para revisión humana?"
        resolucion: "El puesto se detiene y conserva su rama, worktree y candidato exactamente como están; produce un reporte de caída claro (assignment, rama, último estado conocido, motivo, recuperabilidad) para la mañana. No hay reinicio de árbol de procesos, sucesor con ID nuevo, --fork ni recuperación automática de ningún tipo; sólo intervención humana reanuda ese puesto. Otros puestos del mismo mandato siguen si no dependen del detenido."
        autoridad: "Emilio, 2026-09-26, Engram 11838. Supersede, sólo para este fin, las decisiones 81 y 87 del maintainer del 2026-08-27; no las invalida como evidencia histórica de la arquitectura de recuperación que se consideró y se decidió no construir ahora."
        clase: contrato-visible-del-producto; operaciones-irreversibles; dependencias-o-evidencia-contradictorias
        falsificador: "La Torre reinicia, termina o crea un sucesor automáticamente tras una caída, o un puesto detenido bloquea otros puestos independientes del mismo mandato."
        descartadas:
          - opcion: "Mantener la recuperación automática mínima que describían las decisiones 81/87."
            razon: "Emilio eligió detener y conservar en vez de recuperar automáticamente; construirla ahora contradice esa elección explícita."
