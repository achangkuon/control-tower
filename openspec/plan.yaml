            accion: "RED: exigir que canon, puente, ruteo, juicio de ruta, cierre y asignación declaren SDD nativo y archive sólo para full-sdd, verify contra criterios con evidencia en el commit de entrega para direct y design-tasks, y el design de design-tasks en el plan."
            resultado: "RED: las pruebas del Método fallan contra los textos actuales."
            criterios: ["RED: las pruebas del Método fallan contra los textos actuales."]
          - id: T135.2.2
            accion: "GREEN: reescribir la regla de rutas en cada superficie."
            resultado: "GREEN: la suite del Método pasa."
            criterios: ["GREEN: la suite del Método pasa."]
          - id: T135.2.3
            accion: "REFACTOR: dejar la regla completa sólo en el §15 del canon y hacer que las demás superficies remitan a él."
            resultado: "REFACTOR: la regla vive una vez y la suite del Método pasa."
            criterios: ["REFACTOR: la regla vive una vez y la suite del Método pasa."]

