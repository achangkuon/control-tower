  - id: S4.10
    resultado: Identidad, binding y puerto runtime host-neutral
    autoridad: decisiones 80, 84, 86, 89 y 90 del maintainer
    depende_de: []
    recurso: [namespace de identidad/binding y reserva de puerto loopback]
    criterios:
      - Identidad, worktree, proceso, binding e incarnation se validan sin vocabulario Pi/OpenCode.
      - El puerto pertenece al binding exacto.
      - Colisión, stale o campo extra fallan cerrado.
      - Ningún cambio de implementación salió de Área.
    decisiones:
      - tipo: resuelta
        pregunta: ¿Cuál es el primer host de implementación y qué alcance de procesos puede autorizar la Torre?
        resolucion: Pi pasa a ser el primer host de implementación; OpenCode queda parqueado, no retirado, y la prueba de attach vale sólo para procesos que la Torre lanza con identificadores impredecibles.
        autoridad: decisión 80 del maintainer del 2026-08-27, sobre tres auditorías
        clase: contrato-visible-del-producto; dependencias-o-evidencia-contradictorias
        falsificador: Se retira o archiva código o Sesiones de la ruta OpenCode en vez de parquearlos; se declara ATTACHED para un proceso que la Torre no lanzó o sin recibo ligado a nonce fresco y endpointEpoch vigente; el coordinador se implementa como agente Pi; se usan IDs adivinables; o se usa esta decisión para resolver las cinco preguntas que dejó abiertas.
        descartadas:
          - opcion: Mantener OpenCode primero.
            razon: La evidencia medida prueba que Pi produce el recibo producer-owned ligado a nonce, sesión, cwd, pid y endpointEpoch que falta en la composición OpenCode.
          - opcion: Retirar OpenCode.
            razon: La decisión preserva todo el código, pruebas, decisiones, evidencia y checkpoint de la ruta OpenCode como historia resoluble.
        contaminaba: [S1.17, S1.18, S1.19, S9.4, S4.4, S4.8, S4.9, S7.1, S8.12]
      - tipo: resuelta
        pregunta: ¿Dónde se define la interfaz runtime compartida por Pi y OpenCode?
        resolucion: La interfaz runtime host-neutral se define antes del adapter Pi; lifecycle, identidad y binding, observación, stop y attach pertenecen al contrato neutral, y Pi y OpenCode son adapters.
        autoridad: decisión 84 del maintainer del 2026-08-27
        clase: contrato-visible-del-producto; api-publica; expansion-de-alcance; dependencias-o-evidencia-contradictorias
        falsificador: Una operación neutral importa semántica exclusiva de Pi/OpenCode, Intercom se vuelve autoridad de producto, o una de las cinco capacidades queda sin owner contractual antes del adapter.
        descartadas:
          - opcion: Reescribir directamente la superficie Pi-specific.
            razon: Repetiría el acoplamiento que se está retirando.
          - opcion: Convertir Pi o Intercom en arquitectura de producto.
            razon: Ataría la Torre a un vendor y a su wire format.
          - opcion: Dejar las 228 líneas sin dueño.
            razon: Ambos caminos las necesitan y la omisión reaparecería en release.
        contaminaba: [S1.17, S1.18, S1.19, S9.4, S8.12, S7.1]
      - tipo: resuelta
        pregunta: ¿Qué topología aísla el runtime host-neutral por worktree?
        resolucion: Un broker por worktree, con supervisor Tower-owned, rutas runtime cortas, IDs de sesión impredecibles y registro de keepalive propiedad de la Torre; controla sólo procesos lanzados por la Torre y no modifica Pi ni pi-intercom.
        autoridad: decisión 86 del maintainer del 2026-08-27
        clase: seguridad-y-permisos; contrato-visible-del-producto
        falsificador: Dos worktrees comparten broker, socket o namespace; una ruta excede el límite validado; el supervisor no mantiene su registro; o se usa un ID adivinable.
        descartadas:
          - opcion: Broker compartido.
            razon: Amplía namespace y blast radius entre worktrees.
          - opcion: Rutas largas no verificadas.
            razon: Pueden exceder el límite del socket Unix.
          - opcion: Supervisor fuera de la Torre.
            razon: Perdería ownership y keepalive.
          - opcion: Dejar la topología implícita.
            razon: Haría accidental el Grado 2 aceptado.
        contaminaba: [S1.17, S1.18, S1.19, S9.4]
      - tipo: resuelta
        pregunta: ¿Qué representación pública v1 expone el contrato host-neutral?
        resolucion: Cinco formas separadas e independientemente versionables —identidad, worktree, proceso, incarnation y binding— con los campos fijados en la spec host-runtime.
        autoridad: decisión 89 del maintainer del 2026-08-27
        clase: contrato-visible-del-producto; api-publica; seguridad-y-permisos
        falsificador: La implementación colapsa las cinco superficies sin nueva autoridad, expone campos no declarados, acepta vocabulario específico de host o permite que una forma incompleta o inválida gane autoridad.
        descartadas:
          - opcion: Envelope público de binding con componentes internos.
            razon: Ocultaría superficies públicas que deben permanecer explícitas.
          - opcion: Objeto agregado.
            razon: Colapsaría contratos independientemente versionables.
          - opcion: Ninguna acción.
            razon: Mantendría sin autoridad explícita la representación pública.
        contaminaba: [S4.10, S4.11, S4.12, S1.17, S1.18, S1.19, S9.4, S8.12, S7.1]
      - tipo: resuelta
        pregunta: ¿Cómo se corrige el inventario manual de schemas tras agregar las cinco formas?
        resolucion: Cambiar exclusivamente expect(schemaFiles).toHaveLength(26) por expect(schemaFiles).toHaveLength(31) en test/contracts/schema.test.mjs.
        autoridad: decisión 90 del maintainer; cierre probado por 4ba00b3557cdfee6d99bddbb6424eec51a3fce27
        clase: expansion-de-alcance; dependencias-o-evidencia-contradictorias
        falsificador: El inventario no es exactamente 31; el gate pasa a ser dinámico o dirigido por manifest; cambia cualquier cosa además de la única línea 26→31; o esta autoridad agrega otro path.
        descartadas:
          - opcion: Inventario dinámico o basado en manifest.
            razon: Eliminaría el gate manual.
          - opcion: Cualquier otro cambio o path.
            razon: Excedería la contradicción observada.
          - opcion: No actuar.
            razon: Dejaría roja la suite pese a los cinco schemas aprobados.
        contaminaba: [S4.10, S7.1]
    entrega:
