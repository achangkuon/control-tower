schema: plan
schema_version: 3
producto: control-tower

zonas:
  - id: hosts
    nombre: Hosts
    rutas: [hosts/, adapters/, extensions/, plugin/, test/hosts/, test/adapters/, test/extensions/, test/plugin/, test/host-adapters.test.mjs, scripts/host-compatibility/opencode.mjs, test/compat/opencode-runtime.test.mjs]
  - id: entrega
    nombre: Entrega
    rutas: [delivery/, continuation/, test/delivery/, test/continuation/]
  - id: instalacion
    nombre: Instalación
    rutas: [install/, test/install/]
  - id: contratos
    nombre: Contratos
    rutas: [contracts/, schemas/, registry/, test/contracts/, test/registry/]
  - id: asientos
    nombre: Asientos
    # Clasificación exclusiva de procedencia cerrada para S8.14: profiles/ no es una fuente activa en HEAD; las fuentes activas están bajo product/tower/.
    rutas:
      - supervision/
      - ruta: profiles/
        ausencia_intencional: legado-retirado
      - escalation/
      - support/
      - workspace/
      - test/escalation/
      - test/supervision/
      - test/support/
      - test/workspace/
  - id: jornada
    nombre: Jornada
    rutas: [jornada/, jornada.sh, test/jornada/]
  - id: enrolamiento
    nombre: Enrolamiento
    rutas: [enroll/, main-store/, test/enroll/, test/main-store.test.mjs]
  - id: capacidades
    nombre: Capacidades
    rutas: [capabilities/, policy/, test/capabilities/, test/policy/]
  - id: autoridad
    nombre: Autoridad
    rutas: [openspec/plans/, openspec/plan.yaml, openspec/ROADMAP.md, openspec/prd/, openspec/rfc/, openspec/specs/, openspec/maintenance/, openspec/config.yaml, docs/]
  - id: archivo
    nombre: Archivo
    # openspec/archive/sesiones/ recibe el histórico en markdown de las Sesiones cerradas (S160,
    # aprobado por Emilio el 2026-09-24).
    rutas: [openspec/changes/, openspec/archive/legacy-planning/, openspec/archive/sesiones/]
  - id: metodo
    nombre: Método
    # odd/tasks/ es continuidad de ejecución ODD, evidencia técnica subordinada y no
    # autoridad de producto. Vive en Método porque ODD es el flujo de Chanks. Antes se
    # declaraba sólo chanks-odd-session-model.md y el resto de los registros quedaba sin
    # dueño, lo que rompe la partición exhaustiva al trackearlos (2026-09-18).
    rutas: [agent-workflows/, odd/tasks/]
  - id: producto-torre
    nombre: Producto Torre
    rutas: [product/tower/]

# Orden de trabajo aprobado por Emilio el 2026-09-14: primero se cierra el Método V1, después se
# construye, prueba, instala y usa la Torre V1, y recién entonces se construye lo siguiente. Radar sólo
# ofrece trabajo LISTO de la primera prioridad con Sesiones abiertas (S127).
# Emilio aprobó adelantar S145 → S143 → S144 → S146 (Engram 11171/11173).
# Dos prioridades explícitas conservan el orden relativo del resto; las demás
# alternativas LISTO quedan DIFERIDO mientras este conjunto siga pendiente.
#
# Replanteo aprobado por el maintainer: Torre V1 es adopción project-local para Pi y
# Claude Code mediante una única skill control-tower, referencias lazy y lifecycle
# reversible. No depende de package Pi ni runtime routing.
#
# Definición de versiones aprobada por el maintainer el 2026-10-01
# (docs/architecture/definiciones-v1-v2-v3.md):
# - V1 no tiene semáforo, reserva de Sesiones ni candado de escritura. S149 queda como
#   historia entregada y no define la V1 vigente.
# - V2 es Pista: entrega ordenada por proyecto, donde varias conversaciones independientes
#   entregan por una sola puerta. Todavía no tiene Sesiones enumeradas.
# - V3 es la Torre automática: varias Sesiones trabajan durante horas en tabs separadas
#   mientras Main y las tabs muestran finalización, stalls o decisiones humanas. La
#   observación remota usa Moshi + Tailscale; Telegram queda fuera. Recibe también la
#   resolución de problemas que antes se clasificaba como V2.
#
# Orden de remediación aprobado por el maintainer: completar Torre V1; resolver problemas
# generales y de V1; construir Pista V2; resolver problemas de la Torre V3 y construirla;
# resolver problemas del sistema anterior. Estas categorías no crean ni reasignan Sesiones
# por sí solas.
prioridades:
  - id: metodo-v1-radar-prioritario
    nombre: Método V1 · Radar prioritario
  - id: metodo-v1-controles-prioritarios
    nombre: Método V1 · Controles prioritarios
  - id: metodo-v1
    nombre: Método V1
  - id: torre-v1
    nombre: Torre V1 · Adopción project-local reversible
  - id: resolucion-problemas-generales
    nombre: Resolución de problemas · Generales
  - id: resolucion-problemas-v1
    nombre: Resolución de problemas · Torre V1
  - id: v2-piloto
    nombre: V2 · Piloto automático desatendido
  # Copiloto aprobado por el maintainer el 2026-10-07 (docs/architecture/copiloto.md); va después
  # del piloto para no postergar los arreglos del smoke en curso.
  - id: v2-copiloto
    nombre: V2 · Copiloto
  # El maintainer pidió el 2026-10-07 que las Sesiones de distribución para socios (S184, S190),
  # diferidas hasta la prueba en macOS, dejen de retener la prioridad torre-v1 y no posterguen V2.
  - id: torre-v1-distribucion-socios
    nombre: Torre V1 · Distribución para socios (pendiente de prueba en macOS)
  - id: resolucion-problemas-v3
    nombre: Resolución de problemas · Torre V3
  - id: v3-flota
    nombre: V3 · Flota — Conversaciones por vuelo y Pista
  - id: resolucion-problemas-anteriores
    nombre: Resolución de problemas · Sistema anterior

# Frentes de ejecución en paralelo (2026-10-04):
# - Frente 1 · Resolución de problemas: prioridades resolucion-problemas-generales y
#   resolucion-problemas-v1 (S175–S181); planificación reconciliada, aprobada y entregada.
# - Frente 2 · V2/V3: prioridades v2-piloto y v3-flota (S203, S169, S214–S217 y las Sesiones
#   diferidas S4.12, S9.8, S107). Legado decidido el 2026-10-04: core.mjs y main-store/ quedan
#   archivados como historia sin trabajo planificado; la decisión sobre chanks-0-jornada queda
#   pendiente y atada a la planificación de V3 (podría servir a Flota).

