    encargo:
      pedido_contexto: "Ejecutar un piloto terminal Pi-first contra un único candidato inmutable de control-tower y el contrato host-neutral en un HOME/runtime aislado, preservando OpenCode como conformidad diferida."
      resultado_comportamiento: "Un único candidate_revision inmutable identifica la corrida completa.\n\nToda evidencia se traza al contrato host-neutral y a ese candidato.\n\nLa cadena Pi y la recuperación mínima pasan.\n\nLa instalación, el rollback y el preflight completos pasan en un HOME/runtime aislado, sin instalar ni activar en globals reales.\n\nLa corrida larga, el crash del broker bajo tráfico y cinco clientes producen evidencia.\n\nNo se afirma soporte por encima de cinco clientes.\n\nSecuencia futura obligatoria: prueba aislada -> publicación de una release V1 probada -> autorización humana explícita posterior -> distribución global real; una V1 meramente probada no basta y esta gate no autoriza publicar ni distribuir ahora.\n\nS5.3 se trata como dependencia satisfecha y no se modifica ningún path fuera del Área declarada."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación. La Sesión es sólo de lectura: no autoriza archivos, Cimientos ni escritura."
      referencias: "Autoridad original: Decisiones 32, 33 y 85 del maintainer; reconciliación Pi-first vigente en openspec/plans/plan-7/STATUS.md líneas 69-79; asignación Entrega aprobada en agent-workflows/ASIGNACION-24-SESIONES.md líneas 161-174. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S7.1. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: ¿Sobre qué repositorio se corre el piloto cuando un gate no está cubierto?
        resolucion: El piloto se corre sobre control-tower mismo contra un único candidato final.
        autoridad: Decisión 32 del maintainer del 2026-08-14.
        clase: dependencias-o-evidencia-contradictorias
        falsificador: Se emite una declaración de conformidad sin evidencia de piloto sobre control-tower.
        descartadas:
          - opcion: Declarar conformidad sin cubrir el gate.
            razon: Afirmaría algo que no se midió.
          - opcion: Agregar otro piloto.
            razon: Expandiría el alcance de la Sesión.
        contaminaba:
          - declaracion-de-release
      - tipo: resuelta
        pregunta: ¿Qué resultado rojo del piloto bloquea la release?
        resolucion: Bloquea sólo un rojo vivo sobre un requisito de Gates A-G; los rojos de capacidades deliberadamente diferidas no bloquean.
        autoridad: Decisión 33 del maintainer del 2026-08-14.
        clase: contrato-visible-del-producto
        falsificador: Se emite una declaración con un rojo vivo sobre Gates A-G o se bloquea por un rojo de alcance diferido.
        descartadas:
          - opcion: Todo rojo bloquea.
            razon: F7 failover y F8 campañas multiproyecto fueron retirados deliberadamente del alcance.
          - opcion: Ningún rojo bloquea.
            razon: Convertiría el gate en documentación sin fuerza.
        contaminaba:
          - declaracion-de-primera-version
      - tipo: resuelta
        pregunta: ¿Qué host y candidato gobiernan la conformidad terminal de S7.1?
        resolucion: S7.1 corre una sola vez contra el candidato final Pi-first inmutable de control-tower y el contrato host-neutral; OpenCode queda diferido mientras esté parqueado.
        autoridad: Decisión 85 del maintainer del 2026-08-27.
        clase: contrato-visible-del-producto; dependencias-o-evidencia-contradictorias
        falsificador: "La release usa más de un candidato, evidencia mutable o de otro host, omite el contrato neutral, ignora un rojo de Gates A-G o exige conformidad OpenCode mientras siga diferido."
        descartadas:
          - opcion: Gate dual-host.
            razon: Haría depender la primera release de un host deliberadamente parqueado.
          - opcion: Reutilizar evidencia de un host para otro.
            razon: La prueba no sería atribuible al runtime liberado.
          - opcion: Conservar S7.1 sólo para OpenCode.
            razon: Mediría un candidato distinto del Pi-first que se pretende declarar.
        contaminaba:
          - S7.1
          - declaracion-de-release
