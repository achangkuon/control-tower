        autoridad: production-provider.mjs:152 y auditoría P8 confirmada por el contrato S4.6
        evidencia: La verificación por descriptor abierto es una frontera de seguridad independiente del lock literal de versión de Herdr.
        checkpoint: antes de cualquier cambio en production-provider.mjs
        opciones:
