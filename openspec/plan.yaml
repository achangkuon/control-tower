  # S117, S118 y S119 se enumeran el 2026-09-11 desde tres propuestas escritas el 2026-09-03/04 en
  # schema v3 y conservadas fuera de master en la rama support/read-only-20260830. Sus autores
  # dejaron el id en null a propósito: §8 del canon prohíbe renumerar, y la secuencia plana no
  # estaba asignada mientras Fase B seguía en vuelo. Fase B cerró, así que la secuencia se asigna
  # acá una vez y no se vuelve a tocar. Las propuestas originales y sus auditorías quedan en
  # openspec/plans/ como narrativa, sin autoridad.

  - id: S117
    prioridad: torre-v1
    zona: instalacion
    resultado: "Los tres registros de instalación dejan de forzar ediciones cross-Zona: sus datos enumerados salen del test a un módulo propio declarado como Cimiento exacto."
    autoridad: "openspec/plans/audits/cross-zona-registry-audit.md (Audit G, 2026-09-04), rescatada de support/read-only-20260830 y enumerada por decisión del maintainer del 2026-09-11 al integrar las tres propuestas pendientes."
    depende_de:
      []
    cimientos:
      - test/install/tower-role-assets.contract.mjs
    recurso:
      []
    archivos:
      - test/install/payload-closure.contract.mjs
      - test/install/payload-closure.test.mjs
      - test/install/tower-role-assets.contract.mjs
      - test/install/tower-role-assets.test.mjs
      - test/install/runtime-payload.contract.mjs
      - test/install/runtime-payload.test.mjs
    encargo:
      pedido_contexto: "Los tres registros de instalación dejan de forzar ediciones cross-Zona: sus datos enumerados salen del test a un módulo propio declarado como Cimiento exacto."
      resultado_comportamiento: "Cada uno de los tres registros queda partido en dos: un `*.contract.mjs` con sólo el dato enumerado, y el `*.test.mjs` original con sólo la lógica, que lo importa.\n\nCada valor extraído es idéntico byte a byte al que reemplazó. Falsificador: cualquier diferencia entre el literal viejo y el export nuevo, más allá del formato, falla este criterio.\n\nLa suite completa pasa antes y después de cada unidad de implementación, sin debilitar, quitar ni condicionar ninguna aserción para acomodar la partición.\n\n`radar check` no reporta huérfanos, solapes ni reglas sin uso con las tres rutas `*.contract.mjs` declaradas en `cimientos.rutas`.\n\n`owners()` resuelve cada `*.contract.mjs` nuevo a `cimientos` solo, no a `cimientos + instalacion`. Falsificador: dos dueños significan que el recorte exacto no se aplicó y la partición sí solapa.\n\nNingún archivo cambia de directorio. Falsificador: cualquier ruta fuera de `test/install/` en el diff significa que no se usó el recorte y la Zona instalacion perdió territorio que debía conservar.\n\n`install/runtime-payload.mjs` queda intacto: su lista es generada y editarlo sería alcance que la auditoría excluyó explícitamente."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: openspec/plans/audits/cross-zona-registry-audit.md (Audit G, 2026-09-04), rescatada de support/read-only-20260830 y enumerada por decisión del maintainer del 2026-09-11 al integrar las tres propuestas pendientes. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S117. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: derivable
        pregunta: ¿Generar las tres listas en vez de extraerlas?
        resolucion: "No. Extraer. La generación es el remedio más fuerte y ya se usa donde aplica, pero ninguna de estas tres listas es derivable."
        autoridad: openspec/plans/audits/cross-zona-registry-audit.md §3
        clase: interna
        checkpoint: antes de T117.1.1
        evidencia: "`ASSET_CONTRACTS` guarda valores de frontmatter esperados y tres juegos de regex que fijan oraciones exactas, y ninguna herramienta los computa del árbol. Las dos listas golden son deliberadamente escritas a mano, y un golden generado por el mismo código que verifica no prueba nada. El precedente de generación que sí aplica, `<generated:runtime-payload>`, ya está entregado y cubre el caso derivable."
        criterio: "Si alguna de las tres listas pudiera computarse del repositorio sin leer el propio código que verifica, esta resolución es incorrecta y corresponde generar en vez de extraer."
        opciones:
          - opcion: Extraer el dato a un módulo propio declarado como Cimiento exacto.
            consecuencia: El dato deja de forzar ediciones cross-Zona y se conserva byte a byte; el test queda con sólo lógica.
          - opcion: Generar las tres listas desde el árbol.
            consecuencia: "Un golden generado por el código que verifica deja de probar nada, y los markers de frontmatter y las oraciones exactas se pierden porque ninguna herramienta los computa."
      - tipo: derivable
        pregunta: "¿Los módulos extraídos deben salir de `test/install/`?"
        resolucion: No. Se quedan donde están y se declaran como Cimientos de archivo exacto.
        autoridad: agent-workflows/tools/radar/partition.go:81-83
        clase: interna
        checkpoint: antes de T117.1.3
        evidencia: "Un Cimiento exacto recorta un archivo de una ruta amplia de Zona (partition.go:81-83), comportamiento cubierto por TestCimientoExactoRecortaUnaRutaAmpliaDeZona. El recorte resuelve el caso sin tocar la ruta amplia `test/install/` ni mover ningún archivo de directorio."
        criterio: "Si `owners()` devolviera dos dueños para una ruta exacta declarada bajo una ruta amplia, el recorte no aplicó y mudar los módulos fuera de `test/install/` sería obligatorio."
        opciones:
          - opcion: "Dejarlos en `test/install/` y declararlos como Cimientos exactos."
            consecuencia: "Ningún archivo cambia de directorio y la Zona instalacion conserva su territorio; el dato queda recortado a `cimientos`."
          - opcion: "Mudarlos fuera de `test/install/`."
            consecuencia: La Zona instalacion pierde territorio que le corresponde y el diff toca rutas que la auditoría excluyó del alcance.
  - id: S118
    zona: hosts
    resultado: "Una operación de la Torre se reconoce a simple vista dentro de una sesión Pi: emoji, nombre y color propios en los cuatro estados observables."
    autoridad: "openspec/plans/audits/pi-tui-badge-audit-d.md (Audit D) y la decisión 109 del maintainer del 2026-09-03 —renumerada desde 108 por colisión—, conservadas en openspec/plans/proposals/p13-badge-torre-pi.md y enumeradas el 2026-09-11."
    depende_de: []
    cimientos: []
    recurso: [superficie de render de la extensión Pi y el contrato de capacidades de extensions/pi/package.json]
    criterios:
      - "Las filas de las tools de la Torre renderizan emoji, nombre y color en los cuatro estados observables: preparando, corriendo, completado y fallido."
      - "`torre` se expone como UN tool con subcomando enumerado. Falsificador: el catálogo expone más de un tool para el vocabulario de `bin/torre`."
      - "`extensions/pi/package.json` declara las capacidades de render nuevas y conserva un único inventario de transforms; no quedan listas paralelas."
      - "El badge consume tokens de tema ya existentes. Falsificador: se declara un token nuevo, que falla cerrado contra el schema de Pi."
      - "El diff toca sólo `extensions/pi/**` y `test/extensions/pi/**`."
      - "Ninguna mutación de Pi core, `pi-intercom`, skills genéricas de Gentle AI, `adapters/pi/**`, `mcp.mjs`, `bin/torre`, `hosts/**` ni `install/**`: esta Sesión presenta, no redefine router de input, enrolamiento, autoridad ni transporte."
    decisiones:
      - tipo: resuelta
        pregunta: "¿La Torre se presenta en Pi como extensión propia o como servidor MCP?"
        resolucion: "Como extensión propia. Es contrato visible del producto."
        autoridad: "Decisión 109 del maintainer del 2026-09-03, registrada en openspec/plans/decision-register.md."
        clase: contrato-visible
        falsificador: "La presentación de la Torre en Pi se resuelve por MCP en vez de por la extensión declarada."
      - tipo: resuelta
        pregunta: "¿Qué identidad exacta muestra el badge de la Torre en Pi?"
        resolucion: "El badge muestra exactamente `🗼 Torre`; preparando y corriendo usan el tono existente de advertencia, completado usa éxito y fallido usa error."
        autoridad: "Selección explícita del maintainer en el preflight interactivo de S118."
        clase: contrato-visible
        falsificador: "El badge usa otro emoji o nombre, declara un color nuevo, o no distingue visualmente preparando/corriendo, completado y fallido con los tonos semánticos aprobados."
        descartadas:
          - opcion: "`🏰 Torre` con los mismos tonos semánticos."
            razon: "El maintainer eligió la torre literal como identidad visible."
          - opcion: "No definir identidad ni comenzar RED."
            razon: "El maintainer decidió destrabar S118 y fijar el contrato antes del test."
        contaminaba: [S118]
      - tipo: derivable
        pregunta: "¿Granularidad de la superficie tipeable de `torre`?"
        resolucion: "Un único tool con subcomando enumerado."
        autoridad: "Decisión del maintainer del 2026-09-03, registrada en openspec/plans/decision-register.md."
        clase: interna
        checkpoint: "antes de T118.1.1"
        evidencia: "El vocabulario tipeable de `bin/torre` ya está cerrado y enumerado: cada comando es un subcomando de un verbo único, no una superficie independiente. Exponer un tool por comando multiplicaría el catálogo de Pi por el tamaño de ese vocabulario sin agregar ninguna capacidad."
        criterio: "El catálogo expone más de un tool para el vocabulario de `bin/torre`."
        opciones:
          - opcion: "Un tool `torre` con subcomando enumerado."
            consecuencia: "El catálogo de Pi crece en una entrada y el vocabulario queda enumerado en un solo lugar."
          - opcion: "Un tool por comando de `bin/torre`."
            consecuencia: "El catálogo crece con cada comando nuevo y el vocabulario queda repartido, sin ganar ninguna capacidad."
      - tipo: derivable
        pregunta: "¿De dónde sale el color del badge?"
        resolucion: "De un token existente del tema."
        autoridad: "openspec/plans/audits/pi-tui-badge-audit-d.md §3"
        clase: interna
        checkpoint: "antes de T118.1.2"
        evidencia: "El schema de temas de Pi enumera sus tokens y falla cerrado ante uno no declarado, así que un token nuevo no es una decisión de estilo sino un cambio de contrato de Pi, que está fuera del Área de esta Sesión."
        criterio: "El badge declara un token de tema que no existía, o el render falla cerrado contra el schema de Pi."
        opciones:
          - opcion: "Consumir un token de tema existente."
            consecuencia: "El badge respeta el tema del usuario y el diff no sale del Área declarada."
          - opcion: "Declarar un token de tema nuevo."
            consecuencia: "Falla cerrado contra el schema de Pi y convierte una Sesión de presentación en un cambio del contrato de temas."
    ruta:
      propuesta: direct
      autoridad: "El mecanismo, la implementación de referencia y los archivos quedaron fijados por Audit D; no hay diseño sin resolver. `chanks-3-session-kickoff` la revalida una vez contra el código de la Zona."
