  - id: S1.19
    prioridad: torre-v2
    resultado: Regresión integral Pi-first
    autoridad: "decision 104, Engram observation 10008, approved Pi-first capacity contract, and Emilio's C05.2M territory-pending resolution"
    depende_de:
      - S1.18
    recurso:
      - up to five isolated Pi clients and ephemeral test brokers
    encargo:
      pedido_contexto: Regresión integral Pi-first
      resultado_comportamiento: "The launch-to-attach-to-observe-to-stop chain passes with one and five clients.\n\nThe prolonged unattended run passes.\n\nBroker crash under traffic proves reconnection and idempotent recovery without promising in-flight messages.\n\nMore than five clients remains outside the initial claim until measured and the change stays within the planned scope."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación. El territorio es desconocido: el encargo permanece incompleto y no autoriza archivos, Cimientos ni escritura."
      referencias: "Autoridad original: decision 104, Engram observation 10008, approved Pi-first capacity contract, and Emilio's C05.2M territory-pending resolution. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S1.19. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
      incompleto: true
    decisiones:
      - tipo: escala
        pregunta: Which exact test files will own the Pi-first integration regression?
        evidencia: "The immutable S1.19 Area names test/integration/pi-first/** and test/host-adapters.test.mjs, but the candidate base contains no tracked exact file beneath the integration glob; Radar rejects patterns and directories, and the committed partition rejects unused rules."
        checkpoint: before S1.19 RED and the first Module
        opciones:
          - opcion: Prove the exact Pi-first integration test paths before implementation.
            consecuencia: S1.19 remains blocked without target territory until exact paths are proven.
          - opcion: Expand Radar to accept pattern territory.
            consecuencia: This would expand Radar beyond the approved compatibility contract and is rejected.
          - opcion: Invent or omit an exact integration file.
            consecuencia: This would fabricate or discard planned territory evidence and is rejected.
          - opcion: Remove or archive S1.19.
            consecuencia: This would discard an approved target Session and is rejected.
        clase: dependencias-o-evidencia-contradictorias
        alcanza: primer-modulo
    importacion_legacy:
      origen_commit: 43130ad40af06f3ed05671000719217bee74f0a5
      origen_ruta: openspec/plans/plan-1/STATUS.md
      origen_blob: 955820c97257921571cb3d2ac0122929586a2fae
      origen_encabezado: "## Sesión S1.19 — Regresión integral Pi-first"
      territorio_pendiente: true
  - {id: S1.20, entrega: {commit: 77c65d31e40de1992ceed2e7c4a39abf169d9a88}, historico: openspec/archive/sesiones/S1.20.md}
  - id: S2.9
    prioridad: torre-v2
    zona: enrolamiento
    cimientos:
      - bin/torre
      - test/console/cli.test.mjs
    resultado: Enrollment público canónico por CLI
    autoridad: "decision 104, Engram observation 10008, and delivered S8.3 contract"
    depende_de:
      []
    recurso:
      - registro central de proyectos y lock/escritura atómica ya propiedad de enrollProject
      - sin activación Tower ni lifecycle de hosts
    archivos:
      - bin/torre
      - enroll/index.mjs
      - test/console/cli.test.mjs
      - test/enroll/enroll.test.mjs
    encargo:
      pedido_contexto: Enrollment público canónico por CLI
      resultado_comportamiento: "torre enroll --repo <ruta> invoca el enrollProject existente y devuelve identidad/revisión del proyecto registrado sin duplicar su lógica.\n\nRepetir enrollment idéntico converge según el contrato existente; conflicto o layout inseguro falla cerrado antes de escribir.\n\ntorre on --repo <ruta> activa sólo proyectos ya registrados; uno no registrado no crea registro ni ACTIVE y explica el comando torre enroll.\n\ntorre enroll no activa la Torre, no inicia procesos y no muta worktrees.\n\nEl diff toca sólo Área."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación."
      referencias: "Autoridad original: decision 104, Engram observation 10008, and delivered S8.3 contract. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S2.9. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
    decisiones:
      - tipo: resuelta
        pregunta: What is the canonical public enrollment operation and its boundary with Tower activation?
        resolucion: Public canonical operation is torre enroll --repo <path> calling existing enrollProject; torre on --repo remains activation-only and rejects unregistered projects with enrollment guidance.
        autoridad: "decision 104, Engram observation 10008, and delivered S8.3 contract"
        clase: api-publica; contrato-visible-del-producto; seguridad-y-permisos
        falsificador: "The CLI duplicates or bypasses enrollment authority, torre on registers or creates ACTIVE for an unregistered project, or enrollment activates Tower, starts processes, or mutates worktrees."
        descartadas:
          - opcion: Implicit enrollment through torre on.
            razon: Activation must fail closed for an unregistered project and guide the user to explicit enrollment.
          - opcion: Duplicate enrollment implementation in the CLI.
            razon: "Delivered S8.3 enrollProject already owns identity, validation, preflight, and persistence."
          - opcion: Absence of an explicit public enrollment command.
            razon: The approved visible product contract explicitly requires torre enroll --repo <path>.
        contaminaba:
          - S9.7
      - tipo: derivable
        pregunta: How are CLI arguments translated to the existing request?
        criterio: "The CLI does not duplicate validation, identity, preflight, or persistence of enrollProject; any second implementation falsifies the derivation."
        autoridad: immutable S2.9 STATUS line 46 and delivered enrollProject S8.3 contract
        evidencia: "Delivered enrollProject contract, S8.3 evidence, and immutable S2.9 criteria."
        checkpoint: before T2.9.1.2
        opciones:
          - opcion: Parse --repo and call the existing enrollProject request unchanged.
            consecuencia: "One existing authority continues to own identity, validation, preflight, and persistence."
    importacion_legacy:
      origen_commit: 43130ad40af06f3ed05671000719217bee74f0a5
      origen_ruta: openspec/plans/plan-2/STATUS.md
      origen_blob: 9c6dbfd096d3fde475dd966da578cfcd577f0908
      origen_encabezado: "## Sesión 2.9 — Enrollment público canónico por CLI"
      territorio_pendiente: false
  - id: S2.10
    prioridad: torre-v3
    resultado: Enrollment desde el menú central
    autoridad: decision 104 and Engram 10008
    depende_de:
      - S2.9
    recurso:
      - menú central y registro de proyectos; serial con S2.9 por la operación canónica de enrollment
    encargo:
      pedido_contexto: Enrollment desde el menú central
      resultado_comportamiento: "El owner y los paths reales del menú quedan probados antes de editar.\n\nEl menú ofrece enrollment y delega a la operación canónica torre enroll --repo <ruta> sin reimplementar validación o persistencia.\n\nÉxito, conflicto y layout inseguro se presentan con resultado coherente con la CLI; enrollment no activa la Torre.\n\nEl diff toca sólo el Área real aprobado después de resolver el checkpoint."
      restricciones_decisiones: "Gentle AI desglosa, implementa y verifica mediante ODD; SDD sólo por solicitud humana explícita. Sólo los archivos declarados están autorizados; toda expansión requiere aprobación humana y compatibilidad fresca antes de escribir. Las decisiones estructuradas conservan su autoridad y se aplican sin duplicar aquí su prosa completa. Los nombres de archivo prospectivos delimitan autorización, no afirman existencia ni una implementación elegida y no conceden permiso de API pública; toda expansión futura requiere aprobación. El territorio es desconocido: el encargo permanece incompleto y no autoriza archivos, Cimientos ni escritura."
      referencias: "Autoridad original: decision 104 and Engram 10008. Línea base Git: openspec/plan.yaml@ebc2ffb840030f7266a207536134c057a82bec70, bloque de Sesión S2.10. La ruta y el desglose técnico legacy son sólo historia; no hay trailers Modulo: parciales alcanzables desde HEAD. Los registros nativos de ejecución quedan subordinados y no son autoridad de producto."
      incompleto: true
    decisiones:
      - tipo: escala
        pregunta: ¿Qué repositorio y path poseen el renderer/handler del menú central que debe ofrecer enrollment y cómo invoca la CLI canónica sin duplicar lógica?
        evidencia: "El screenshot aprobado existe, pero el renderer no fue localizado en este checkout."
        checkpoint: antes de RED y antes de nombrar cualquier path
        opciones:
          - opcion: Ubicar el owner real y agregar allí una entrada que llame torre enroll.
            consecuencia: Mantiene la UX híbrida aprobada.
          - opcion: Declarar que el menú vive fuera del producto y registrar su repositorio.
            consecuencia: "Cambia ownership, no el contrato."
          - opcion: No hacer nada.
            consecuencia: Deja incompleta la UX pública aprobada.
        clase: dependencias-o-evidencia-contradictorias
        alcanza: primer-modulo
    importacion_legacy:
      origen_commit: 43130ad40af06f3ed05671000719217bee74f0a5
      origen_ruta: openspec/plans/plan-2/STATUS.md
      origen_blob: 9c6dbfd096d3fde475dd966da578cfcd577f0908
      origen_encabezado: "## Sesión 2.10 — Enrollment desde el menú central"
      territorio_pendiente: true
