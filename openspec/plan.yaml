  - id: S155
    zona: metodo
    prioridad: metodo-v1
    resultado: >-
      Radar ofrece `radar etapa`, que calcula desde el dato del plan y la evidencia de Git qué
      etapas de la guía Chanks de 5 etapas están habilitadas para una Sesión, y calcula 🔵 EN
      CURSO desde una marca temporal fuera de plan.yaml en vez de dejarlo deliberadamente ausente.
    autoridad: >-
      Aprobación explícita de Emilio el 2026-09-24 en esta Conversación: Chanks pasa a ser una
      guía de etapas de 5 etapas (1 Definir, 2 Preparar, 3 Despachar, 4 Implementar y revisar =
      gentle-ai, 5 Entregar y cerrar). Análisis por tramos en el documento 'Chanks como guía de
      etapas — análisis por tramos' (claude.ai artifact 56421c44-de32-4b92-b4f7-6b428a6db555) y
      Engram topics chanks/stage-router-*.
    # S160 va primero por decisión de Emilio del 2026-09-24; comparte archivos de Radar con S155.
    depende_de:
      - S160
    cimientos: []
    recurso: []
    entrega:
      commit: 282cfceca77375c253ad6feee85559aef56d2387
    archivos:
      - agent-workflows/tools/radar/main.go
      - agent-workflows/tools/radar/state.go
      - agent-workflows/tools/radar/snapshot.go
      - agent-workflows/tools/radar/render.go
      - agent-workflows/tools/radar/roadmap.go
      - agent-workflows/tools/radar/faltan.go
      - agent-workflows/tools/radar/git.go
      - agent-workflows/tools/radar/etapa.go
      - agent-workflows/tools/radar/etapa_test.go
      - agent-workflows/tools/radar/state_test.go
      - agent-workflows/tools/radar/faltan_test.go
      - agent-workflows/tools/radar/render_test.go
      - agent-workflows/tools/radar/testdata/ROADMAP.golden.md
      - agent-workflows/tools/radar/testdata/faltan.golden.txt
    encargo:
      pedido_contexto: >-
        Chanks deja de mostrar 💪 en cada bloqueo y de exigir el clic de activación
        (chanks_request_activation + ctx.ui.confirm) que hoy vive en S153; en su lugar, un
        cerebro en Radar calcula qué etapa de la guía de 5 etapas corresponde a una Sesión y sólo
        se anuncia en las transiciones. Hoy state.go:29-31 deja 🔵 EN CURSO deliberadamente
        ausente porque es una marca de ejecución, no un dato de plan; esta Sesión le da esa marca
        un lugar fuera de plan.yaml. Esta Sesión construye el cerebro; no toca las skills que lo
        consumen ni la extensión de Pi, que son S157 y S159.
      resultado_comportamiento: >-
        `radar etapa <ID>` calcula, sin interpretar texto humano, el menú de etapas que la
        evidencia permite para una Sesión: sin Sesión para una idea suelta ofrece sólo la etapa 1
        (Definir); una Sesión con Encargo incompleto ofrece la etapa 2 (Preparar); LISTO ofrece
        la etapa 3 (Despachar); EN CURSO ofrece la etapa 4 (Implementar y revisar); un archivo
        odd/tasks/*.md con cada tarea marcada más una constancia de Intercom "listo para
        revisión" del worker ofrecen la etapa 5 (Entregar y cerrar). El modelo elige sólo entre
        las etapas que el comando ofrece; si ninguna corresponde, hace una sola pregunta y no
        adivina.

        🔵 EN CURSO se calcula a partir de una marca temporal por Sesión bajo el directorio común
        de Git (por ejemplo `.git/chanks/despachos/<ID>.json`), escrita por el despacho o por
        Main cuando toma una Sesión directamente, y borrada al cerrar la etapa 5; la marca nunca
        se escribe en plan.yaml. El resumen de retomar trabajo ofrece primero las Sesiones EN
        CURSO con marca vigente y después las LISTO. Una marca cuya rama o worktree ya no existe
        se reporta como huérfana en el resumen, sin borrarla automáticamente.

        Pruebas nuevas cubren el menú de las cinco etapas y el cálculo de EN CURSO, incluida una
        marca huérfana. `go test ./...` de Radar pasa completo y `radar check` sobre el plan
        vigente sigue sin errores.
      restricciones_decisiones: >-
        Gentle AI desglosa, implementa y verifica mediante ODD con TDD estricto; SDD sólo por
        solicitud humana explícita. Sólo los archivos declarados están autorizados; toda
        expansión requiere aprobación humana y compatibilidad fresca antes de escribir. S115
        reserva también check.go y check_test.go pero está PLANIFICADO detrás de S114 DIFERIDO:
        esta Sesión no toca ninguno de los dos. El cerebro calcula el menú; no decide por el
        humano ni reemplaza las preguntas de escalación existentes. Sumar el subcomando nuevo y
        mover el cálculo de EN CURSO fuera de state.go:29-31 se estimó inicialmente entre 600 y
        900 líneas de diff. El candidato portátil y sus regresiones alcanzaron aproximadamente
        1.250 líneas; Emilio amplió explícitamente la excepción a 1.250–1.350 líneas para el mismo
        commit coherente de S155 y autorizó sumar roadmap.go para que cada comando reutilice una
        sola observación de las marcas, tras una compatibilidad fresca sin solapamientos. La
        excepción no elimina pruebas, omite revisión ni autoriza por sí sola implementar o
        entregar. Al entregar se reinstala ~/.local/bin/radar para que el pre-push y las demás
        Sesiones usen la versión nueva; la reinstalación es un paso operativo, no un archivo del
        plan.
      referencias: >-
        state.go:29-31 (EN CURSO deliberadamente ausente). Corte Torre V1: Engram 11327 (Radar
        incluido en la Torre V1). Documento de diseño: 'Chanks como guía de etapas — análisis por
        tramos' (claude.ai artifact 56421c44-de32-4b92-b4f7-6b428a6db555) y Engram topics
        chanks/stage-router-*. S154 (agent-workflows/tools/radar/check.go, render.go, faltan.go)
        como antecedente inmediato del mismo territorio. Revalidar contra el código vigente antes
        de implementar.
    decisiones:
      - tipo: resuelta
        pregunta: "¿Quién decide la etapa que corresponde a una Sesión: el modelo interpretando texto o un menú determinista?"
        resolucion: Un menú determinista calculado por Radar desde el dato y Git; el modelo elige sólo entre las opciones que el menú ofrece y pregunta una vez si ninguna corresponde.
        autoridad: "Aprobación explícita de Emilio el 2026-09-24 en esta Conversación (documento 'Chanks como guía de etapas — análisis por tramos', artifact 56421c44-de32-4b92-b4f7-6b428a6db555)."
        clase: contrato-visible-del-producto
        falsificador: El modelo asigna una etapa sin que el menú la ofrezca, o dos criterios del menú se solapan sin desempate determinista.
        descartadas:
          - opcion: Dejar que el modelo interprete libremente en qué etapa está una Sesión.
            razon: Pierde verificabilidad y repite el problema que motivó reemplazar el clic de activación.
        contaminaba: [S155, S157, S159]
      - tipo: resuelta
        pregunta: "¿Dónde vive la marca de 🔵 EN CURSO y quién la escribe y la borra?"
        resolucion: Una marca temporal por Sesión en el directorio común de Git, nunca en plan.yaml; la escribe el despacho o Main al tomar la Sesión, y se borra al cerrar la etapa 5. Una marca huérfana se reporta, no se borra sola.
        autoridad: Aprobación explícita de Emilio el 2026-09-24 en esta Conversación.
        clase: contrato-visible-del-producto
        falsificador: EN CURSO se escribe en plan.yaml, o Radar borra una marca huérfana sin que el humano lo pida.
        descartadas:
          - opcion: Seguir sin EN CURSO calculado, como hoy en state.go:29-31.
            razon: Main no puede distinguir una Sesión realmente en curso de una LISTO al ofrecer el resumen de retomar.
        contaminaba: [S155, S157, S159]
      - tipo: resuelta
        pregunta: "¿Cómo se trata el tamaño de S155, que supera la referencia de 400 líneas de diff?"
        resolucion: Un solo commit coherente con excepción ampliada a aproximadamente 1.250–1.350 líneas para S155; conserva pruebas, revisión proporcional y reversibilidad de esa unidad. La misma aprobación suma roadmap.go al alcance exacto para que el comando use una sola observación de marcas.
        autoridad: Aprobación inicial de Emilio el 2026-09-24 y ampliación explícita en esta Conversación después de observar el candidato portátil y la compatibilidad fresca.
        clase: expansion-de-alcance
        falsificador: La excepción se usa para agregar archivos fuera de los declarados, saltear pruebas o revisión, o mezclar resultados ajenos a S155.
        descartadas:
          - opcion: Commits secuenciales verificables.
            razon: El cerebro y su cálculo de EN CURSO forman una unidad coherente; partirla deja un menú a medias.
        contaminaba: [S155]
  - id: S156
    zona: metodo
