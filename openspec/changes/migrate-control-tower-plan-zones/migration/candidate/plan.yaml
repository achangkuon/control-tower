  - id: S3.2
    resultado: Change D Global/project Policy/Jornada
    autoridad: role-routed-continuation tasks, REQUIREMENTS §15.3/§22, AGENTS.md delivery policy, and maintainer resolutions
    depende_de: [S3.1]
    recurso: [Main filesystem CAS in main-store/store.mjs; no SQLite migration, db-writer, or delivery token]
