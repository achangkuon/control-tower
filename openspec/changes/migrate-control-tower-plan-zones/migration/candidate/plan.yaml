        evidencia: Contrato inmutable de S3.2.
        checkpoint: antes de M3.2.3
        opciones:
          - opcion: Leer una única fuente en AGENTS.md.
            consecuencia: No existen dos fuentes del árbol que respondan la misma pregunta de política.
      - tipo: derivable
        pregunta: ¿Qué gana cuando la política global y la del proyecto difieren?
        criterio: El valor más restrictivo de los dos; la herencia acota y nunca amplía.
        autoridad: floors de seguridad de d232fdf
        evidencia: Contrato inmutable de S3.2.
        checkpoint: antes de M3.2.2
        opciones:
          - opcion: Aplicar intersección restrictiva.
            consecuencia: Una política local más permisiva no vence el floor global.
      - tipo: resuelta
        pregunta: ¿Puede una excepción acotada relajar un floor de seguridad?
        resolucion: No; ninguno de los cinco floors puede relajarse por configuración ni excepción.
        autoridad: decisión del maintainer del 2026-08-04 registrada en master-index
        falsificador: Cualquier ruta en la que una excepción registrada habilite una operación que el floor prohíbe.
        descartadas:
          - opcion: Permitir excepciones sobre los floors.
            razon: Rompería inmutabilidad, autoridad única de Main, no autoasignación, no mutación temprana o ledger append-only.
        contaminaba: [S5.1, S5.2, S7.1]
      - tipo: resuelta
        pregunta: ¿Qué queda registrado en la auditoría de una excepción?
        resolucion: Un evento de autoridad §15.3 con identidad, objetivo, regla cerrada, alcance verificable, otorgante, autorización, vigencia, resultado y cadena de digests por entrega; la justificación se conserva sólo como digest y puntero externo.
        autoridad: REQUIREMENTS §15.3 y §22 y decisión del maintainer del 2026-08-04
        falsificador: Un registro que no permita reconstruir quién otorgó la excepción y contra qué revisión de política.
        descartadas:
          - opcion: Persistir justificación como texto libre.
            razon: Puede filtrar secretos y vuelve irreconciliable el borrado de §22 con el ledger append-only.
          - opcion: Encadenar hashes por proyecto.
            razon: Serializaría la punta contra CAS; la cadena aprobada es por entrega.
        contaminaba: [S7.1]
      - tipo: derivable
        pregunta: ¿Qué reglas pueden figurar en excepted_rule?
        criterio: Exactamente effective_limits, delivery.shape, delivery.target_branch, planning.horizon_ceiling, documentation_close.*, allowed_operations y allowed_hosts; ningún floor.
        autoridad: resolución de floors de S3.2
        evidencia: Contrato inmutable de S3.2.
        checkpoint: antes de M3.2.3
        opciones:
          - opcion: Enumerar sólo la superficie configurable.
            consecuencia: Ningún valor del enum puede nombrar un floor.
