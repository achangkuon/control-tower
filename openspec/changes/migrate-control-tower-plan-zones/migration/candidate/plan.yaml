      territorio_pendiente: false
    modulos:
      - id: M1.14.1
        resultado: "Polling y comportamiento de wake"
        rutas: [hosts/loop.mjs, test/polling.test.mjs]
        tareas:
          - id: T1.14.1.1
            accion: "Add deterministic RED cases for throttle, fresh peek, one in-flight wake, accounting, wake failures, and pending preservation."
            resultado: "The complete polling and wake safety boundary is captured before implementation."
            criterios: ["The canonical RED cases cover throttle, scheduling, wake serialization, failures, and non-consumption."]
          - id: T1.14.1.2
            accion: "Add validated policy, monotonic accounting, throttle scheduling, fresh peek, serialized wake, and safe tracing."
            resultado: "The GREEN polling and wake cases pass without consumption or claim behavior."
            criterios: ["All canonical GREEN cases pass."]
          - id: T1.14.1.3
            accion: "Add exact retry, re-peek, exhaustion, settle, retained-window, and malformed-clock triangulation cases."
            resultado: "Retry and pause behavior remains deterministic and fail-closed."
            criterios: ["All canonical TRIANGULATE cases pass with exact retry delays."]
          - id: T1.14.1.4
            accion: "Remove duplicate scheduling and accounting paths and stabilize fake-scheduler helpers."
            resultado: "Opaque descriptors and non-consuming behavior are preserved."
            criterios: ["Refactoring preserves all focused behavior."]
          - id: T1.14.1.5
            accion: "Run focused polling tests and syntax validation and record evidence and rollback."
            resultado: "The delivered polling bytes pass focused and complete verification with bounded rollback."
            criterios: ["Focused tests and syntax validation pass; runtime harness is correctly recorded as N/A."]
