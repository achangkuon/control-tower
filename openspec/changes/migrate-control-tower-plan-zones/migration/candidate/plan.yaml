  - id: S4.6
    resultado: Herdr deja de ser prerrequisito bloqueante de la instalación y deja de participar del camino crítico de lanzamiento; sobrevive únicamente como launcher reemplazable del panel de vista, que ya degrada solo
    autoridad: decisiones 39 y 58-61, más el criterio del maintainer del 2026-08-21 de depender lo menos posible y, si no se puede, soportar
    depende_de: []
    recurso: [contrato RUNTIME_PAYLOAD_FILES; sin DB ni migraciones]
    criterios:
      - Una instalación con Herdr ausente, o con una versión distinta de 0.8.0, completa y deja la vista pública sólo DEGRADED, sin comando, helper, credencial, secreto ni instrucción manual; la falla interna de la vista opcional conserva disponible la ruta autenticada de attach
      - El adaptador de custodia de S4.2 no existe en el árbol, y ninguna ruta puede emitir CT_LAUNCH_REJECTED por custodia de Herdr
      - HERDR_RUNTIME deja de declarar capacidades que el producto no usa
      - El fijado por bytes de OpenCode permanece intacto y verificado por su test
      - "RUNTIME_PAYLOAD_FILES queda consistente: ningún miembro sin llamador"
      - bun test no introduce fallos nuevos; el diff no toca el Prohibido
    decisiones:
      - tipo: derivable
        pregunta: ¿Qué reemplaza a la comparación de versión?
        criterio: Nada bloqueante; Herdr pasa a dependencia opcional y degradable, su ausencia produce una vista pública sólo DEGRADED, nunca una instalación fallida ni una respuesta con comando o instrucción manual, y la ruta autenticada de attach permanece interna y disponible.
        autoridad: decisión 39, endurecida después por S4.7, y criterio del maintainer del 2026-08-21 de depender lo menos posible y, si no se puede, soportar
        evidencia: install/lifecycle.mjs comparaba literalmente contra herdr 0.8.0 y hosts/opencode-view.mjs ya degradaba ante ausencia de Herdr.
        checkpoint: antes de M4.6.1
        opciones:
          - opcion: Convertir Herdr en dependencia opcional y degradable sin bloqueo de instalación.
            consecuencia: La ausencia o versión distinta conserva el lanzamiento y limita la vista pública a DEGRADED sin filtrar instrucciones.
        falsificador: Una instalación falla por la versión o ausencia de Herdr, o una salida pública expone comando, helper, credencial, secreto o instrucción manual.
      - tipo: derivable
        pregunta: ¿Qué pasa con hosts/herdr.mjs?
        criterio: Conserva sólo lo que usa la vista; si al retirar la custodia de S4.2 queda sin superficie propia, se retira y sus puertos se pliegan en opencode-view.mjs; se decide midiendo, no por adelantado.
        autoridad: decisión 61 y medición de callers del contrato S4.6
        evidencia: El adaptador legado estaba construido y devuelto por production-provider.mjs pero nadie lo invocaba dentro ni fuera del archivo.
        checkpoint: durante M4.6.1 antes del REFACTOR
        opciones:
          - opcion: Retirarlo sólo si queda sin caller después de eliminar la custodia legacy.
            consecuencia: El payload no conserva un archivo sin superficie propia y la vista mantiene únicamente sus puertos necesarios.
        falsificador: Dejar en el payload un archivo sin llamador.
      - tipo: derivable
        pregunta: ¿Se modifica el fijado de OpenCode por bytes?
        criterio: El pin por descriptor abierto que garantiza que los bytes verificados sean los ejecutados permanece intacto; cualquier debilitamiento falsifica la derivación.
        autoridad: production-provider.mjs:152 y auditoría P8 confirmada por el contrato S4.6
        evidencia: La verificación por descriptor abierto es una frontera de seguridad independiente del lock literal de versión de Herdr.
        checkpoint: antes de cualquier cambio en production-provider.mjs
        opciones:
          - opcion: Preservar íntegramente el fijado de OpenCode por bytes.
            consecuencia: Se retira el lock bloqueante de Herdr sin debilitar la identidad ejecutable de OpenCode.
        falsificador: Cualquier diff debilita la verificación de los bytes de OpenCode ejecutados.
    entrega:
