      - "ENMENDADO por la decisión 41 (maintainer, 2026-08-18). Al retomar después de integrar S5.11 y S5.12, el SDD prueba antes de tasks/apply que el flujo real suministra evidencia canónica producer-owned de captura y reconciliación VALID — esa mitad PASA en test/main-store.test.mjs:257-272. La cláusula de preservación del falsificador fallido se cierra como pérdida aceptada y documentada: el design.md de SHA-256 a349747ceb0580ef700155499125c89a025232e85ec64677d65d8e8d0bff29b1 ya no existe y Engram 8604 fue upserteado al diseño reconciliado. Se perdió el veredicto negativo del primer intento de diseño; sobrevive el hallazgo de fase spec en Engram 8602 y la brecha original documentada en las decisiones 20 y 21, que motivó enumerar S5.11 y S5.12. La causa raíz —un topic_key mutable— quedó registrada como regla del repositorio."
