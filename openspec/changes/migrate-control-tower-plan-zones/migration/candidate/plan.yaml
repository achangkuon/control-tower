        criterio: Cada referencia contiene OID completo de commit y su árbol resuelto explícitamente.
        autoridad: matriz Commit/Git de autonomous-v2-checkpointed-delivery
        evidencia: Contrato inmutable de S3.1 líneas 58-63.
        checkpoint: antes de T3.1.1.2
