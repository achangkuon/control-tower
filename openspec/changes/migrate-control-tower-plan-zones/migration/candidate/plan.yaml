        opciones:
          - opcion: Centinela separado fuera del repositorio supervisado.
            consecuencia: Satisface «supervisar sin armar» con la superficie mínima y fija el Área histórica.
          - opcion: Modo nuevo de `ACTIVE`.
            consecuencia: 'Rechazada: seguiría escribiendo el marcador dentro del repositorio supervisado y abortaría los tests P0/congelaría el relay.'
          - opcion: Supervisión externa al repositorio.
            consecuencia: 'Rechazada: resuelve la brecha al precio de la arquitectura más grande de las tres.'
        falsificador: 'Cualquier ruta de supervisión que escriba un marcador dentro del repositorio supervisado.'
        descartadas: []
        contaminaba: [S10.2, S10.1, remote-control, 'los dos tests P0 de test/migration.test.mjs']
      - tipo: resuelta
        pregunta: '¿`remote-control` conserva intacto su interlock o se autoriza un cambio explícito para reconocer la nueva supervisión?'
        resolucion: 'El interlock se conserva intacto; con el centinela fuera del repositorio nada lo arma, la condición sigue verdadera y no hay líneas de `remote-control`.'
        autoridad: 'Decisión 27 del maintainer, 2026-08-14; STATUS inmutable S10.2.'
        clase: dependencias-o-evidencia-contradictorias; contrato-visible-del-producto; seguridad-y-permisos
        evidencia: '`src/tower-guard.js:226` define `allowed = remote && off`; la decisión aceptada del 2026-08-08 dice que el interlock no se retira.'
        checkpoint: antes de M10.2.1
