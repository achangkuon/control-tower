        contaminaba: [S5.5, S7.1]
      - tipo: resuelta
        pregunta: ¿Los dos residuales de S5.10 impiden el cierre?
        resolucion: Se aceptan explícitamente sin bloquear; el acoplamiento al reloj de expiración de approvedAuthorizationFor y la falta de verificación de estado aún no respondido para ASSUMPTION permanecen documentados, sin afirmar que estén corregidos.
        autoridad: Decisión 46 del maintainer del 2026-08-19.
        clase: seguridad-y-permisos; dependencias-o-evidencia-contradictorias
        falsificador: Los residuales se presentan como corregidos, se omiten, o se usan para afirmar que ASSUMPTION verifica que la decisión sigue sin respuesta.
        descartadas:
