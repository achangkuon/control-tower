  - id: S4.14
    resultado: El registro neutral confirma sincrónicamente la actualidad del ocupante exacto inmediatamente antes de publicar ownership, sin transferir autoridad ni alterar la compatibilidad cuando el guard está ausente.
    autoridad: decisión 98 / Emilio Engram 9773; planificación corregida Engram 9774; entrega integrada probada por Engram 10292 y reflogs master/origin
    depende_de: [S4.13]
    recurso: [registro neutral, adquisición unpublished exacta]
    criterios:
      - Tras acquire, validateUnpublished async y el safety recheck local, el guard corre inmediatamente antes de publish y en el mismo stack.
      - El guard recibe metadata neutral exacta y congelada de worktree, proceso e incarnation; no recibe close ni vocabulario de host.
      - Sólo el booleano primitivo true permite publicar inmediatamente la adquisición exacta.
      - False, throw, todo no booleano y todo thenable fallan sin await ni asimilación y terminan en exact-close o cuarentena.
      - Guard ausente conserva compatibilidad; no existe ruta alternativa que omita el recheck local vigente.
      - Un proceso reemplazado en el mismo worktree no puede publicar ownership del ocupante anterior.
      - F1 permanece en S9.4; retorna el cierre exacto al registro antes de validateUnpublished; Proxy/accessors hostiles y producer no confiable quedan fuera.
      - El diff toca exactamente los tres paths del contrato histórico, registra RED/GREEN/alternos y suma 146 líneas authored, dentro del límite duro de 400.
    decisiones:
      - tipo: resuelta
        pregunta: ¿Cómo confirma el registro neutral que la adquisición todavía corresponde al ocupante exacto inmediatamente antes de publicar ownership?
        resolucion: El registro neutral invoca un guard sincrónico, opcional y caller-neutral validateCurrentBeforePublish inmediatamente antes de publicar ownership. Después de adquirir, completar validateUnpublished async y repetir el safety recheck local, entrega metadata neutral exacta y congelada de worktree, proceso e incarnation. Sólo true primitivo permite publicar en el mismo stack; false, throw, valores no booleanos y thenables fallan sin await ni asimilación y terminan en exact-close o cuarentena explícita. Guard ausente conserva compatibilidad.
        autoridad: Emilio, Engram 9773; planificación corregida Engram 9774
        evidencia: decisión 98; frontera entregada por S4.13 contra master/origin/master@3f80cebcb23ee190795e9914f127f886835e9dd3; integración daf7e0e7af4122417ce2bec8a48a11c65a40f23c y reconciliación c2fb6399ee1332821663735d02833f78b9371402 probadas por reflogs master/origin y Engram 10292
        checkpoint: antes de M4.14.1
        opciones:
          - opcion: Invocar el guard sincrónico final-currentness inmediatamente antes de publish.
            consecuencia: Sólo el ocupante exacto y actual puede publicar; todo resultado distinto de true falla con exact-close o cuarentena.
        falsificador: Un proceso reemplazado en el mismo worktree publica broker; un valor distinto de true llega a publish; el guard se espera o asimila; la metadata cambia durante la llamada; el hook observa cierre o vocabulario de host; o S4.14 modifica paths fuera de su contrato.
        clase: contrato-visible-del-producto; api-publica; seguridad-y-permisos; expansion-de-alcance; dependencias-o-evidencia-contradictorias
        descartadas:
          - opcion: Usar un guard async o thenable.
            razon: Introduce await o asimilación entre el recheck final y publish.
          - opcion: No añadir guard alguno.
            razon: Permite que un ocupante reemplazado sobreviva al recheck local y publique ownership viejo.
          - opcion: Especializar el guard por host.
            razon: Rompe la frontera neutral y agrega vocabulario de host.
          - opcion: Exponer o transferir close.
            razon: Transfiere autoridad fuera del registro neutral.
          - opcion: Plegar esta garantía dentro de S9.4.
            razon: Mezcla la actualidad neutral final con la adquisición host-specific downstream.
        contaminaba: [S4.14, M4.14.1, S9.4]
    entrega:
