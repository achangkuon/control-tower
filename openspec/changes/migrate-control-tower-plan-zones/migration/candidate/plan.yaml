  - id: S4.3
    resultado: Inspección, liveness y rehidratación segura
    autoridad: decisión 37, decisión 43 y REQUIREMENTS §14.3-§14.4
    depende_de: [S4.5]
    recurso: [evidencia backend/proceso/root-session; sin DB, migraciones ni token de entrega]
    criterios:
      - inspect, health y heartbeat observan sólo backend, proceso y raíz ligados al assignment vigente
      - Los umbrales SUSPECTED/UNAVAILABLE y stop proof canónico pasan con bindings exactos
      - Rehidratación restaura una proyección, nunca crea/reemplaza raíz ni depende de pane/TUI/Herdr
      - Vista ausente no cambia health y el diff queda dentro del Área ampliada por la decisión 43
    decisiones:
      - tipo: derivable
        pregunta: ¿Qué umbrales clasifican el liveness del host?
        criterio: Tres heartbeats ausentes clasifican SUSPECTED; 60 segundos más un health probe fallido clasifican UNAVAILABLE. Otro umbral falsifica la derivación.
        autoridad: REQUIREMENTS §14.3
        evidencia: openspec/specs/sdd-tower-implementation-v1-requirements.md §14.3
        checkpoint: antes de M4.3.1
        opciones:
          - opcion: Aplicar exactamente los umbrales de §14.3.
            consecuencia: Liveness se deriva del contrato aprobado sin observar la vista.
      - tipo: derivable
        pregunta: ¿Qué estado puede rehidratarse?
        criterio: Sólo se rehidrata la proyección de backend, proceso, root, assignment y epoch exactos; cualquier estado ajeno que reaparezca activo falsifica la derivación.
        autoridad: decisión 37 y S4.1
        evidencia: STATUS inmutable líneas 374-375 y binding Main-owned entregado
        checkpoint: antes de M4.3.2
        opciones:
          - opcion: Restaurar únicamente la proyección ligada exacta.
            consecuencia: La rehidratación no crea autoridad ni reemplaza la raíz.
      - tipo: resuelta
        pregunta: ¿Cómo se impide que una recovery-proof del predecesor ligue contra el host vivo después de release y rebinding?
        resolucion: recovery-proof-v1 gana un host_epoch requerido y el binder de stop proof rechaza cualquier epoch distinto del ligado.
        autoridad: decisión 43 del maintainer, 2026-08-19
        clase: api-publica; dependencias-o-evidencia-contradictorias
        falsificador: Una prueba de otro epoch liga, o una sin host_epoch valida.
        descartadas:
          - opcion: Achicar el record devuelto a lo estrictamente probado.
            razon: Dejaba a S4.4 sin cómo cumplir REQUIREMENTS §14.4 paso 3.
          - opcion: Aceptar frescura aserida por el llamador.
            razon: La autoridad caller-provided está prohibida en toda la base.
        contaminaba: [S4.3, S4.4, S7.1]
