      - tipo: resuelta
        pregunta: '¿La supervisión sin armar el repositorio supervisado se expresa como un modo nuevo del centinela, un centinela separado o supervisión externa al repositorio?'
        resolucion: 'Centinela separado fuera del repositorio supervisado, bajo `~/.local/state/control-tower/supervision/<project-id>`.'
        autoridad: 'Decisión 26 del maintainer, 2026-08-14; STATUS inmutable S10.2.'
        clase: contrato-visible-del-producto; seguridad-y-permisos
        evidencia: 'Los dos tests P0 de control-tower abortan con `ACTIVE`, mientras el sellado exige supervisión viva; `remote-control` congela su relay cuando la Torre está armada.'
