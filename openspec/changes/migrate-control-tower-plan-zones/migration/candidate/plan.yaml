  - id: S4.7
    resultado: La raíz Main-owned exacta admite los bytes exactos del brief antes de éxito; la vista pública actual permanece DEGRADED con una envolvente mínima no ejecutable y el helper autenticado permanece privado
    autoridad: decisiones 65-68 y 76-77 del maintainer; Engram 9506/9507 corroborado por autoridad trackeada; entrega secuencial 13e3ec76, 429f2eab y 3b981efdcf3f68c2dc295ae056f10c04914cfc56
    depende_de: [S4.5]
    recurso: [namespace efímero owner-only por backend para credencial/ref/proof, proceso, puerto loopback, root y pane exactos del worktree; sin DB, migraciones ni token de entrega]
    criterios:
      - root_session_id y bytes del brief exactos quedan admitidos; 4xx/5xx/timeout/envelope ambiguo o root/brief distinto fallan cerrado
      - Éxito no espera completion, output ni primer token del modelo
      - Ningún secreto aparece en argv, comando de proceso, log, JSON, mensaje, fallback, binding, copy/paste ni fuera del namespace owner-only
      - La vista pública actual permanece siempre DEGRADED; no existe branch ATTACHED, ack del caller ni composición pane/auth/liveness como prueba
      - 'La respuesta pública agrega sólo view: { status: "DEGRADED", code: "CT_VIEW_UNVERIFIED", retryable: true }, preserva backend/root y no publica el helper'
      - El helper prueba conexión, rechaza ref stale/foreign/replay y revoca al detener
      - OpenCode/package/lock permanecen sin cambios; focused y suite completa pasan sobre baseline reconciliada
    decisiones:
      - tipo: resuelta
        pregunta: ¿El launch cierra al crear la raíz, al admitir el brief o al observar salida del modelo?
        resolucion: El éxito exige que la raíz Main-owned exacta acepte el brief aprobado exacto mediante admisión asíncrona; no espera que termine ni el primer token del modelo, y cualquier 4xx/5xx, timeout o envelope ambiguo falla cerrado.
        autoridad: decisión 65 del maintainer del 2026-08-25
        clase: contrato-visible-del-producto
        falsificador: El launch declara éxito antes de la admisión exacta de raíz y bytes del brief, acepta 4xx/5xx, timeout o envelope ambiguo, o espera completion, output o primer token.
        descartadas:
          - opcion: Cerrar con la creación sola de la raíz.
            razon: Admite falso éxito antes de que la raíz acepte el brief aprobado exacto.
          - opcion: Esperar output o el primer token del modelo.
            razon: Confunde admisión con ejecución.
        contaminaba: [M4.7.1, S4.7, S4.4, S7.1]
      - tipo: resuelta
        pregunta: ¿Cómo recibe la vista la credencial y qué evidencia permite declarar attach?
        resolucion: El secreto vive sólo en un namespace local efímero owner-only por backend; la vista entrega un ref opaco al helper seguro privado y ATTACHED requeriría prueba autenticada positiva ligada al backend, raíz, worktree y pane exactos.
        autoridad: decisión 66 del maintainer del 2026-08-25
        clase: seguridad-y-permisos; contrato-visible-del-producto
        falsificador: El secreto aparece en argv, logs, mensajes, fallback, binding o copy/paste, o pane creado, helper autenticado o liveness se aceptan solos o compuestos como prueba suficiente de ATTACHED.
        descartadas:
          - opcion: Incluir el secreto en comando o texto visible.
            razon: Expone autoridad fuera del namespace owner-only.
          - opcion: Tratar el pane creado como evidencia suficiente.
            razon: La creación del pane no prueba attach autenticado al backend, raíz, worktree y pane exactos.
        contaminaba: [M4.7.2, M4.7.3, S4.7, S4.4, S7.1]
      - tipo: resuelta
        pregunta: ¿La falla preexistente de test/install/launch-worker-cli.test.mjs:51 pertenece a S4.7?
        resolucion: Primero se reproduce; sólo si pertenece al mismo camino de launch S4.7 puede corregirla dentro de su Área y presupuesto, y si es ajena se detiene con evidencia para otro owner.
        autoridad: decisión 67 del maintainer del 2026-08-25
        clase: expansion-de-alcance; dependencias-o-evidencia-contradictorias
        falsificador: Se normaliza una falla no relacionada, se modifica un path fuera del Área o no se detiene ante evidencia de un owner separado.
        descartadas:
          - opcion: Corregirla sin reproducir ni probar que comparte el camino de launch.
            razon: Expandiría alcance y normalizaría una falla potencialmente ajena.
          - opcion: Ignorarla aunque reproduzca el mismo camino de launch.
            razon: Dejaría sin resolver una contradicción dentro del propio boundary de S4.7.
        contaminaba: [M4.7.1, S4.7]
      - tipo: resuelta
        pregunta: ¿Cuándo se retiran el pin Herdr y el drift entre OpenCode CLI, plugin y SDK?
        resolucion: Herdr 0.8.0 se conserva hasta S4.6, que retira pin y custodia sin adoptar 0.8.2; OpenCode CLI 1.18.23 y plugin/SDK 1.18.13 se conservan hasta la matriz real de S4.8 y sólo se alinean juntos si toda la matriz pasa.
        autoridad: decisión 68 del maintainer del 2026-08-25
        clase: dependencias-o-evidencia-contradictorias; seguridad-y-permisos
        falsificador: Se adopta Herdr 0.8.2 antes de la prueba guardada, se alinean paquetes por número o mocks, o una matriz fallida deja drift.
        descartadas:
          - opcion: Alinear por número de versión o evidencia simulada.
            razon: No prueba compatibilidad del runtime real ni conserva rollback seguro.
        contaminaba: [S4.6, S4.8, S4.9]
      - tipo: resuelta
        pregunta: ¿Puede la vista OpenCode/Herdr actual declarar ATTACHED componiendo pane, autenticación y liveness?
        resolucion: La vista actual siempre informa DEGRADED; ATTACHED queda reservado hasta una prueba futura real, falsificable y producer-owned ligada al backend, raíz, worktree y pane exactos que sólo S4.8/S4.9 pueden descubrir.
        autoridad: decisión 76 del maintainer; Engram 9506 corroborado por openspec/plans/decision-register.md
        clase: contrato-visible-del-producto; seguridad-y-permisos
        falsificador: El runtime actual emite ATTACHED, acepta un ack del caller, o compone pane, autenticación y liveness como prueba positiva.
        descartadas:
          - opcion: Simular ATTACHED con pane creado, helper autenticado y liveness.
            razon: Son observaciones pasivas del caller y no una prueba producer-owned de attach.
          - opcion: Aceptar un ack controlado por el caller.
            razon: Una assertion del caller no prueba la relación exacta con backend, raíz, worktree y pane.
        contaminaba: [M4.7.3]
      - tipo: resuelta
        pregunta: ¿Qué forma pública tiene la degradación actual y qué autoridad concede retryable?
        resolucion: 'La respuesta conserva la identidad existente de backend/root y agrega únicamente view: { status: "DEGRADED", code: "CT_VIEW_UNVERIFIED", retryable: true }; retryable es declarativo, no ejecuta ni concede autoridad, y el helper privado sigue siendo la única ruta de ejecución.'
        autoridad: decisión 77 del maintainer; Engram 9507 corroborado por openspec/plans/decision-register.md
        clase: contrato-visible-del-producto; seguridad-y-permisos
        falsificador: La respuesta agrega pane_id, comando, ref del helper, ref de credencial, secreto o copy/paste, convierte retryable en ejecución, o publica una segunda ruta al helper.
        descartadas:
          - opcion: Publicar instrucciones ejecutables, helper o credenciales para reintentar.
            razon: Filtraría una ruta privada y crearía una segunda autoridad.
          - opcion: Hacer que retryable ejecute el reintento.
            razon: El campo expresa posibilidad y no concede autoridad de ejecución.
        contaminaba: [M4.7.3]
    entrega: {commit: 3b981efdcf3f68c2dc295ae056f10c04914cfc56}
    importacion_legacy:
