  - id: S1.14
    zona: hosts
    cimientos: [test/polling.test.mjs]
    resultado: "Polling y wake safety"
    autoridad: openspec/changes/p7-host-neutral-loop-opencode-adapter/tasks.md
    depende_de: [S1.13]
    criterios:
      - Throttle is evaluated before every fresh non-consuming peek and the monotonic window reopens exactly when required.
      - One wake is in flight; retries occur at 1000, 2000, and 4000 ms; the fourth failure exhausts without inventing work.
      - Successful wake pauses in AWAITING_SETTLE and invalid clock or scheduler input pauses before storage access.
      - Focused polling tests, syntax validation, and the complete suite pass over the delivered bytes.
    decisiones: []
    ruta:
      propuesta: direct
      autoridad: openspec/changes/p7-host-neutral-loop-opencode-adapter/tasks.md
    entrega:
      commit: 9886af9ee289d78a35b404b06351f930ecb43309
