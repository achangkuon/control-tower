  - id: S4.2
    resultado: Lanzamiento visible de raíz OpenCode
    autoridad: decisión de rebase del maintainer 2026-08-17; decisión 36 del 2026-08-18; autoridad actual del maintainer corroborada por Engram 10281
    depende_de: [S4.1, S1.16]
    recurso: [panel Herdr interno y una línea OpenCode por project_id]
    criterios:
      - Main consume una binding canónica y crea un panel Herdr con una raíz OpenCode nueva en el worktree asignado.
      - La raíz usa gentle-orchestrator, recibe el brief aprobado y expone custodia exacta de pane, terminal y session_id.
      - Un subagente nativo no puede reemplazar, reutilizar ni modificar el panel, identidad o estado de la raíz; el bootstrap plugin fue removido.
      - Binding/epoch/runtime inválidos, respuestas Herdr ambiguas o ajenas, IDs option-shaped y session_id fuera de ^ses_[A-Za-z0-9]{26}$ fallan cerrado.
      - El composition root productivo liga una vez los puertos de S4.1; provider ausente, inválido o sustituible falla antes de lanzar o mutar journal.
      - Installer/payload fijan Herdr 0.8.0 y OpenCode por identidad/hash/stat; el preflight Linux/WSL ejecuta descriptores /proc/self/fd/3 con ambiente, tiempo y salida acotados, sin exigir contract agent-root-observation.
      - El candidato y sus pruebas tocan sólo Área; S4.3 y S4.4 conservan sus paths y comportamiento.
    decisiones:
      - tipo: resuelta
        pregunta: ¿Cuál es el límite empaquetado de torre?
        resolucion: The productive launcher runs only the installed torre runtime; caller inputs do not select core, lifecycle, or executable.
        autoridad: resolución histórica del maintainer preservada en S4.2 y aprobación actual corroborada por Engram 10281
        clase: seguridad-y-permisos
        falsificador: Falsified if caller input selects core, lifecycle, or executable.
        descartadas:
          - opcion: Caller-selectable components.
            razon: Descartada por la aprobación actual del maintainer.
        contaminaba: [S4.2, S4.3]
      - tipo: resuelta
        pregunta: ¿Cómo se representa el launch binding dedicado?
        resolucion: Main issues one dedicated opaque launch record; the consumer accepts no caller-fabricated identity, epoch, or location.
        autoridad: resolución histórica del maintainer preservada en S4.2 y aprobación actual corroborada por Engram 10281
        clase: seguridad-y-permisos
        falsificador: Falsified if identity, epoch, or location not issued by Main is accepted.
        descartadas:
          - opcion: Caller-built or reconstructed bindings.
            razon: Descartada por la aprobación actual del maintainer.
        contaminaba: [S4.2, S4.3]
      - tipo: resuelta
        pregunta: ¿Cómo se resuelve el provider empaquetado?
        resolucion: The Herdr/OpenCode provider is packaged with torre, deterministic, and resolved only from the installed runtime; --request-ref remains opaque.
        autoridad: resolución histórica del maintainer preservada en S4.2 y aprobación actual corroborada por Engram 10281
        clase: seguridad-y-permisos
        falsificador: Falsified if request, environment, or PATH changes provider or runtime.
        descartadas:
          - opcion: External or caller-selectable provider.
            razon: Descartada por la aprobación actual del maintainer.
        contaminaba: [S4.2]
      - tipo: resuelta
        pregunta: ¿Dónde queda la assignment-location canónica?
        resolucion: Main persists and validates the canonical assignment worktree and fence path before issuing or consuming a binding.
        autoridad: resolución histórica del maintainer preservada en S4.2 y aprobación actual corroborada por Engram 10281
        clase: seguridad-y-permisos
        falsificador: Falsified if a worktree or fence differing from the persisted canonical assignment is accepted.
        descartadas:
          - opcion: Caller-declared or unrevalidated paths.
            razon: Descartada por la aprobación actual del maintainer.
        contaminaba: [S4.2, S4.3]
      - tipo: resuelta
        pregunta: ¿Cómo se secuencian los epochs y el puntero current?
        resolucion: Main publishes sequenced epochs and a current pointer; issuance and consumption revalidate the active epoch against that state.
        autoridad: resolución histórica del maintainer preservada en S4.2 y aprobación actual corroborada por Engram 10281
        clase: seguridad-y-permisos
        falsificador: Falsified if a stale, repeated, skipped, or non-current epoch is accepted.
        descartadas:
          - opcion: Caller-provided epoch or no current pointer.
            razon: Descartada por la aprobación actual del maintainer.
        contaminaba: [S4.2, S4.3, S4.4]
      - tipo: resuelta
        pregunta: ¿Quién genera la identidad ejecutable absoluta y versionada?
        resolucion: Install lifecycle generates the absolute versioned executable identity.
        autoridad: resolución histórica del maintainer preservada en S4.2 y aprobación actual corroborada por Engram 10281
        clase: seguridad-y-permisos
        falsificador: Falsified if the executable is resolved through PATH, environment, or caller argument, or mismatches the installed version.
        descartadas:
          - opcion: Ambient discovery or checkout executable.
            razon: Descartada por la aprobación actual del maintainer.
        contaminaba: [S4.2]
      - tipo: resuelta
        pregunta: ¿Qué bootstrap e identidad raíz usa el lanzamiento atendido?
        resolucion: Attended launch uses the installed absolute bootstrap and preserves the root OpenCode identity; subagents cannot replace it.
        autoridad: resolución histórica del maintainer preservada en S4.2 y aprobación actual corroborada por Engram 10281
        clase: seguridad-y-permisos
        falsificador: Falsified if bootstrap is relative or uninstalled, or a subagent replaces root identity.
        descartadas:
          - opcion: Caller/PATH bootstrap and child-as-root.
            razon: Descartada por la aprobación actual del maintainer.
        contaminaba: [S4.2, S4.3]
      - tipo: resuelta
        pregunta: ¿S4.2 usa IDs explícitos de Herdr v1?
        resolucion: The historical v1 resolution is superseded by decision 36; S4.2 proves custody through fixed executable identity and strict Herdr 0.8 responses.
        autoridad: decisión 36 del maintainer del 2026-08-18 y aprobación actual corroborada por Engram 10281
        clase: dependencias-o-evidencia-contradictorias
        falsificador: Falsified if S4.2 requires v1 or accepts a noncanonical session_id.
        descartadas:
          - opcion: Packaged v1 and reattach in S4.2.
            razon: Descartada por la decisión 36 y la aprobación actual del maintainer.
        contaminaba: [S4.2, S4.3]
      - tipo: resuelta
        pregunta: ¿Qué identidad local puede operar el panel y proceso asociados?
        resolucion: Only the same local user may operate the associated panel and process; any different identity fails closed.
        autoridad: resolución histórica del maintainer preservada en S4.2 y aprobación actual corroborada por Engram 10281
        clase: seguridad-y-permisos
        falsificador: Falsified if another user can operate the panel/process or identity is not validated.
        descartadas:
          - opcion: Cross-user trust or no user check.
            razon: Descartada por la aprobación actual del maintainer.
        contaminaba: [S4.2, S4.3]
      - tipo: resuelta
        pregunta: ¿S4.2 deriva autoridad de selección TUI o lineage?
        resolucion: Superseded by decision 36, S4.2 derives no selection or lineage authority and validates only Herdr 0.8 custody for the newly launched process.
        autoridad: decisión 36 del maintainer del 2026-08-18 y aprobación actual corroborada por Engram 10281
        clase: seguridad-y-permisos
        falsificador: Falsified if S4.2 inspects, rehydrates, recovers, or grants selection/lineage authority.
        descartadas:
          - opcion: Reattach, recovery, and selection authority in S4.2.
            razon: Descartada por la decisión 36 y la aprobación actual del maintainer.
        contaminaba: [S4.2, S4.3]
      - tipo: resuelta
        pregunta: ¿S4.2 debía cerrar con custodia inicial, agregar reattach o absorber recuperación/Herdr v1?
        resolucion: S4.2 posee sólo lanzamiento y custodia inicial con Herdr 0.8.0; reattach perdió por duplicar S4.3/S4.4 y recuperación/v1 por expandir alcance.
        autoridad: decisión 36 del maintainer del 2026-08-18
        clase: dependencias-o-evidencia-contradictorias; seguridad-y-permisos
        falsificador: Aceptar un session_id no canónico, exigir el comando v1 o ejecutar inspección o recuperación desde S4.2.
        descartadas:
          - opcion: Agregar reattach.
            razon: Duplicaría S4.3 y S4.4.
          - opcion: Absorber recuperación o Herdr v1.
            razon: Expandiría el alcance de S4.2.
        contaminaba: [S4.2, S4.3, S4.4]
