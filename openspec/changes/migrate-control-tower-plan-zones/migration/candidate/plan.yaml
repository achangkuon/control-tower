    resultado: Supervisión sin armado local
    autoridad: 'Brecha 7 de `implementation-state` y decisiones 26 y 27 del maintainer en el STATUS inmutable S10.2.'
    depende_de: [S10.1]
    criterios:
      - 'Ruta histórica aprobada: design-tasks — cambia la semántica visible de supervisión, con arquitectura fijada por las decisiones 26 y 27; no autoriza una nueva ejecución de S10.2.'
      - 'La Torre supervisa una ejecución sellada en un repositorio sin que ese repositorio quede armado'
      - 'El productor, lector y validador externos atan exactamente proyecto, repositorio, worktree, `base_sha`, `sesion_id`, digest del contrato y vencimiento'
