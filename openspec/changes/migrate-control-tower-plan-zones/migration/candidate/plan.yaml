            consecuencia: Un campo ausente nunca habilita algo que el bloque explícito no habilita.
      - tipo: derivable
        pregunta: ¿Dónde vive la política declarada de un proyecto?
        criterio: En el bloque delivery-policy del AGENTS.md del proyecto, como fuente única legible por máquina.
