  - id: S1.17
    zona: hosts
    resultado: Gate y RED del adapter Pi
    autoridad: Emilio's explicit S1.17 structured Pi authority resolution grounded in immutable decisions 82-84 and 86
    depende_de: [S9.4]
    criterios:
      - RED rejects self-declared identity, takeover, cross-worktree binding, cross-epoch binding, and stale receipts.
      - "Capabilities respect the approved role: implementers retain bash, read-only roles receive no bash, write, or edit, and Intercom never grants authority."
      - The change remains within adapters/pi/contract.mjs and test/adapters/pi/contract.test.mjs and modifies neither Pi nor Intercom.
    decisiones:
      - tipo: resuelta
        resolucion: Tower-owned scope_id, endpoint_epoch, role, and capabilities confer authority; incarnation_id identifies only the neutral incarnation and confers no authority; Pi is the first implementation host while OpenCode remains preserved but is not promoted ahead of Pi; Intercom is transport and confers no assignment or permission authority.
        autoridad: Emilio's current explicit authorization grounded in immutable S1.17 STATUS decisions 82-84 and 86 and acceptance/closure evidence
        falsificador: Any accepted self-declared, takeover, cross-worktree, cross-epoch, or stale binding; any read-only role receiving bash, write, or edit; or any authority inferred from Intercom or incarnation_id.
        descartadas:
          - opcion: incarnation_id as authority
            razon: Neutral incarnation identity cannot prove Tower ownership and would admit takeover or self-declaration.
          - opcion: Intercom grants authority
            razon: Transport cannot grant assignment, role, or permissions.
          - opcion: read-only roles receive bash, write, or edit
            razon: Immutable S1.17 criteria require role-bounded capabilities.
          - opcion: OpenCode before Pi
            razon: The approved Pi-first promotion superseded the old OpenCode-first deferred route.
        contaminaba: [S1.17]
    ruta:
