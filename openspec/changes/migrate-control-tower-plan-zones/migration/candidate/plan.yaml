  - id: S3.1
    zona: asientos
    resultado: Change C Workspace checkpoint
    autoridad: STATUS contract, autonomous-v2 checkpoint design, and existing Git/canonicalization contracts
    depende_de: [S2.4]
    criterios:
      - Un fixture Git válido produce una captura inmutable con raíz canónica y OIDs completos de commit y árbol para base y result.
      - git -C inyectado, un relativo que escapa y una raíz absoluta distinta fallan cerrados sin efectos mutantes.
      - Un índice vacío, staging drift y cualquier intento de commit -a fallan cerrados.
      - La evidencia raw-bytes y la estructura rfc8785-jcs producen digests SHA-256 verificables y sensibles a alteraciones.
      - La captura no invoca red, push, fetch, PR ni escribe fuera del fixture Git.
      - bun test test/workspace/checkpoint.test.mjs y bun test pasan.
      - El diff toca sólo workspace/checkpoint.mjs y test/workspace/checkpoint.test.mjs.
    decisiones:
      - tipo: derivable
        pregunta: ¿Cómo se seleccionan Git y la raíz canónica?
        criterio: Toda invocación usa execFileSync con argv de sólo lectura y la raíz de rev-parse debe ser absoluta, normalizada y exacta.
        autoridad: validateEnrollmentLayout/defaultGit y matriz Git del diseño C
        evidencia: Contrato inmutable de S3.1 líneas 52-57.
        checkpoint: antes de T3.1.1.1
        opciones:
          - opcion: Rechazar -C, relativos que escapan y absolutos distintos.
            consecuencia: Ningún input hostil llega a Git ni produce una captura.
      - tipo: derivable
        pregunta: ¿Qué referencias forman base y result?
        criterio: Cada referencia contiene OID completo de commit y su árbol resuelto explícitamente.
        autoridad: matriz Commit/Git de autonomous-v2-checkpointed-delivery
        evidencia: Contrato inmutable de S3.1 líneas 58-63.
        checkpoint: antes de T3.1.1.2
        opciones:
          - opcion: Registrar commit y tree OID completos.
            consecuencia: Nunca se acepta una rama, OID abreviado o árbol implícito.
      - tipo: derivable
        pregunta: ¿Cuándo se rechaza el estado local?
        criterio: Staging vacío o distinto del árbol esperado se rechaza y no se emite argv mutante.
        autoridad: T3.1.1.2 aprobada y recorder de test/enroll/enroll.test.mjs
        evidencia: Contrato inmutable de S3.1 líneas 64-68.
        checkpoint: antes de capturar
        opciones:
          - opcion: Fallar cerrado ante índice vacío o drift.
            consecuencia: Sólo se capturan archivos y árboles explícitos.
      - tipo: derivable
        pregunta: ¿Cómo se prueba la evidencia de bytes y modo?
        criterio: Bytes usan raw-bytes y estructura usa rfc8785-jcs; cualquier cambio de bytes o modo cambia el digest o falla validación.
        autoridad: canonicalize y digestArtifact en contracts/canonicalize.mjs
        evidencia: Contrato inmutable de S3.1 líneas 69-74.
        checkpoint: antes de T3.1.1.4
        opciones:
          - opcion: Digerir bytes y estructura con sus codificaciones canónicas.
            consecuencia: Cambios de bytes o modo no conservan un digest válido.
    ruta:
      propuesta: direct
      autoridad: STATUS contract and autonomous-v2 checkpoint design
    entrega:
      commit: d8924a6179108651184976b3e147425ebd9b18fd
    importacion_legacy:
      origen_commit: 43130ad40af06f3ed05671000719217bee74f0a5
      origen_ruta: openspec/plans/plan-3/STATUS.md
      origen_blob: 5f5f34e8775bfb6dbdd0cb550126a57985dc3d3d
      origen_encabezado: "## Sesión 3.1 — Change C Workspace checkpoint"
      territorio_pendiente: false
    modulos:
