        resultado: Checkpoint
        rutas: [workspace/checkpoint.mjs, test/workspace/checkpoint.test.mjs]
        tareas:
          - id: T3.1.1.1
            accion: "RED: selección Git por argv fijo y raíz canónica; rechazar git -C inyectado, relativo que escapa y raíz absoluta que no coincide."
            resultado: Los inputs hostiles fallan antes de implementar la captura.
