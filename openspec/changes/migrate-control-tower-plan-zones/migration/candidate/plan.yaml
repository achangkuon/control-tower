        autoridad: main-store/store.mjs
        evidencia: Contrato inmutable S3.4.
        checkpoint: antes de M3.4.1
        opciones: [{opcion: Reusar el store Main, consecuencia: No existe un segundo store de autoridad.}]
      - tipo: derivable
        pregunta: ¿Qué transiciones son legales?
        criterio: El enum jornada-v1 y sus cuatro estados terminales irreversibles.
        autoridad: jornada-v1 y precedente de autorizaciones
        evidencia: Contrato inmutable S3.4.
        checkpoint: antes de M3.4.2
        opciones: [{opcion: Aplicar la máquina cerrada, consecuencia: Ningún terminal vuelve a estado activo.}]
      - tipo: derivable
        pregunta: ¿Qué ocurre con jornada_revision en una transición?
        criterio: Sube en toda transición sin excepción.
        autoridad: decisión de disponibilidad de S3.3
        evidencia: Contrato inmutable S3.4.
        checkpoint: antes de persistir transición
        opciones: [{opcion: Incrementar siempre, consecuencia: Bindings anteriores fallan por drift.}]
      - tipo: derivable
        pregunta: ¿Qué ocurre con una Jornada vencida por reloj sin transición?
        criterio: La lectura la reporta vencida sin mutar ni depender de un barrido.
        autoridad: floor fail-closed del proyecto
        evidencia: Contrato inmutable S3.4.
        checkpoint: al leer
        opciones: [{opcion: Derivar expiración en lectura, consecuencia: ACTIVE nunca sobrevive al expires_at.}]
      - tipo: resuelta
        pregunta: ¿Terminar una Jornada revoca activamente capabilities y autorizaciones?
        resolucion: No; incrementa jornada_revision y la invalidación ocurre pasivamente al revalidar, sin garbage collector.
        autoridad: decisión del maintainer del 2026-08-04
        falsificador: Cualquier ruta que mute una capability o autorización al terminar una Jornada.
        descartadas:
          - opcion: Revocación activa en cascada.
            razon: Expande alcance y no es necesaria para fallar cerrado por drift.
        contaminaba: [S5.1]
