  - id: S3.3
    resultado: Agent Capability Registry
    autoridad: S3.3 STATUS contract and maintainer decisions of 2026-08-04
    depende_de: [S3.2]
    criterios:
      - Una capability se resuelve por rol y proyecto sin cruzar entradas entre proyectos.
      - Una entrada vencida no resuelve y el rechazo es explícito.
      - Binding de Jornada ausente, revisión distinta o reloj pasado expires_at falla cerrado.
      - CAS R1 a R2 invalida todos los bindings de R1.
      - registry_entry_revision inicia en 1 y sólo sube cuando cambia el contenido canonicalizado.
      - Un agente no puede registrarse a sí mismo.
      - Drift entre schema declarado e invocado falla cerrado.
      - Escritura sin capability de Main asertada falla cerrado.
      - Symlink, modos inseguros, dueño ajeno, lock ocupado y revisión stale se rechazan igual que en registry/store.mjs.
      - El registry no crea, valida ni consume autoridad ni habilita Support a Worker.
      - agent-capability-registry-v1 está registrado y tiene fixture.
      - bun test test/capabilities test/contracts test/registry pasa completo.
      - bun test no introduce fallos nuevos sobre S3.2 con Torre desarmada.
      - El diff no toca Prohibido.
    decisiones:
      - tipo: derivable
        pregunta: ¿Cuál es la forma de una entrada?
        criterio: El schema enumera identidad de proyecto/Main, revisiones, caller/rol, capability, schemas, origen y ventana de disponibilidad.
        autoridad: schemas/agent-capability-registry-v1.schema.json
        evidencia: Contrato inmutable S3.3.
        checkpoint: antes de M3.3.1
        opciones: [{opcion: Usar exactamente el schema, consecuencia: Código y contrato exigen los mismos campos.}]
      - tipo: derivable
        pregunta: ¿Qué hace una entrada vencida?
        criterio: No resuelve y el rechazo es explícito.
        autoridad: criterios de S3.3
        evidencia: Contrato inmutable S3.3.
        checkpoint: antes de resolver
        opciones: [{opcion: Rechazar explícitamente, consecuencia: El caller no confunde expiración con ausencia.}]
      - tipo: derivable
        pregunta: ¿Puede el registry otorgar autoridad?
        criterio: No; sólo visibilidad y compatibilidad, con autoridad exclusiva de Main.
        autoridad: límite duro de S3.3
        evidencia: Contrato inmutable S3.3.
        checkpoint: antes de resolver
        opciones: [{opcion: Mantener autoridad exclusiva de Main, consecuencia: Ninguna entrada habilita operaciones por sí sola.}]
      - tipo: derivable
        pregunta: ¿Qué pasa con bindings previos ante CAS R1 a R2?
        criterio: Todos los bindings R1 dejan de resolver.
        autoridad: alcance aprobado de S3.3
        evidencia: Contrato inmutable S3.3.
        checkpoint: antes de update
        opciones: [{opcion: Invalidar por registry_revision, consecuencia: Ningún binding R1 sobrevive.}]
      - tipo: resuelta
        pregunta: ¿Cuánto dura por defecto una entrada?
        resolucion: Expira con su Jornada, materializando expires_at al emitirla; la revocación anticipada queda pasiva hasta S3.4.
        autoridad: decisión del maintainer del 2026-08-04
        falsificador: Una entrada resuelve después de expires_at o sin binding de Jornada.
        descartadas: []
        contaminaba: [S5.1, S5.4]
      - tipo: resuelta
        pregunta: ¿De dónde sale la escritura atómica del registry?
        resolucion: Implementación propia dentro de capabilities/registry.mjs con paridad observable respecto de registry/store.mjs.
        autoridad: decisión del maintainer del 2026-08-04
        falsificador: Un caso de seguridad que una implementación rechaza y la otra acepta.
        descartadas:
          - opcion: Parametrizar registry/store.mjs.
            razon: Tocaría un componente en producción con pruebas propias.
        contaminaba: [S3.3]
      - tipo: derivable
        pregunta: ¿De dónde sale la autoridad de Main para escribir?
        criterio: bindMainAuthority(...).assert(capability, expected) es la única puerta.
        autoridad: main-store/authority.mjs
        evidencia: Contrato inmutable S3.3.
        checkpoint: antes de escribir
        opciones: [{opcion: Reusar assertMain existente, consecuencia: No aparece autoridad sombra.}]
    entrega: {commit: 4621d3f333c4d523b66a7595a33e8abcd7642700}
