        autoridad: Decisión 41 del maintainer del 2026-08-18.
        falsificador: Aparece una copia íntegra del design.md con SHA-256 a349747ceb0580ef700155499125c89a025232e85ec64677d65d8e8d0bff29b1, o el criterio 2 vuelve a exigir preservación sin un mecanismo inmutable que la sostenga.
