            resultado: "RED: fijar orden acquire/validate/publish, ausencia compatible, no exposición de close, fallo y cuarentena."
            criterios: ["RED: fijar orden acquire/validate/publish, ausencia compatible, no exposición de close, fallo y cuarentena."]
