  - id: S1.18
    zona: hosts
    resultado: Adapter Pi/Intercom y reporte terminal asíncrono
    autoridad: decisions 80, 83, 84, 86, 104, and 105; Engram observations 10008, 10019, 10020, and 10028
    depende_de: [S1.17]
    recurso: ["procesos Pi Tower-spawned, conexión Intercom del supervisor y namespace de dispatch_id"]
    criterios:
      - launch/observe/health/stop/attach implement the neutral port and the injected seam crosses Tower-owned PID/cwd; nonce and endpointEpoch prove attach.
      - Every assignment emitted by Main carries a stable dispatch_id; the adapter returns after send acknowledgment and never awaits ordinary Support or worker work.
      - send transports progress and closure; ask is used only for a true human decision and produces recoverable BLOCKED, never progress polling.
      - Every dispatch_id produces exactly one terminal COMPLETED, BLOCKED, or FAILED; COMPLETED includes evidence references, changed paths, and tests, while BLOCKED/FAILED include reason and recoverability.
      - ON preserves Tower-owned binding, persistence, acknowledgment, and retry; OFF does not fabricate that guarantee and uses only maintainer-approved live peers.
      - IDs are random, foreign processes are never adopted, Pi and Intercom are unchanged, and the diff stays within the declared Area.
    decisiones:
      - tipo: resuelta
        resolucion: Pi Intercom is the normal Main-to-Support-to-worker transport and never grants authority; Tower ON uses Tower-owned binding, persistence, acknowledgment, and retry, while Tower OFF uses only maintainer-approved live peers and preserves Main and human authority.
        autoridad: decision 104 and Engram observation 10008
        falsificador: An Intercom message creates authority or an ON send lacks binding, acknowledgment, or retry.
        descartadas:
          - opcion: Intercom grants authority
            razon: Intercom is transport only and cannot grant assignment, role, permissions, or human authority.
        contaminaba: [S1.18]
      - tipo: derivable
        pregunta: What internal terminal report shape follows from the approved dispatch contract?
        criterio: Every assignment binds one unique dispatch_id and terminates exactly once as COMPLETED, BLOCKED, or FAILED with a causal reference and state-appropriate evidence or recoverability.
        autoridad: decision 104 and immutable S1.18 STATUS lines 346-397
        evidencia: The approved dispatch_id and single-terminal contract in immutable S1.18 STATUS lines 346-397.
        checkpoint: before dispatch and terminal reporting
        opciones:
          - opcion: Emit one causally referenced terminal report for the unique dispatch_id.
            consecuencia: COMPLETED carries evidence references, changed paths, and tests; BLOCKED or FAILED carries reason and recoverability, and no second successful terminal is delivered.
      - tipo: resuelta
        resolucion: Preserve one Session and deliver remediation as two sequential direct commits, first lifecycle plus acknowledged dispatch and then retryable terminal delivery plus immutable decision snapshot.
        autoridad: decision 105, Engram observations 10019 and 10020, and immutable S1.18 STATUS lines 346-397
        falsificador: Ownership is validated after stop; successful disappearance after stop is treated as failure; the only terminal is lost after delivery failure; more than one terminal is delivered successfully; or a decision request mutates across an await.
        descartadas:
          - opcion: Repair the original one-397-line candidate as one commit.
            razon: The candidate was already 397 of 400 authored lines and the verified lifecycle, terminal retry, and immutable-snapshot defects could not be corrected honestly without code-golf.
        contaminaba: [S1.18]
    ruta:
      propuesta: direct
