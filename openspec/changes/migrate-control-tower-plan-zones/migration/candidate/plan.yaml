  - id: S9.1
    resultado: Pool de asientos permanentes y asignación por Main
    autoridad: Contrato propietario de la Sesión, decisión 51 y evidencia de entrega integrada en el commit 56753b4e948a5681ec75cc98782a9c0576c239fe.
    depende_de: []
    recurso: [registro de asientos, binding de asignación]
    criterios:
      - El pool fijo contiene tres asientos permanentes que no se crean ni destruyen por Sesión.
      - El rol y la lane pertenecen a la asignación y no especializan el asiento.
      - Los asientos son intercambiables y el primer asiento libre se elige en orden determinista.
      - Main consulta asientos libres y liga path, rama y base_sha sin persistir ocupación.
      - La rama cumple el formato tipo/sesión-slug antes de elegir un asiento.
      - Un pool lleno falla cerrado sin crear un cuarto asiento.
      - El reciclador manual permanece intacto y la asignación no cambia rama ni base.
    decisiones:
      - tipo: resuelta
        pregunta: ¿Cuál es el tamaño fijo del pool permanente?
        resolucion: Tres asientos; uno planificando, uno implementando y uno libre para una urgencia.
        autoridad: Decisión 51 y resolución explícita del maintainer del 2026-08-21 en el contrato inmutable de S9.1.
        clase: expansion-de-alcance; dinero-precios-o-cuotas
        falsificador: Un pool de tres no puede atender el patrón real sin crear asientos nuevos, o la implementación crea un cuarto asiento.
        descartadas:
          - opcion: Mantener un tamaño abierto o crear asientos por Sesión.
            razon: Abriría costo indefinido y rompería el pool permanente aprobado.
          - opcion: Usar menos de tres asientos.
            razon: No cubre simultáneamente planificación, implementación y una urgencia.
        contaminaba: [S9.1, S9.3]
    entrega:
      commit: 56753b4e948a5681ec75cc98782a9c0576c239fe
