  - id: S3.2
    resultado: Change D Global/project Policy/Jornada
    autoridad: role-routed-continuation tasks, REQUIREMENTS §15.3/§22, AGENTS.md delivery policy, and maintainer resolutions
    depende_de: [S3.1]
    recurso: [Main filesystem CAS in main-store/store.mjs; no SQLite migration, db-writer, or delivery token]
    criterios:
      - Un campo de política ausente resuelve al valor más restrictivo y el motivo queda nombrado con CT_POLICY_UNRESOLVED.
      - Un bloque no parseable, con valor desconocido, o no ligado, falla cerrado sin default permisivo.
      - Una fuente de política por symlink, que escapa de la raíz, o de raíz ajena, se rechaza sin leerla.
      - Una política de proyecto más permisiva que la global resuelve al valor global.
      - Un repositorio sin bloque delivery-policy se comporta exactamente igual que antes de que el bloque existiera.
      - Ningún valor de política ni excepción alcanza un floor; los cinco casos se rechazan nombrando el floor violado.
      - Un registro de autoridad persistido sin identidad de actor falla cerrado, y esa identidad sobrevive al commit.
      - Una autorización consumida pasado su expires_at se rechaza.
      - Los seis schemas validan contra sus fixtures y están registrados en contracts/schema-registry.mjs.
      - Los bytes de los contratos V1 aceptados no cambian y test/provenance/provenance.test.mjs sigue verde.
      - Policy resuelve elegibilidad y nunca ruteo; ninguna ruta de policy/ crea ni modifica un assignment.
      - bun test test/contracts test/main-store.test.mjs test/policy pasa completo.
      - bun test no introduce fallos nuevos sobre la línea base de S3.1, con la Torre desarmada.
      - El diff de implementación no toca ninguna ruta del Prohibido.
    decisiones:
      - tipo: derivable
        pregunta: ¿Qué valor toma un campo de política ausente?
        criterio: El valor más restrictivo; un repositorio sin bloque delivery-policy se comporta exactamente igual que antes de que el bloque existiera.
        autoridad: corte política/seguridad de d232fdf y bloque delivery-policy de AGENTS.md
        evidencia: Contrato inmutable de S3.2.
        checkpoint: antes de M3.2.2
        opciones:
          - opcion: Resolver al valor más restrictivo.
            consecuencia: Un campo ausente nunca habilita algo que el bloque explícito no habilita.
      - tipo: derivable
        pregunta: ¿Dónde vive la política declarada de un proyecto?
        criterio: En el bloque delivery-policy del AGENTS.md del proyecto, como fuente única legible por máquina.
        autoridad: AGENTS.md
        evidencia: Contrato inmutable de S3.2.
        checkpoint: antes de M3.2.3
        opciones:
          - opcion: Leer una única fuente en AGENTS.md.
            consecuencia: No existen dos fuentes del árbol que respondan la misma pregunta de política.
      - tipo: derivable
        pregunta: ¿Qué gana cuando la política global y la del proyecto difieren?
        criterio: El valor más restrictivo de los dos; la herencia acota y nunca amplía.
        autoridad: floors de seguridad de d232fdf
        evidencia: Contrato inmutable de S3.2.
        checkpoint: antes de M3.2.2
        opciones:
          - opcion: Aplicar intersección restrictiva.
            consecuencia: Una política local más permisiva no vence el floor global.
      - tipo: resuelta
        pregunta: ¿Puede una excepción acotada relajar un floor de seguridad?
        resolucion: No; ninguno de los cinco floors puede relajarse por configuración ni excepción.
        autoridad: decisión del maintainer del 2026-08-04 registrada en master-index
        falsificador: Cualquier ruta en la que una excepción registrada habilite una operación que el floor prohíbe.
        descartadas:
          - opcion: Permitir excepciones sobre los floors.
            razon: Rompería inmutabilidad, autoridad única de Main, no autoasignación, no mutación temprana o ledger append-only.
        contaminaba: [S5.1, S5.2, S7.1]
      - tipo: resuelta
        pregunta: ¿Qué queda registrado en la auditoría de una excepción?
        resolucion: Un evento de autoridad §15.3 con identidad, objetivo, regla cerrada, alcance verificable, otorgante, autorización, vigencia, resultado y cadena de digests por entrega; la justificación se conserva sólo como digest y puntero externo.
        autoridad: REQUIREMENTS §15.3 y §22 y decisión del maintainer del 2026-08-04
        falsificador: Un registro que no permita reconstruir quién otorgó la excepción y contra qué revisión de política.
        descartadas:
          - opcion: Persistir justificación como texto libre.
            razon: Puede filtrar secretos y vuelve irreconciliable el borrado de §22 con el ledger append-only.
          - opcion: Encadenar hashes por proyecto.
            razon: Serializaría la punta contra CAS; la cadena aprobada es por entrega.
        contaminaba: [S7.1]
      - tipo: derivable
        pregunta: ¿Qué reglas pueden figurar en excepted_rule?
        criterio: Exactamente effective_limits, delivery.shape, delivery.target_branch, planning.horizon_ceiling, documentation_close.*, allowed_operations y allowed_hosts; ningún floor.
        autoridad: resolución de floors de S3.2
        evidencia: Contrato inmutable de S3.2.
        checkpoint: antes de M3.2.3
        opciones:
          - opcion: Enumerar sólo la superficie configurable.
            consecuencia: Ningún valor del enum puede nombrar un floor.
    entrega:
