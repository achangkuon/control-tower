candidate_base:
  commit: 1155433c76e3098837335cbe5478dcfd39a71578
  tracked_inventory:
    command: >-
      WORKTREE_TRACKED_FILES=$(mktemp) && git ls-files -z | tr '\0' '\n' | sort > "$WORKTREE_TRACKED_FILES"
    file_count: 544
    sha256: 6828a2eb67fb2bfa4a0bc7d0bed12c18ec58a623e4b272571384a0b95fe01e87
    retained_temp_file: false

policy:
  match_forms: [directory-prefix, exact-file]
  broad_cimientos_allowed: false
  required_results:
    orphaned_files: 0
    overlaps: 0
    unused_rules: 0
  metodo_contract: >-
    The metodo Zone owns every tracked file below agent-workflows/. No Cimiento
    carve-out is required for the declared candidate base.

