        - mcp.mjs
        - radiografia.json
        - validate-compact-message.py
    - categoria: cross-zone-test-infrastructure
      razon: Root console tests, behavioral tests, fixtures, helpers, and provenance checks exercise shared contracts rather than one Zone.
