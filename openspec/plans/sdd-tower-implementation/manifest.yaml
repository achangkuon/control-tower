jornada_policy:
  default_preset: standard
  allowed_presets:
    - short
    - standard
    - extended
delivery_policy:
  automatic_commit: true
  automatic_push: true
  automatic_pr: true
  automatic_merge: false
slices:
  - slice_id: mechanism-p6-recovery
    goal: Complete proof-bound recovery and rollback in the plan-agnostic substrate.
    dependencies: []
    openspec_change: autonomous-continuation-control-tower
    acceptance_refs:
      - requirement-gate-f
  - slice_id: mechanism-p7-opencode
    goal: Complete the host-neutral polling loop and OpenCode adapter.
    dependencies:
      - mechanism-p6-recovery
    openspec_change: p7-host-neutral-loop-opencode-adapter
    acceptance_refs:
      - requirement-gate-c
  - slice_id: mechanism-p8-pi
    goal: Complete the Pi adapter over the reconciled host-neutral controller.
    dependencies:
      - mechanism-p7-opencode
    openspec_change: p8-slice-planning
    acceptance_refs:
      - requirement-gate-c
  - slice_id: mechanism-p9-claude
    goal: Complete the optional Claude adapter conformance surface.
    dependencies:
      - mechanism-p7-opencode
    openspec_change: autonomous-continuation-control-tower
    acceptance_refs:
      - requirement-host-conformance
  - slice_id: mechanism-p10-runtime
    goal: Publish a versioned runtime with verified cutover and rollback.
    dependencies:
      - mechanism-p8-pi
      - mechanism-p9-claude
    openspec_change: autonomous-continuation-control-tower
    acceptance_refs:
      - requirement-gate-b
  - slice_id: mechanism-p11-verification
    goal: Complete CT-only verification and handoff evidence.
    dependencies:
      - mechanism-p10-runtime
    openspec_change: autonomous-continuation-control-tower
    acceptance_refs:
      - requirement-gate-b
  - slice_id: product-a-contract-schemas
    goal: Implement schemas, canonicalization, validators, fixtures, and Main store primitives.
    dependencies: []
    openspec_change: sdd-tower-contract-schemas
    acceptance_refs:
      - requirement-gate-a
  - slice_id: product-b-project-registry
    goal: Implement path-neutral project enrollment, resolution, and Main rederivation.
    dependencies:
      - product-a-contract-schemas
    openspec_change: sdd-tower-project-registry
    acceptance_refs:
      - requirement-gate-b
  - slice_id: product-c-workspace-manager
    goal: Implement deterministic inspect, create, and retire for ephemeral worktrees.
    dependencies:
      - product-a-contract-schemas
      - product-b-project-registry
    openspec_change: sdd-tower-workspace-manager
    acceptance_refs:
      - requirement-workspace-manager
  - slice_id: product-d-main-policy-jornada
    goal: Implement Main routing, Policy, Support reports, jornadas, and assignments.
    dependencies:
      - product-a-contract-schemas
      - product-b-project-registry
      - mechanism-p6-recovery
    openspec_change: sdd-tower-main-policy-jornada
    acceptance_refs:
      - requirement-gate-c
  - slice_id: product-e-host-launcher
    goal: Implement single-host session launch and exclusive OpenCode-to-Pi failover.
    dependencies:
      - product-c-workspace-manager
      - product-d-main-policy-jornada
      - mechanism-p7-opencode
      - mechanism-p8-pi
    openspec_change: sdd-tower-host-launcher
    acceptance_refs:
      - requirement-gate-c
      - requirement-gate-f
  - slice_id: product-f-telegram-delivery
    goal: Implement idempotent delivery and exact Telegram merge authorization.
    dependencies:
      - product-a-contract-schemas
      - product-b-project-registry
      - product-d-main-policy-jornada
    openspec_change: sdd-tower-telegram-delivery
    acceptance_refs:
      - requirement-gate-e
  - slice_id: product-g-continuous-loop
    goal: Implement planning, reconciliation, Binding Delta publication, and next-slice continuation.
    dependencies:
      - product-a-contract-schemas
      - product-c-workspace-manager
      - product-d-main-policy-jornada
      - product-e-host-launcher
      - product-f-telegram-delivery
    openspec_change: sdd-tower-continuous-slice-loop
    acceptance_refs:
      - requirement-gate-d
  - slice_id: product-h-campaigns
    goal: Implement ordered multi-repository campaigns with local Main authority and compensation.
    dependencies:
      - product-b-project-registry
      - product-d-main-policy-jornada
      - product-f-telegram-delivery
      - product-g-continuous-loop
    openspec_change: sdd-tower-multi-repo-campaigns
    acceptance_refs:
      - requirement-gate-g
  - slice_id: product-i-conformance
    goal: Validate the integrated V1 product through bounded end-to-end pilots.
    dependencies:
      - mechanism-p11-verification
      - product-h-campaigns
    openspec_change: sdd-tower-v1-conformance-pilot
    acceptance_refs:
      - requirement-gates-a-through-g
constraints:
  - Control Tower remains plan-agnostic.
  - Exactly one execution host is active per jornada.
  - Every merge requires exact maintainer authorization.
  - Unknown or contradictory evidence fails closed.
non_goals:
  - automatic-merge
  - mixed-host-concurrent-writers
  - hermes-filesystem-ownership
  - distributed-atomicity
  - generalized-deploy-orchestration
binding_delta_refs: []
campaign_refs: []
