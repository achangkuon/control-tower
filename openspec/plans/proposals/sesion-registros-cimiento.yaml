# Proposed Sesión — Extract the three cross-Zona registries
#
# Authored 2026-09-04 in schema v3 (Zonas), as a standalone fragment, for the same reason as
# `sesion-skill-herdr-runtime.yaml`: the plan this joins is the one Fase B is rebuilding.
#
# Integration: append the `sesiones` entry to the candidate plan and add every
# `cimientos_a_declarar` path to `cimientos.rutas` in the same edit. Identifiers are null on
# purpose — Fase B owns the flat sequence (§8), and `radar check` refuses a null id, so the
# assignment cannot be skipped.
#
# Evidence: openspec/plans/audits/cross-zona-registry-audit.md (Audit G)
#
# Ordering note: the three Módulos run smallest first. `payload-closure` proves the pattern on
# six paths, `tower-role-assets` repeats it on the case that started this, and
# `runtime-payload` applies it to fifty-five paths across six Zonas last. Each is one
# independently revertible commit, so a Módulo that turns out harder can be parked without
# holding the other two.

schema: plan-session-proposal
schema_version: 1
producto: control-tower
target_schema: {schema: plan, schema_version: 3}

cimientos_a_declarar:
  - test/install/payload-closure.contract.mjs
  - test/install/tower-role-assets.contract.mjs
  - test/install/runtime-payload.contract.mjs

sesiones:
  - id: null   # assigned at integration
    zona: instalacion
    resultado: The install registries stop forcing cross-Zona edits
    autoridad: openspec/plans/audits/cross-zona-registry-audit.md
    depende_de: []
    cimientos:
      - test/install/payload-closure.contract.mjs
      - test/install/tower-role-assets.contract.mjs
      - test/install/runtime-payload.contract.mjs
    criterios:
      - "Each of the three registries is split in two: a `*.contract.mjs` holding only the
        enumerated data, and the original `*.test.mjs` holding only logic, importing that data."
      - "Every extracted value is byte-identical to what it replaced. Falsifier: any diff between
        the old inline literal and the new module's export, beyond formatting, fails this
        criterion."
      - "The full suite passes before and after each Módulo, with no assertion weakened, removed
        or made conditional to accommodate the split."
      - "`radar check` reports 0 orphaned files, 0 overlaps and 0 unused rules with the three
        `*.contract.mjs` paths declared in `cimientos.rutas`."
      - "`owners()` resolves each new `*.contract.mjs` to `cimientos` alone, not to
        `cimientos + instalacion`. Falsifier: two owners means the exact-file carve-out did not
        apply and the partition is now genuinely overlapping."
      - "No file moves directory. Falsifier: any path outside `test/install/` in the diff means
        the carve-out was not used and `instalacion` lost territory it should have kept."
      - "`install/runtime-payload.mjs` is untouched. Its list is generated
        (`<generated:runtime-payload>`) and carries no defect; editing it would be scope the
        audit explicitly excluded."
    decisiones:
      - tipo: derivable
        pregunta: >-
          Whether to generate the three lists instead of extracting them.
        resolucion: >-
          No. Extract. Generation is the stronger remedy and is already used where it applies,
          but none of these three lists is derivable.
        autoridad: openspec/plans/audits/cross-zona-registry-audit.md §3
        falsificador: >-
          `ASSET_CONTRACTS` holds expected frontmatter values and three sets of regex `markers`
          pinning exact sentences; no tool computes those from the tree. The two golden lists are
          deliberately hand-authored, and a golden generated by the code it checks proves nothing.
          If any of the three could be computed from the repository, this resolution is wrong.
      - tipo: derivable
        pregunta: >-
          Whether the extracted modules must move out of `test/install/`.
        resolucion: >-
          No. They stay put and are declared as exact-file Cimientos.
        autoridad: "agent-workflows/tools/radar/partition.go:81-83"
        falsificador: >-
          An exact-file Cimiento carves a file out of one broad Zona route, covered by
          `TestCimientoExactoRecortaUnaRutaAmpliaDeZona`. If `owners()` returned two owners for a
          declared exact path under a broad route, moving would be required after all.
    ruta:
      propuesta: direct
      autoridad: >-
        Three mechanical extractions with no unresolved design question. The data to move is
        already delimited in each file, the target shape is fixed by the existing
        `<generated:runtime-payload>` precedent, and the partition mechanism is tested.
    modulos:
      - id: null   # M<sesión>.1 — smallest first, proves the pattern
        resultado: payload-closure registry extracted and declared
        rutas:
          - test/install/payload-closure.contract.mjs
          - test/install/payload-closure.test.mjs
        tareas:
          - id: null
            accion: >-
              Move the expected entrypoint set out of `test/install/payload-closure.test.mjs`
              into `test/install/payload-closure.contract.mjs` and import it back.
            resultado: The data lives in its own module; the test reads it.
            criterios:
              - "`bun test test/install/payload-closure.test.mjs` passes."
              - "The test file contains no repo-relative path literal owned by another Zona."
          - id: null
            accion: >-
              Prove the extracted values are unchanged by diffing the new export against the
              literal removed in the previous commit.
            resultado: Evidence that the split moved bytes and changed no expectation.
            criterios:
              - "`git show HEAD~1 -- test/install/payload-closure.test.mjs` and the new module
                agree on every path, in the same order."
          - id: null
            accion: >-
              Declare `test/install/payload-closure.contract.mjs` in `cimientos.rutas` and run
              `radar check`.
            resultado: The partition owns the extracted data.
            criterios:
              - "`radar check` reports 0 orphaned files, 0 overlaps, 0 unused rules."
              - "`owners()` returns `cimientos` alone for the new path."
      - id: null   # M<sesión>.2
        resultado: tower-role-assets registry extracted and declared
        rutas:
          - test/install/tower-role-assets.contract.mjs
          - test/install/tower-role-assets.test.mjs
        tareas:
          - id: null
            accion: >-
              Move `ASSET_CONTRACTS` and the three constants it depends on
              (`PROFILE_FRONTMATTER_KEYS`, `SKILL_FRONTMATTER_KEYS`, `SKILL_SECTIONS`) into
              `test/install/tower-role-assets.contract.mjs` and import them back.
            resultado: 96 lines of data leave the test; 188 lines of logic stay.
            criterios:
              - "`bun test test/install/tower-role-assets.test.mjs` passes."
              - "All three `markers` regex sets survive verbatim; none is weakened."
          - id: null
            accion: >-
              Prove the extracted contract is unchanged, including every regex marker.
            resultado: Evidence that no expectation moved with the data.
            criterios:
              - "Each of the six asset entries matches its previous definition field by field."
          - id: null
            accion: >-
              Declare `test/install/tower-role-assets.contract.mjs` in `cimientos.rutas` and run
              `radar check`.
            resultado: Skills and profiles are declared from shared terrain.
            criterios:
              - "`radar check` reports 0 orphaned files, 0 overlaps, 0 unused rules."
              - "A Sesión owning a skill or a profile can now reserve this file instead of
                needing the `instalacion` Zona."
      - id: null   # M<sesión>.3 — largest last
        resultado: runtime-payload golden extracted and declared
        rutas:
          - test/install/runtime-payload.contract.mjs
          - test/install/runtime-payload.test.mjs
        tareas:
          - id: null
            accion: >-
              Move `CANONICAL_RUNTIME_PAYLOAD` into `test/install/runtime-payload.contract.mjs`
              and import it back, leaving the comparison against the generated
              `RUNTIME_PAYLOAD_FILES` exactly as it is.
            resultado: The golden lives in shared terrain; the comparison stays in the test.
            criterios:
              - "`bun test test/install/runtime-payload.test.mjs` passes."
              - "The golden is still compared against the generated list; the test does not
                import the generated list as its own expectation."
          - id: null
            accion: >-
              Prove all 55 paths survive in order and that the golden still fails when the
              generated list diverges.
            resultado: The test still proves what it existed to prove.
            criterios:
              - "The extracted list matches the removed literal path for path, in order."
              - "Temporarily perturbing one entry makes the suite fail; the perturbation is
                reverted before the commit."
          - id: null
            accion: >-
              Declare `test/install/runtime-payload.contract.mjs` in `cimientos.rutas` and run
              `radar check` plus the full suite.
            resultado: Six Zonas can update the golden without entering `instalacion`.
            criterios:
              - "`radar check` reports 0 orphaned files, 0 overlaps, 0 unused rules."
              - "The full suite passes."

notas_de_integracion:
  - >-
    Assign the flat identifiers at integration and never renumber them (§8). `radar check`
    rejects a null id (`check.go:156-158`), so this cannot be forgotten.
  - >-
    `depende_de` is empty. This Sesión and the Herdr skill Sesión are independent: this one
    reserves three `test/install/*.contract.mjs` paths, the other reserves two under `skills/`,
    and the reservations are disjoint. Under §13 they may run concurrently — but only once both
    are `zona: cimientos` or in different Zonas. As authored, both sit in `instalacion`, so §3
    serialises them. Integrating this Sesión first is what lets the Herdr Sesión move to
    `zona: cimientos` later; doing so is a separate decision, not part of either Sesión.
  - >-
    Reserving a path that does not exist yet is valid. `exactRepoFile` (`safety.go:59-79`) stops
    walking at the first missing component and returns the normalised path, so the three
    `*.contract.mjs` reservations validate before the files are written.
  - >-
    `install/runtime-payload.mjs` is deliberately untouched. Audit G §2 records that its list is
    generated from the import graph by `scripts/payload-closure.mjs`, itself already a Cimiento,
    so it carries no cross-Zona edit to remove.
